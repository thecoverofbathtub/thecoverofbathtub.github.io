<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"tj0wLNXvmz3/Z/X0/YkfDw==","nonce":"WwiM9BABgOheszaq","ciphertext":"X7FdQfus7AGioIdVyre65YT8r1H/nJ/r2k6V4YyHk7y0wWuCc3OR1VLqgZG3Md2EeQvtgw8mxtYRQxxm1lw15UdjrDj3YaRmIbt5M9mIiQZdYyYDzfjajvfi32laITv1PO6I607nlrB5hW7s+CjBfRzSbAmQXhUJD0q1JJqTc5l9VVe89flVacGZCuwOx38jEYsxeFQ6Ot5vkEb7iIjKrV6lWQVHSKy/ZBT9QWsIOiI6Z3/ALhGGIKAPEtcKiETBsNK5YxuHh1KpWOODL23SQQnoohhnwwDYRtUtGjExqfF7Xx081EoidHuAXkc9CkxVo1gncRq9J8PDhcbTwSDO+W2+47jERaROx8DZdZagpJ+c+/GMN32+tB6a55a+vNPMfvuQhmviCTvnrmCxqtsFw7kxTbW0ReqmibC7Ctx6neDntOxXCL5k7JqtydgPlgOqWqpdkiVbZ6ak6BSAtIKsHkixW/O/7D3bP2UeMUDSJsDYml/+kk+UrG66EKsSmxK+aGE8canjbl/cJL8Hz0MS2b3/rGIpo2pZ/phYlB3n0IwaYw+AAkVzQt18nMjz4lujeniT9ryJx7DUKasrHeCHAMey0kTzvrvlS+GB7IrR8L2OfQq7yUW844xFIY7pH+JGQYjcbWywG6+krOJ/mYda7XnF+tyBxjT52qm2pylxHJaNc4op3Yz9+gZhuBXgox6t36lOJORyKeiRpR4lTHBAEhOoqnABasXEw48+7u3AcuyPRLCBD6sTvkBujmQZ3mOx2AZRitpk5C4SXrZYWJMRvvf13VpZWhRkabEdcxTpTX1q0+azc+9ESQ18ESHb0dDpM11o3uGxS6yCqhcX85mdYsB6s7Ft75tbMRTpZfSHqGUyRj1vwg6IzDNaDqggyV80a8jnpfNwjf/8B6Bd/uTsQ2RVtG6nGQtDVCSzCQQFd2HH+dAw7q8JOl1YA1lc/cpdNAvZRSB9D0BRN13TsJfRi7CIdixiLI4XjvU6SECcOnXj9H4neU6yiQBGuJP/W4e88QVY/GW7a/ziclW6djeQ4eZQerfwbb8RddFhBH7pAUp7zVVmnjHyWtCNF7TELf57ZjH2boF1+F+5JkSEwypWCjNkzG6IJ/BpB2eSgxXmZuIcoOfgxK1Pt5EGdfPBryjt2f0nH46JjUA7nsyR/D6KVtXzcNN5CihORjSsttpgnaVhffAp+ZvoiAXeul4oakUpVxuHbqZg1N7VXCMKciCkBol07JlwXcTgLTO//wiK35KJGX+/PDdRGTAm1XJwJaFafLcWKSaOuCdlgeFXijkgkc/1gROv/GbxOVE41piIjk8/1th9XVyng5dMVKiGDevy9shPOQLC+YjMLhdkAQKCzwgBV0hHgPWughYFYTTbTEn1lCWmtUKZBHqT0p8eTrMqWKyh857l6FggZFqJj/JFtMfUHRYE8YtzpEY8Kf6WXGtruwDrtAn4nBQc+a8SEEM5pKwHS0Q1fKP8e51564sn9Krz4hmUDTENgtNaKMLY3rHpTm+b6bJyzXAZNs2+dfgSiYh1qC8aDVF1fcKFzQsQZcNlgFTZLIZlgsUVsH86J91U"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

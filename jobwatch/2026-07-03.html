<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"Vm1v0lDfA/u6QyfV4icxPw==","nonce":"r59A/QvvLtWnGD0M","ciphertext":"KpGEKTim0VZ4kxATPDwaieMlRXC2xol4o3SfYEyA5YXY6IbdDcLUBnnRDQdM6nRUgoFXw/I8OOiMrmEQe5MhvbfjMUnOZa4WOoESNU1jmQRqBgpN+cIcAibdIDJ39/sxNBv/ry8VodV15d9C+eYrO+yS2q2+jKrjiinz8nzPXS/4EjotoamuCEtsyw2df9sYwJXIWGi6eYjuoKlr3ngvKLgtPQ1sdSgMzrW7sVrIk6CxHA75P5peLuyq9HiMFm4B0x2gZB4QH6zUZ0bs+tyvXu4A8tZRHEXtMflT8ZZk8Jdigv+XtQdfoBVvIB0JWwSrLgbWbTWwu9CqHkb5+pkCUh57CCgY0Ntg8/bP6ZEVodv1QRsahtX6PnOV94+jfNTPfPPkZt3Z8xhNxQFDOLfRBDmzo5QDtluDBJP7HWIZKeZoTfCsOt1ijGno3zZYNf9QvADrpTlXRrPpRhLTp7dQa9Q5QUlvMkHg/xZ/KXhGHhEXwp3fi1P2Q8pCx5z/WfedJinmtmzaCdjG64BZSoLXO3GWmm3PuzYO69pl6dO0XYK+meK2z1pQm56Pzwje7mcrDaQSsv4VbnehHZDZzYpV0/nwpCE38z1CMvnJTBivOGjQnBy9h9D7vWRUONifCLaSRRoBea9lklqnLQNv/XwmydtFKBZ3tfUD4Etl3EgsXWEsxwPcdq/b3ixsywlZVYsVZtnjxqZ7hL0YEUPOgmqnyETs6twbV4oTMxMUkzDbdsgjOF5aLB4+CG5h5Enuzh06lipvgT9M8MWHSrKyqku4zl9ZzhgXoH1wBHIv28zdWXHcSHM2RPftwIbVCDWxhx+oMjyWrjC1oXiHjN5YR/KQRUrCi2JHwvUEgyAprk0uH3u6XSC3IR+dcmjT904nyIoO+8/ZVt4fPT+/EbDdVHViZr8FoEplZZAFJIyBz7DFT0h8ukwuqZkxEpLSIMCFrSF91p4+Yy0z/K4HX9nP2/DcP3bguZLOxlzjQsYYDZ+0nfnWURAQFtsJIxBOJ8BZRB7gQUjXEYdkQaGL5Cbd5kbZDeBF/R3pP2G3cmlRwdFL541vQIqKx3AfjqsCCuSdy5nlBj19iAZm4PfF5Ra7ubpXtj9ScHk9W3KycyhXnzaqYbIvdSWqOgnOrLJylht+jBQpaSORGkoHqMPTT+nkQsoe0QgWSR/PjJhDPTYTFLu1W2We/M3oLi142PU9jWTk8rkcp7eEmpU+kAMjNY/tY6SQfUlyitcibwwBAECU/CPD0PMxAoFF/CIsZ0rfjSoXXSsGlOPixVixKqQ+JJOHhVocRtFdzEX8sfxntwJuCFckl1RLRQrsAqklSKicSNZ0PeAMO8bSkaKLzgk4iEgKq7ufXzKV7JgsaNty7+V50QFNQ7o/YQIs2xTXycpRz7utG/nV7HFqR0hNlLf6jgReKHC6t1efoZHoOJaclQAdx5PHWZbaoXVoaVef0KAyr2YmpP/ei5nxSwUHjT/VePHAyCfunzosxDQETdmMhLihpZRz85B6+zjbqXL/cVMwJyTmpjFrX9//+O1CxSkVs3NToMn1Xph1vnvgziXB3qWh6GGa/1CX"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

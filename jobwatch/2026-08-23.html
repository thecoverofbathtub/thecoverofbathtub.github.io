<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"UbLXDXuF/OCEkpHED5h3bQ==","nonce":"w2RWk/zlbWYfacEg","ciphertext":"7Fmesm/2b2S0xD1H9aDtRnBuGJH/sGSBpOXPPl9XLmbePN3WZqOPjuxoVMQEbrhuUH8yh9JAwvPNgDlNdBb5r6qaEWkYTUNaise4S2JCITWktowKyWpFeXZHs1fy/ymBZ4F50SIEQ4GtGAKQ4xCVA90Fybrre78nz4n2IQX4xZroLWSFzijDRo5S2oLbUwBXmJmvXlbZMkp32EbOFpIqNzH+qNfsSF9b7J51tCVH1r8YL6THFc81kYP4VE9HoNqfnUWa/jxqQzP4CtJsFtNrc2BkdAvza0zAXJ2BnrLBJ578Dq5GAjs86MRpJnp6SgPoO+rR7/ttpFZrfpU6Eh13dC0ow6gaOeODA5zyfVzYmwQMZIPkP0vt05N6OBp0CknrSVLfmQww9W0iGYx8+b8XpYDTVVWHJnP0IRn7myKw4+u0w+qSN1Nh4v1OQBkrZuudFvGH7CVNwK5pI5t37y7MPq75i+1fQs15EWbiuZ/4swF8OF5kum/ejaSqFNDs5YcasJOcAJl6EKHpppgdEl3oRIUMxBzBxb2j41YzlN/t7l/7il+D/YDGM1+i054TCTr1Ea2FCWVaI/C5ANHi1j0+14b3NpoKqebalSS7pak6Nozq/2RW2NELQRbUfbnq/gZT/wMuMTDufBoc8EpkIxOEUm7pPOhHajaTPWAjQT8mL89IPmW/CFC3npIizmYuWO0Ntbf/qQxsYNVel8k1VsSEyb7RXbwif27GfoAoExw7pS207YV7AXfwaUHk7gaLN6jipF+QC7CrlbhaRsZjdriOyhojZwaEfd1OiEvX3Vsm1md/OyoF1VLIs12YxipCVoEqjXHcJ87GK+l4taK3Ir2j8zF+fZ9Tbpi7b0JcR8npFhe13vci/c22HOxKvxsGqbvJlS1oE1U5QmA6Ox8+RMpmwfPS4/BZ/6yjtDlUC36FiAEAGOZy3SNxEo4FCDf4GNJebQDSGUpkrIkYYBFMMZP36N8tsYufg2RdT/zxcZhv0e90Q8SXOWHUhIc94u0h+talZa/Z5PmuAd9PtZpw8U+WN/r0TN/YjPRBVzw4KsclALMfGmcVrJZI/6Eh7pRthBd0HKzlQiPNr6JdvIO78EIWlhdElZyXIzTyU/zXMZb8VovS5SCr5UeHVAXH/bYP6h86W24u4X+PjVeUNDvE/FExvRlLfrLeviJIL8mEjNIRpr8pYeUyEjAYXeoINwC1XsuKPuphGuooQ+xJGMgpvdOarX1ZlsaWaWIC9uNio5TpGGh/F+y5lB8zZDw5cwP4/rR5YG59geuhqScJKtPJp5QelK3GK9kLrlMhCcxZSz0u0b6d29v+R+ne9kejPqAZD9kwomlQkwFG8BzpjuLvrX2BZowYHo3kvYASwF6ImWWDarcLBompxr2q8xR4S0x2looxTS+gHn+FObOyVtT88Yk/dpH/Gunx8kcQbMVv92qRcsJ1gsnYbPgZHOuQoIKd3M6ZG+7jgH6XcQZw8f6J62JN8CEZKaD9D0XRk8ws/bXj2O745CwhWBMvbCDLRatUeXdLLVPdW46uyR765CtrWtQR/D9QnaSv70Uq3PXRIOFrUEXe"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

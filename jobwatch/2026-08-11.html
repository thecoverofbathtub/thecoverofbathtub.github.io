<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"WpF/m6C+TTK5cGNfz+9QCw==","nonce":"FVnkwCpNvYPqltYU","ciphertext":"oFb0OWn1mV5E8ttYf33ub8wTtsHhVxDQUOC9FPZvDhlA2VzdRhwmGpknDWQ/lNtnfoQ1DJRVDuK6zdAyDclBHUfG79xK6JkEiwTG8Esfuej+1lGA2BLMLzrC4/2k9ased2BSOjTpgqr5H2P2JoP8z10V/5LY7f0to3XV/RCGvlzpaAU3UMxyKXCdiHK/WAp8qlrHNajI2QY69Z0QQ9E9eFFsETr/xo8RuvE75gxp1YVxDWg7yIVVY1w+IwRpCfFH2WinuLOn29QcV880mn0LQE/l3vAIgchn7hYZJXMcZ8LKzLAEwTLJmPFcToD8RxPjO7VTHbhhqj5HVtAC+UoZoyAftfsEZO4L5Oa8P/EJzd3CFEV6XmgjhDE8AS2qypjV8lrEB1eCxgo0jZLgu8A6Dnt+W3n63lDBzoi3DeM7C4IchzAzvntCLnwnAJYvs5OeLKKcXTUmAVa56UpjynU1Vto4c74HeTNM+rA6F57htQDjktYGyNNeU+AKGbJKFY0s5mbJ2FWeCkrjBNtJ9kwzPaMCgT8QW8uNJwrFLOkbIkMScn3mhZ8Cn6G2tcwLj3lI0hm40wfvnS963gXHM7Yld0wkVHXk3zztsdHRrMJI8MYEwsivb6feu6ngVl7igL/tTbVAKrgizDzF8HcdKIqoaoFZO3Z2ZjGC0luB6Dv89Um3jVxYnEjh26/FRvmhIL/E6ir4iVGXoKrzCw16QJhx5vUhavdnz7aLDcvqcF7cgh2tddib5kxRFDHBgK9aDMLY7s1ZCzp0Ft5xfThSI60zMvMAcevc0BOt29Mm1GBI6g4UZKRgzfthGLgUbRwDOMTV9Ze//cwBcJUQDuQjzzk1KoSEpLMh42HPtvTtZKObP2Kp2eZLVXvvEDQykd84kAzOjMSjmKfvMERT+HbpF3VrByvFhmzK0TdWR4rzvpz5vHLcoCYO7Mrr3EIzZ9nAggAkx6fEGqdR4AONGnDjfFEp052sqYw1nhHW5GgoSHp/bPOSiW5yqBDiAN+IAcDyZe8JgE9Kmqa02WidvlciYyJmLvpmMbo5UgM43PcoEx2Jx2Xlc8iJHIifmNmh1o6BRjdE/bKnZL7ukCUivm/+plC8ggm/crFaMG4qUF/IgFTXI2wsICLYFHL5h43Z1kIOnhQZHYfkDdYreN2RL1ujkdFgB+ggy5GJis4zz56Udj9yJnJRMZZq4RJoe/iBZhfOeIAi9empR0HkOlt69fk5FGSTG/QV/xMNto59l0Ixt4sb8N7oksa79RYjx4m4hEchoNuKaHbXQ5PqJZ0BWyiiBiHNtUab8OXvGnjVKCbY+Hw99LuLKrwisUc9k5T+vzftegPkOM+hvkZQd9QEAqoa9AVCrKUi5A/HWY39F2wFL3y7BnQRq7IfzEOEfl9TtmddFqX+4gV+YtDf8FVGs9u/dBox2uIJf/l0y87wn4ClqNQJE/Jw7fHtCWfro7ugddqP8GOrbWa2EsHa86tUPfYyf0ajOhrp+Ep1xw6T5R1bgDfPRkHvrqDXZidxkbT6P3wA89TxQyg7r1dpSsDZ1xaK0w0GNByz/0FdjZ+cvEkYfX0BBztv"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

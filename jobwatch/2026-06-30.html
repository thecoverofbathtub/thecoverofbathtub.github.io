<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"GRMdJmISkWzwgNpp/IbjaA==","nonce":"eZpSMeLStfh/TG3+","ciphertext":"QNQj9zU9XvDbnMIi5Z8M+rpDnwRygc6fOhJVYhArSHOr2PQiHOMz+cXrJf8MPLHVjzbz98AVnLbjgik4fhsVxdUzJxCgdJKWPuLXDJLsuO6UdjA3qnbzDkbgp0cigVlHobNkE3CqI4t7mNa7W7jwN1TFDkx0hRt7dvxLdq3azmUEPNOvltl4CsmqeflAS6hirxKURFpyvQHfTYZ6dVaxgOHsuHzQBEBcBxC3foRvmJXGP4lJWrZcI3e05IDWHA2HO0FNu0vcu+RyhpOs0IqLbwfWs3L+lZxJ5xHLhWQIDwUIUFUBfTD6hscIb/I32ewgBZ0NBF1Psp+K4dtvHDnLRy/7eWkwewq1Q6ZslS33zLmFH4av7XjnIR87DKjhTyDChDX0hqO8dXqic2gYeHwRtY3GKTLxN0BZPnK+QqJqz85LL8V4MK+JkbNK1I1IKVUD45vv/1W5z0wXmw6XEYiGq7Rf+R3lqAHFkKNl6LEpHaJE3C4ZqsZkYwfdgrEsfzwGdWocRvZ/KRpG1HZR47OZ43Ejbj4DOBKz8X5kc+UIBPCUN83lZQbqUt1c6z4pn2h2uc4nR4PCxvmA3uOmZUdSTDZ9Dhr3eXJohLpLInUt6b4fv5wuaXi+WQ7jI7RczqlZAFqbGyWhkLT7+PUbLfuEIacFqYu6KwjfvHar30l/1GQrqsqJyVv9ARBdY9Jwm8Cwz/nCTk5m1ZmtLwu5cLED0BFIwhbwwI21foU0cjsQcNxahN2PTvOvw3oez2/V85SNgv9V2QvWC1iA/qUg3UPOsUv+9bsuXIadJreDdnCIOqhY3O+7EPOqed4yNFpaXaSmB7cWZ83U4d7ZEn+NmaH4kcBN8eMNqAOdL0AL5K+ushc66tSX/ocxiYCRi/9Mfo5zGBEqu09xDeD6DtotqGiTPMO6vYkcF/zG0qN/QAh6Kp0Qvf7fSpu9pXNhyM72b5s10z43iyHiyxayRp/VA5H0jsmt68n1soEuhScMLCYwBPeVBGvHeRSd9mgH8afm8MGs38IrwB5vALyVji/tfZ1J4KBGt9G/ySQywrKoWOCq7r7zJb+mBzBr6Hmt7euV6gfpt5jv4g4JI+FUdWA3cHKTRvbbJVevDH6h7m+Miwpa4AN1bWGvveB40uCRm4zUy1BvZQxPOJr5m7PCBwIJoBZMsyz3Ar9nZF+emypgmmu0XeeX0jqOY1zPYpxo25adEoJGaFhlhswu83Wi80tW36TNkVBIOLzHQOX1af3kdM17nULv2/1xd3iLCjHdwzBRLxd/0k+B7s4EoIGxq4cVcJLO4l3apEzo2T08pFC/7BuugnjKuaFxW21hLPAw862UktaM0eONx59NeHyby00kKaIR9qSn2Dp1b8PWyj2/xuWKCG1DO0qHflVmfd/VU/O8iI5F5mUVwkLZM/mfZQr4MeZ+EPvLUXy426ksDC6UBF9lXGvB/+pVPidyk3uV4ZuBGwEfpTyKDXB2Gq4bWOpQRkeQYhli2hEgYyfd8jW0Wi4Ssb7WVHmznDoMQGYysLAbUbGw3hteu+wxiKeF7lzQLMkjCbPFbnbh36nUyOesvX2w9MXO"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

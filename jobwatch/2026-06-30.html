<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"B3obyxVMi+eci6mhX0T8OQ==","nonce":"Yxl4pxl5QBfy+JPk","ciphertext":"hiS7Cmip2L6Yxdt4E+L7Xj0dqq+SCq6ggxQ5Q1j0WtiuT+Y2yL0Pnu271Elmx4qIlH1VWoobrYzO/PoyF64PCSmNlEoZiBKFQpI3H+Hu1Fv1BS9JzcMUVcDgybAOaDG7ARzVKsTDNjhx7loqbbOjQUzTWjywlMWyZ3Q5F7ZJBkIuR2BpiEqMv/UpBNWkZ7GBJv/nzrRO9sllKwD8XaLQhg8bdX1Ea38HWsn5+nPKrztHbfVk5mQVqAgQK/wahj0uDOvHZUcZhYA0TxY9iGapAypBKqh+QUaFJaJZW/tSuEzFeyKrUU0sIHqd4gQP1ia5w/BaKdvtVNnkTJCOixDPtGtS7M0OuqWl8lIEOKH7YFK7b/jhywkNpOZrfCkdHf4t7TSVvUvI0EZv+whsiazGFenF+pn4ACRKPb53F1wlsJlNx4nljuPJpFCkvSfJVH7FDlEfDbbnoUjG6BAy039Pe5ieYl/eGpzsfu4nwa9iyja4mgbbZFb7FCVdk2tUNS4shIedjdt7vllDcx+daIPh7BB0rTPqb6L8S8z6DGNiZL3J9jTqLpJBuvB9S7uR202M4anM/0Cl0oGUIFefqbpmCG2FJyRHeqLxbNZJxTVcbEA0G8O6Ed9dglp78lTOLoXQK2BaZ4PvY76J2PSjhGsotcpJKHQlWDiBejO2bs8h/49lxY241a9Zz+m64stwiL8PRgLWxBBHlwttL6kf9G5U4MlthC/bljN35PgLK0c1HbyixQoxMPaA/NU0fyNAFKbZAiqRoYdFNjsTrt2C/cO5j11dgDnWjhVEwMieOCjfjPiUns7KA+yf64W4531eV9qRC28A9sFT7o+zZxfnrvZm0kHcswExNEYHaGFlMxTbmumEPhnWBcFAtjW29T2BOa+xFFuPLba3afvqJC40mhDOwiMLNgR6qGuH0kIKNr0RegkH6skztvXtmPixzSDaozd+LlvVTJYT32U5LON21vfCFa4NL7eHuUglBUBHRRLkvzJY/vMhzQ6Ty1mn+DCAG3k9kjwYpqj2LYyPAhuLrXbmTGlGLAUqIN2Vc6tmX6yhb4rPfpInPyrHKL0a5CxECofu7CAp5uiYPFOUL1ctcAIb/UZVSceXumlETbtVUfnnIEbYRS+Alp9m3GyP/iPkzv9OEoGMEuPx6eMr/SNVpVWMTHdIwQjRuHpgJpl9IQU2bTscvvnPyqil3SBPW/sfj8Baa287N7lKZNlgBneMfRYnWz5/QcC3g0nxavE0ZOv0vWD5aIe3+uip22UtLkJ6sKgEzS/4ZxuHZpRJ2Ybn2KxP29rDOn7B7AubGfGWsBIb1twdPqvR1Xrj0PViZHuEAaL014f/5eX+zE4KZ1RpSR1pQUK1Z6NuWWG8Gb6vANesctKKLm1g+GqGIozv+KzukSJ3dEEFcrbiHRHzX9eAr2zmflKOwaYOyDWbqjeC04s05YVl74ymF7pBcMDiCLw90UX5MFbsvW3BMl+3AmtlSlMuM9uvGXw30PymJyZ1Ab0yxBcjcPa6RcgssN+r6HYG/gz8mls7xLEW2TGdCuaRu/ksvw80zpmaLocvUNRnPOGLWCLzo7HKJZNkGtwT/6YhPv4sjrjuKaH8xEwJKfxh3dbncoYnElyJfCS9gCFbP6mS+TUhExIdhU0trGjAyoCg8bJdKVTZjIv5XBBUkRDyRsvUKAxxQLWFxD4w2MA9ZSiuqtZZThq+3E/c7LzfL7UKw12SnDXbU2j8/eKNYH1eJdtHlMVQ9tcHwFCcTR7q79v+qV3xBmyQ4r37dk5i+g=="};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

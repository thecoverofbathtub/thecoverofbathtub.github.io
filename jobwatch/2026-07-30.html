<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"f3zQQnSxLiG9ax5guV70Mg==","nonce":"6VX7C+ngo7cvaQFg","ciphertext":"nB2EIprthzP+QJaAWEcxhLyz1Ce6GcNBQK36sceLGFKh2KNYo4hPmqgqiUO510uJqGep+bs7XMikGqXTlV9TJUymMAjMrBwz1Yhu0YdphNWkL53DymY7q27sn8jwpDvZ9/6ljVjZ+5NHZoRNlJtSIVDY+ymjVBYsPil8RE4w30YqS50asoaC8WhsPv8PVWq0eICq82iFwOwPMdUlsvtPbyKIVWLFqz+A2mDV/S4tpaEGFyd4jFNM0yVAYPogZlF60+VMqd2xqJfUoPnhJKqQ+iBvZPuO0ifSempHidz0iqPn6tpSwYHw0XD73a7Nwrh0prjgAszDULE22O8xFo9TIoedJOS3Ni9QZnAq4BiL3r0ssG8CrYLH9izzS2fYLteRcXhyrnDnkdq+yCbHCuZ81BjY2T4CkOtQ9Adn/ruRtGL1NQMG1ptQa4ukzp36ScGBpfzyyh9sN+2e7CYXbISSW7hdjNZHtBUS5qPcDhmbSPEeuA+0uRuFbtBF/CRs7FcY8TvKi06mNIHt7udB4aCnO4JZuYfcl+azy+Qr6h8/6GLK9H8sqLQH4RSJdsKblsAJVnLWA3WKoSrWfqs2S9xebzw9n5J0Ij/ZYkMhBBZE0mL3Dx2IBDHwuedccvgiPDGRguzqnCvW6LmAUU+ny9A7IzxNetKoFb7WQMZUM3YTr0GhDHaHu2OkCOSYz5YSBbn/KTsq3VCwvV113bVO9xxeg055PaRrRGIc9IYdxtDa3ENni7FoUrXCcgto5DbqsfYzIVUelx0RS8uQ972scq8nTZd6l3/zd9C6rbs1CTAnM7FMJLAAFzpQTI7hNwg8It3t5iGyVHaJGiRqEMIVphJquzjWMO5AX4AmAGrHdjuO7KdsXN/OIWRkgbea/Md6MvGs/HjVify80+73kHBCyOajPxVxRK3OfvbcyomZKcC5gjQ8VPlRi12OXvLA7l5Mvwva3oUxtULn+bv01KKkYz6PlvqRwzandE0nCbfF0TmcOMceIYGx+tnW+qWGUNE+n4Je7Tu8+t7wBOV0SEyenoJGR4GDKcENvpLoNtkr1YAL5JJkHORa6iM1ROEPpJr9P/Hsi9iXBBrUOhVeF08aU+LU4KapoHAw/8BrFEC4G4ZHnCAYDU6YpOskrYmLYhPqNfgnWCP0iUCyFv/wc8VhkXw6L+/z6LMp5vClu/VJ6vKDOFBq3L4EGj5PGjWJwzxXjmDu7aeIr4fqlo3yJ3vFkJxlWa+gDn4Sl5aDCZPsG7UC8yS9G/AcDFF4U6M0/W6/7BH/A2ATVnTfY+elRPPKZ/3vCOl4yz+rXjffAHSetkFTJu9OaG1nslc3JbcYUHoo1+faFMHPanS+1782I8fcTJIeuPw3bi0SKzALMYwWsv9h2V7A4VKR+qV23XJg54bTpbUc3NYKQbhilDsenCGgtr+CmWEC6C+Jg2educoc35MZqlunmpCKvazt37iY19HVNDHo6KF/RC+tNCzyGVIFQ61cETkm2uAzEesnufY73DHboijCprnUXCUEt56Pb4I9Oa0l/BQt1gG52RMP8UrYRAX7arXtEaZVifiQSbbHsdJuvN29"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

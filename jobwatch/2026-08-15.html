<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"mdOfKRa5E7gWLhExxa5jQg==","nonce":"VEDg+Pq8zwVJPx9J","ciphertext":"0dHgdJM2SeJxBh1GEs9Zypp3yiLFMYWmUugY5SZ8awcbRvJOuQBerCYa2X23iJOa/iy23zxJHAH2E7DtKTWv0CkIwC1h5+6nApu6SR9Y9QxA50ydTQWDtxyXZBMMCvEtIOsaa30AotKtx1UwL4vAZ+cf7TK2QaeLdwRvRykSqexsXujv7A+iGJk4E+6W140JP/aZx0rjCms9//n+2zFi4s3ywbYRjiqFLezUlFR3hOd6Z5/Fn0SwmL4nHnKz3vxc0Bai7RLubFmamc9MJTMyYAT/t6Pi6e5yxi7aLuEg3jhIL0C2dv9NsLt+pSBNYhxxgU+6yS6MrVdjlKXAdFv3EPdA1ZKN1kn5R9ERgE303ige/ExG8NqeBuUoMNw+M9MftR0hKfQCb4Q6s9rP3GGBKgcT4zaqC4M11Lp1YXTa08M9Y0iyeRLSkHMDnCWmLucwOzWNGOxKjRlQ2u6n85tYfDNJKJtQo0ag7RtIts3D63AcrZa6k97xf6AO/nAQ8C8pdYsquxqW14zrTcs9UA+bgbuENxfLka2LppbyylOpDiWgXQBVx8Tl6mC+eA2ryEWeI5N01b0coa4aWuLMOPiuwmNWlfJ0AlPu+sCR3/DXDiQd2vuVzNUHLXSFZdpqNbLFrOryyBk8n7IdL24lr0alwj0kCmc73n1oP33OqpcJzMr5jnsDl3VrePEI6KyuDH6LeltkIOp/eA37hOU05ncmRN3cSiZtndaPgK/lZ/O1463CU4U5ihOn9pD5Hg5LgRbVS/j/I30Uq1UpfPfmEJOkxxLdN1bf+0w/YkKK9h78EvccVDegHvCdbWWWc80l0g05gtWJDdHvmfoUarS5/BPW3V79nGuRcqhn4MdESR5HHYiiTZqGX5kVTm1rRLfA0mmg6mlKbUnxop4xiUK+T7pZLaVg74rUJAAsUKYahh5yV9fp6nN+VDg7wOtaBS4IlXQdCOHefAT+2KnvLQr4vCZth89dZMuc/sYIO/exNu2pMqYMtcfvLHkbe7+6/IovA2SiWjWztNo94+6XAagZ8IK3KBqUKjY8Lvukw6XWhMmzlkBwlqC3cOk2IQxRMqZP4vHbZ2Wk9NNhR8g1z0gRoeKd+bNUJ7/3aIV+Q7aTchumb6nD++o8ECu6vBIayKQcJpaq+ppRkDuEKasTXmicLbHwFX0bMjGIe3C+ZS3C2PKG8VdYEnRVmYoBfBhWqL6ZKybTMv01Wg/YZcOFgRLdTD1GsgyVR+QjgQPLmFacC6YzYkh3JlfA1jOsyavSSYVNMLKP15Cg1INx+HupO5DMpMDjVFPV7EDWUyx+pbWqdA6HU4I8/syF+d55OUeB0jU8fCrEq0/9WvETdQRDmT0e/gLT7mG9no5zYzdqQsk8K8nB6w8im9B3W1WbCZXLDX/ZI5uVy+5WT9H0ggyZ2QbzttJbxMR3FQ26iES5AtDYmDRWwv/XDdgRcgRbOgy7deOtyvxh6BS80/UC2oPh8LpU4EcffrzSNvcUUF2e58H528PD72wzJDkgCBj/n48KVEmJGoeE4h5YaN7zlu+LqTygLo+nzxI2sEOLUIxdL0O+2nlhw2WK"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

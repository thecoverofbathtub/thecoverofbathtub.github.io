<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"FW0mfkDsoYXPQfG/E3eL8g==","nonce":"MMsfZC6uvmpE0H5f","ciphertext":"Y7I0oCgsi5uSr9HADLk9pc/fDDWJJrhtRKGilFkUFKFKPPAPhTHIAjNWJR1xrOXezmXTPVYEsggc01FMn4z1hKAcHKEZxlySsswtidtVs91W75Q+Hy8AGn7GxdiYQhfkOl7XaaBnEMUjtxXq3wIlWqlnYsBMWFCgs+k12YQbAZwPT1Vk3OkpvZcapj27aSEIYKj/Z8HdWMyuvdcNpqgzepuRZCw27TBBQXZbuHoyrQ50XI338otwXXHQh7QhYqO+5BsCnkTnRYpS/WiZbigUT9AADAlpb1J5/MhrAHJO1J7JYGl0gOY2AEb4IKWL5kl4zXprNpBKyZ7vNjEvkGUS2SeZTfsH1BAeqIMOyrkvSAJxs5f6NBkpFC/s1UeCPoJatkh22RaxnU57OhxXG1p1z8oZiiSdB0rEG5HWRAK3GEEc9pazXqAVU5Jge5zwVF+utogKUIib36Zjzruz0Y0xn2mt1y1gGQAfUT93cJsW0R62IVRBxv3WYoyJa55HfCnMN78jNEHED+p5X1Objjyl/jJzdB+B9BF1PQaQgj0pZmbNwG/vhidAoNt/vKiTcQADLYJCKFPIGRpeb08p4jY2GQgV6zQh0dOt3HPr836Tf4bK69ohdxPuASzvsb9aKjS1fA6Z9FPr4lgFpE8PZ3LZ/kI/CtHjpRuavp9A9GO40nw2sDuM8wmM6JJeAfgPsCz6g/GxyWxzs5Pva3C2ElIphgnZcLO0UJ/hGS/yjm04YhPKtuXP9Nz6c1Lwz0ReHMXWJ04r27y9ayiylZeP7k+b1e2GKnjsLng03EpQzHw6imCwLrnWLdX3guGSSFVVj6GceJDa9ofxbckUasPP77lDSSl34pKbPYLZtw5D1xLpMFIo/wu/n7XrHFBJOiehPayBhZtw8yCz5IzsqWSfK6OH3cH+ppRB9DcfjVKKNHxObxrm2ZproITYu7/73JhkQvzP8QG3XRVvgP36OoHzf+1GA4x+8A0evK89T29IRXWh87mSMvs2X2ovu/Ob47hgfm2/gFtTlnDuWc4CEBkWWuEf1/SHDT1ypXQpEZPYYr+P8vACpEYj2L2Q8EO4Kn/RvTzz4+L2hTJjishEv7g7+mkeQkfOd5YC3Kdk/Sv63jT8HWjDBfRXwkr47EB5URYj8ZapoKNkdUwd+/BXOjmNafLxYluFfiSR+n+1+8tRr8DSnsKgzD/2xAKYgtot2QiaxabU2eifv2uVoYov5CyF72pdBfYySFTUcToxVieuzvRoEb+fz+P7sIVQG/nuNhSzaiqTDpVI8COpQjGBSMcWTeTe71sxcktDRGDLrbytZu8m1LEeeceOAKu7byN0LrfAYeQ3n3SweW7fW0AcTOkL9DEPhbp9lZXQhLngpmHCDpmRZxRuJ//7AofCGeCo1VBTOackWlJ+Vi20l2jxGPuOjFUEKm+c/BezdVddal/NgAOSvBaPya0Gd3r5GmvQ+riVWgM7eqirdNo+YNMz3bFdX0GQO8G3KECAKy/qgCN8VFMYGEXgpqDPiLCsyXyubgfU9OilccMl0oBvhF0Isw8JLJhFpv1hQH+ustqm3aC1RG+I6WV8"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

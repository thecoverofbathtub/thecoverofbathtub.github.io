<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"TT2WqqioUPH73l1w1kfDwA==","nonce":"hbi5dYWXRxMJDBml","ciphertext":"RbY6cp6Ogk23C2XeWVggTmJLf7CpKHqaCS9x8wxyJKzd+9OxuSRhIOCVDC46WOLUEOILgiyxjgGPF3JrzslDsgPLW4GgyKb92zEodBoHw3+3UddsbhGNqxZJwj6vdgDkug09AdO2ZqBb9wXEgNfqxZ1Sv3xox9DQ0gWgMCpmBjCo0I8qfBXXIzBOVMme4nHwY21x8ir1v2zn0oAEu79SoVWgrCpgSG3xBdcx9Y43Scgwy5tf17RvanehX8PGFNeFDUBGDH+DMl0NetJWWHIEmhM7K55QK0WzkfySOQmuRY4OhG+PP8vhOvRDAIDrRVh+SrEboUtag4yIpjNdK6EUf6kei4lY4Rz0CTTh1NDnleo/zJ3TA27rUE25U+Ev7mnRftFwOUKOI/h8zQcbw5alR7VCOPGtVWX36tHeZT5tpIMksj2/bTGVn4t0bIFAvBe7S59oPDNUCG+7oFEKieIKbvNwVp5wd9ec1Ry/pyQiENdCaSeE9df4hYNS8wwILrx7hTErqFgVyrmD+ou8SuG2IpX3NMjZh3rq1OaBtbognEhl8ysVo55jzYbihKRcaajsb1QEZH8sJz1aCLtLpEA0yIcKVowOjTtTy5s4WoTQTE78hS6iEXiSpQZgin/pxJie9+Zcf3o1hbc8dE7fMEmabeGwLu95z9Mh/zrTBqQRuf3CvKYnENxxiry5M/GMsoL4d3GSiWMVzu4Nz4LbkwhambUt1lY8yg1YVxcLD89dM+GU1CEbOqdAG9Be5E0KPDh2bh7uK9eMM7VLEfb/CIJty9GbGBE0DMc2J70opKYA7OZFZgPgVgN7v2sA+qeP5OCf10n1wV/a2ETTjvIbvqysZeyCcABFzkgW0KW8wYe+CxrvuF/jPtOQ3uyjKThYhjy4U1FqMpLYfw98HQkKnUMoiNCHVTHIgENTcnxcBKkxVuW+G1TjZCQ+rO5c/iVARZucGU3XJQAqNMQ1bQt297IxMhmuMo0P/6mfAckC4TCwNJO9b/YU1t8ivYS4WDmOJyvPSyxbUed226LErKGqnxTtqzkWeY6if0OMEbNmEJU3JbaZpQWwhA3fwccDaKDs1c/J/AG5gW2WFtA2DiUEDmNjphr3ZkayFr4Ym8lhl717mj+jKSpsIhGVYiP86R3V05xTiSMKkYJnOCYdU+0WgZ6wO8gzSmRyi/G2NLbJt2tCYuTZrYU+tDjHtoyR07OVM2t2P8ok40eg/S9+sen+S+5bFQfepjSNdcFsE0Jz+KPpJqWRaxyK8oSw0JdBnjLPUu3v74w96jPtpvHY7QtfIeisQz5Pr3mSC2Jip8Ue3P2aCw9ASeKS1+cI4ZqSJlVy3pIDnSD0cvzjq84OAcerrglqBHGD5LBC8NGVdxv//CBU6j3t7belD82zDiPP8yHbyFCe7/D0F+wzK08mGnLeeNc0irn1C5tvaKVTsbGO+sMtUPcxQmXp4xgv7+JJm+Xe9EhJamo+EDh9O9EM5nVPGiccwnRcZZhLYZDcFlAPkQ0RZj1ZXgxE9Pu4p1IAM5yqH1x9Ew1FO/ohZxmguZSUbfe9UWuT88GCuesH6Fiq1dgzdsN+"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

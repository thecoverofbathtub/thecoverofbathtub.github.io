<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"zPYkVynjFeWHDZmUNZj6Dg==","nonce":"y9n1ZgRlHaG2JEBq","ciphertext":"ljzsddESHpEfxnZ83VJ6eziX8HlW1WpJ22+B9AiCD/heHC6P/Dlj8bB4GZ2NwzMjAcwpQJ+xy/H0XuCiMDhCcMl1diozr7u3Mvidg+bfYTuXg5b3dLSsIYGtzPreUDXdnjDVWUYacjipbUBF3lmnaQPFvBomIaxL7oMhv5XErJP1iZlQb6fYuNShq7Y+TiW/R9QG7DHZXT1G4DR9eCzuMnUzSYdYuK4/eCKbxBHlEIvhjPH+eHn1+6tH5yQN2n22luk053pG3yoQhlE/lGaNnvJrZNUMR+Dho6FxJEuIyVNtfH+gMpYlEt2BnADnC7vetN7owN3o7Sc4mbawy+MZXgy6OH4hh1kSriAXaR7dlt5ugVThB8YVougkssTqzVTMSoiSTpfvFnV3O3lHsQLuLu1aWhIW5ULFaO9H1ZSYrvy0pCEIwrdondImt38JF+LiFq9hbM9GV4GpQwt9AvOT2X+QXvEpSFm8U5Eps/GLE+122gtVrt2kbXMBa37id3QkHqgzpX4CXIkVX/1iHFAmGjAn5Oi7U+iMb6yPw4h0Kx+OLZkj9L5Pv4iMyZH+cmsdE0xpb20GeL8Kc4UtMrFmKOkdkMzN/f1++hQLWufKc3C1lP0rAeTzCGuGSaUnSYHwd6lFe2AaV5SGavlUHY+KwLU9GuZC0YbVluoVny4DTyKHYuFH6ut4hlfrMyerU0S2B3vaTFm41e99MNPg7sVU0Tk71hkYXhMHaxgdYhMgqvfCWIcDco127633uvoREq1S6CzeAsvE+ZvCUCs6fmegB4f/TVR1AP65AYougO0OlxCCX/sPcflRf6MD7nBb9ObOWidaS/h2+3UeqRpu9aVdKEkkfaArXnGk2ng3C6Nobdf4JNf2zbE4Pyy2HAwndW77gwkfQdfdxO6aZLB9vpjNHdDZpRhX1TDvgWzuS0lI11nqvohCjC15BOAoerBiD0qUwcqwVyfzyQNF0SlStjSiCyQYsiYCUXF/VnMB693ZFgrtobL2JVuZETbF8iZpxdImCqBYjJYcy3SsY69IDbuwaVffr/czekVqb+EZw7WCxyodAWwxp3RfbbLNqTsTIB1PYc+WMf47LOx1aFGZXGOKiSZWN+lwqmOf4azuLll0Pz+U+tHyL2GKBn/SDGZjak0ieKs4Ghp0OMudEmCP1lCf4dMwZ4tTjLI3ZWBnfS6J0QDVEQawW+qtj+qOjVTbqD2xq5ZQVhqPziyMvlhgWb5G2xgBafyL9x7NbaAm0xo/S/qhY6YUsVJsmxfXE04d26didALNzOwIpQYYPj30ua+HsX8nbVDRTe+1MjxC1gjH4ei5l9+mf4TjxhVcjERth6YyHmxEipfBTg5Qzoa5/8jWqsENbeLtqkPBH7FoAJu1hZg0gYcdJ2ioi2hv6NicQ7uO0Jz53hbwxGWUL8oZIf0VVGSueIOIkLyUt9zJ2zGEooibbteyiLRn+METQbqZ8m1YO/Tyj4s2mMVE8xzNT6mwwJnr2zwHJLWz88FpTPR9NsHU6UDjLfEByx9EZjD59Y1UBJMcbfEhfSR0e6VlC6LsAEfaKTZ+oDLrv7b1l4FQn8YT"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

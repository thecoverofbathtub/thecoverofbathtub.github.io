<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"Dv2R88Mjw9pZRgUkL2PnKA==","nonce":"6GJ/ip6x1r5HdfE5","ciphertext":"LbjH7hw98jcpGv0PyeGWSHzWctlO4srQ26Eiw02jQz4iJZbSWg75CjZ4jEPtEWRteyi4A/eQGAW2brg4Twq89kCSbfbn7pw/AUYMIDQ7ljhvkv1XDq8OQ+kClWGbfMxomxA8M1ed1BckO5CEK5pJocxNUDSPlKV+uv6HJpoxo3UwyCFDpGMSvCsdOOwH2stKuEVJdFUOWxzK4DakTtyL2687PKMrH+SNqyPFJM+l8D/npr5KWfrO0WKK/Lr/y/fnl4ze/swp3oOYC8PP/xmCIkdVeIFiM4q+vNTW2YLwiZa/N5x9OTHBb1s4m/5Pk/dzRids3sYtxe3ve59I05mcIU8ypeU8GH8HueZzx57Ngnf5Yx4Kl+/Pw5O0oC/wKuQQY7SEVdFCuN8x8WLfFkBS7TwWmI1QYK2CXx14TPzFDgwANWe6PwLAyAHYtragR1xYTI043OZM6CRvzUmlsEqEHIKG3ZiVGMi2RQWSu86G5vFr/yNjMzUispOBA+0uvL+juEoENQ6j2t9/clKNIj73YAnFckVuVIwIrDoAas1IDLUynF5XzAN5bitnveSABGjlPE7419tVmJGjwqba/etqzlPcTy1EzZfJayVW5wxes5apzRy0ZHOAttcB7dlrc5/j7Pg0fAK/L8HrHP1PebMwjkAH718WMIV2HUxBVv0siGvBFx31Kjz84YplNDbAWhwRgVL7TZvROearaWAL1yJ4a3VoIYqz2KzUFaeAFb5FRX6ZOeMuoc0WZSR3G5DEjtepY8OahGbRjGBEEwKAvagLmURZt/e5W8t10AaXjX2UIAZweHDSA9cZ5lnmnIPr9boj92LOUsS8kqwFfkjtbJ8zL1erqVvxsnfNOWEYqFSVSb/+ibpEy8g6LLhBk6Et6H9oH3puPsZz64aeicvErOlCRfxDTs6AXyeXXcvu9ZcWXRu9uOrwZEJPXyapfxTRlPRquLC2ZRvsnTql1cFNeJO0/GMP7sPYUs7kZAqYuTB9NA3HJujPVjknMBGkU+bpGUwiUciVoKjE9bP1uOYf0zdZLGqAau+Kl0s97svoQkLC3ZvoiQFBnLLBqDxJZj/xIj9owJ0jx3xX+Reo39STl9j5b9GXkG/BpkyII8Dmmjlswmy2nIlq4/G5PTezOIhwLJ5JW6Y6kzYtK6rYsPYzii1HaY1qRRDl64wRkGV9r/HZ17DoIan8Tvtsdp5QuU3oeN65Y+ERBCFn+pZKxK04bsiR1E8Haqa2UR6lnjfFozwN1jex4A6t4OqVvQA1ESPi1CUc0ANUryesAwGrmo67QdCA2UPQvxuLVhmesHqVcDxXOXld84Fnn3wGo28ji7mZP+tayVyA6MFs2vs393pCaK+JfyrqgH6IsoDuacT2gmNuxW3IR0SIbkVb6W+N/TCdKW8fwNq4O7owUovt+1AnlTrPkswDPiM/fqFQ5Epw1UQ2kYMwN851E7++DMWcWyo3BmaWBCizIKtazJ73W4fTPIW55EwLqMhS+upqxKpYYdc89LN+W3/4+Qd+760QAvfJQBIVo1ra1Yvd1syTyiUL66twy7DELgW7HzrbF7ykVUsyJ1yA"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

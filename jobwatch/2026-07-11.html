<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"5h4Z/fGx1cs2svdMpuQtpQ==","nonce":"tiSzPtcb/II64FgT","ciphertext":"FK40Us+qjIfs7sctC/ymb6gXK3S/KFbELkm3AvzHbwh33yhzsprYj9LJ4yCJ71K29ar1jTcYiE70hxp1qjMGi7Fu+DzzcbJKI3fqqruPYaZ0EmeGxqKl7c/nwiW/TNzJwNZBabTNy2j57a1lbjRhwwVEpItNhm/ys/Bi+IxaETcR3YEidnnIhLop48KRQrPNvZDaADUI8RmOQjTGUsNY5ERlQke35ZCEQ9RxacWexy5HSj3llk0DqjVJu3kIli3zOI8IdK3WsrHb1bJcopmYLCPr4xR7wYtsX8JmUSVMC5Xzi6eYsIxrs0hbmpHJHXxcV6xC4F+J33iLxqUv/mlJC+Cdo/GTYdOelNfuKPejcGdU4yk09/L37KKHCQRWBobShZJk6otZkee5xUunT+t3QWXtO2gHvzOoWdGAF7qkCPqMXCn5NAxCQE20/Ll772+iLRpHD1jXqVmN14Ap37vnW3wdbccTfPfHU1Uc93ft/f0uAEfq3/JIQgfDv/US4j3m83kSGSyrW91yuBiJssFU8HBLc0yi+qo5JHU6WyEHGfgzqo8e/mo6N2rkMsh509qC7H2xJrHhVtcCQBNgTIrWu7oGyMQ/EmgxNDSOji8a3xTZrGh+MaQnFjlbDcZxI11zSb8m4k6z++zqlhqr8h/gFxgE4dDsYTeNZEEz2w2lfSllOgRfm3mCwW7Rle9yY6611MXR+z9N35s1Ecs4vCqJFzDuMJFHwf9aCg2ZOaoEQtvwzormXp61xk7w8LSNSelXvM+E5tvGffkBeQNgdErfVeyyaDEeqaioMH0X9nMdrorcWXwvYeAnpZP0tHHOUyPHaJva+waZChRzTn+1vYw7xXglUceBqzNLvgDtEodE3ZNjNc6M/PmHi6Jf2MTYSV9cBzrhJP4QG6CYDDzxHvLXDaXSVB68fT7I34aaTVZSfiFKBKH9VT1WTCKGhTLAi+gmMNM7+OFaKIdHwtcz3C49wRwomT/JkHp9JuodxDrGWAS6jZllFPP0AKtAgqfpTfHHGq+flHVZojDrDk6ntwoFg8ZjdvVz0pVAI26lkIoK+eKuTIt6dV3E1lOdQFDuKQDyNc6cC8j8JA8kEL+7WVU+Qeq0bQCiVvysHUZl8t2+mtM8rHqX108jzfjqjMhK4DN2xjb0XGp+Q8J2aGYkOZaSZJxEZj3wK3R2Xl2FQoSZ8NUGtbCZS7ZGS7Kex0in9vgdSUyxLBMN0Rb3c2SSG8MmKJARwn3BfxI7md2myUbIvIZBCZquy7Q/Mu4syWUERni5NHghPyzvJunx+5THHn0FHjS6QV31FU7MZVG53vMGydhhp4ZnUr1LnSdp1H0/0neB1AS8Y/R90yykxxE4dxnsn3jnMhuJ0p0vuUWSEIwWkKjWYvC8xLqxKR4qtt9Vx6lMH0H98cT6Wi8cVTRDU1poZHpV0vOceJ7ITPv4wu28CTPOFEpCHysU2aUeQYZcrsjRBRKthcQT21Q4F1S9d8Uby7UZWJnNv0nSd3hLwOElu2NNMinKcw22E1WndlMSywFviHOQVTue6/xx6v4yUPcIkFfdc2/shQX5+aQlQAiYxLjK"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

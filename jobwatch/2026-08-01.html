<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"Fdbnenco58CFUM761IjQqg==","nonce":"b7qKFtIMN6cecu8u","ciphertext":"NDmLGc/lZBCU4WYcSS8RqKIrrNTUX+IQnxxdksqClO+xL6SeyGzlldmV684uYyqVi7plzqowUV0FLnE9zYoxpEdh9mjHFjNdEoM+AdvKLUBGdi7M+7/GkJN7wx2whyZnOZ8wXgAQV3H4VVNqJvKLoXUxqRzpOOZmav5GTVhep756s/H5J56qrxqev6OJzuy+yCk0eRoQziHJT8THXIuq5rVLFhDIH6iRTMsIQrhgWjbb6ewYmAMAJ/x/RXSyuLGdyhDV0sYpUhATp/1t5caTyV+SkRG0YZ3etpkaTJbySCPF6x98l1VhuvWoXosHuc5oOl3xflSGUwZEj+kAnylHqwYkwZz6yFh0vinOJvPeraymSMOcMx3sDfVlAUzMRKbcAexyDVx1Hv7wEjd5rMa9Bc1A5Ue8SR585RsxeODT0OxsAbRWPp/sfoFVjnCYajrh0d8RzCR9kUNH2Q//BjoNiq+DT5pRx7DUijQWYyR009lU7GHd+ihb2wgTk8NGOYatt8FA95K908t9ZqPFZggnVfZaez4NsZGgoT705xE7TREFh5G9dwz6afPoLh3qx1HE0pR+d8y8EooqfaAoCFsCeZ0vFwgMVmwDxEpKVO3dMYwgo9h0ZdjVYu+ICeDY2WkFaAfexWBY//y9Iv4JfQXPM0c0FuVzgYQcTmqEz1L1DcuAm68h+ZlevZ/g49ch3MM+dH6hJtxMsBglEnUNGq7NJIHjqqnL8yenCseONDNIviuvY2j5OgWcV5zDqeV5zESTAB2ote8Mv0SH0MNpxK3LdZlOfg/QtaQegXrQEi8/7wLi2pExcm+UKNHqz8cAixMUS0Ip76CJPrJITIn5UHnydN9uC2Xg+5t5P/nSfPZmBfFxau0uCtGV9by2eFB7IotsI6F1MbdrCikAumJdhYMdIb3dNM6oN1XSMALzOHtBlYJ35iGe0uE+4tLhVPyJdSqVTXfH56fLGncGNrD8elhFtqP4UXtcu3fZJLgJHehKs/cqZ7eACvbvTBNn8hD7EZ9777E9Y7MeZ0xS1zzmv0H3QP/8TXOUwrInRI6exlKAsyJXsTp4X1B4++Nkx8nG2EKURR9JUnXzWejWXRInR3K6ZmHkJ8qXIyhyZjwYnRvKdW8Yp4r+I1OJLUj9Xtkl9BiAJfBv8vMiIqy8JTZdEE+bWNoK7XAPpYgkv2KMnIW411VKAfxfhO6TCzxQGl+LMAaDEV79dogiQGsrlcVjORg0sBZnZhp4YQfedOf0CTay1TGPCwz/DMCpaYOFDM/98NtdCIqEJ7riJHBuIzdLwEmu/WF+fs+aPo+RcPxgA5D2LU3MOGL6JmOF1V8tYQNhuDUCO7V1l1NJ4Pbh/UVzMKbtE7bXbS590LMXFZsU0HLdEzv4oKD36sE1weu6/OUcWECir+rNfydLXiYZTyiLvyosuNmIiEk4AJJMCEYMkzU78tQtzME7R61WF/3Te3yTc85LlZ7A4SPZKij5mzdjFE2g7cFBAsNEeDWTr13rwdApgQP130poxvqCLxGpYZr6cUw4i2tJdIwB/cTDM6jfGau6pRE96pi0pbNi09p349/q16/8"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"9leW5ap8eleP2ys0rH9dOw==","nonce":"FmR9Dq7weAjxCAZL","ciphertext":"q9q4qBSozQkmllylituFS4IWMh7fjsktINfPeCXaOsQepFqplgYBTymdUzMbLy90kEhkyxvRaSBT1RKwAuzCobK96e0X2ZhbFCWFXWEeTegKXtvNHdFsfzt5qxbXKUaA2KRjR33UvsgduVzanJ4qgxQXBvioTuctvqEEjaesafPlw7eOKzh6ie4abzfBy+lKZ3WtsoGg0C2MB4s5L3d2KQ4rAj/K9+UjKswhgCrLeAG2tuWfqxZ4EWdfMsSZduslw0LIVAYDDSFwISQothpo74mMSaT5pL4T7trz16ZlGWyWvSfNceS//RGXpqv+n4wkna8N71EDcUbJXCMhRlgB2NOGqo3G/vT2ARvrDm1zEb8nd3S6bpZFhas95X5+iQF1fsMFZ20WMScWEKUBwbC0ySOftQhflnImtVEvPbOFdDaVSxy/uuih5fxx+q5K/ADxTTMH5ZjpSJpTR5pAvVFHGunbSAIM0QTLmOkzoJSwv2HJC5xG4rOMi3NZ2bya57WQEMk2Asm9T2JzcdqnzzU7PsuJozTCL/8ARXbUgaYzg5ptTSv0igpY40XILW1DxaAtNndjgQ1+t1dI9mDH19/FDOTBkIcVm0IJOCPKYm6ouMBBfYAt7EGGYiTrS6G8oZr5cR3MdbqV0CmE6fO2amXLc25azmJP31DLHdiaZoVPc5AFQzKJLT+QIofROEcJTBV5sU7fBEztBuNpmBmWqwdv/QrPwIAWEt7J7C/AE3nN7kAFxOwg7zaL4SwfrL3802spyT+t4BqnE6D6yqdEoWm5Vop5m2iYUTW/ptz7ZA6FrxGM8HEdcwyQrPMMbkL6Dg9DszGcp7ARgpcA18prSkpj2sVcnfUAMB3yjj8yD9aijCE3he2W8OHZ8lvDjxjbahW+t1/ul/xZ1P8AaIxt5JoMqDZZnyRR0AC4rujg/9VWuOGyAvy2wXvlDvGzZRjOIrGrM5t8twCZa2l+q0LQCsClvkC63hZrfDG06DmwPbwIX6VrvM55cSgT12PLlBJpe2CoEy49Bi/ieu+JV6y747RsiQaoE5YJkyDoZvB1f8JqvVR5bRsdIlHF5pX5C9/kEyK2KYG1YTzOUo7u++/vYRyNh6vabTmSNgbCcVVhZlXCM8GsVGL9OUNMSevKOhk3Bx/bMtswRGd+wFAhTqh3klxDFK0TvxjvuGi0lSBIN3nNaDZlhKyz4ZE2seRRCBHsBon8RxfKdHZM+XD7N4T9jFDPtFEsyfxEh8vfjAG+WGGj+rWXs5K3mQwQeLTS/ckeasc6xRzSseAMymvAVR3cJFLlH38WsZFLXDkR2URyMzaZFdazi2tZx1TdHIRJg+k/CMbq7XjxK1v5kmkhzAcPXr4W9RtnOfx7LjQJcCWTKH/jJaDPVD0VZOgd9J5Dw+AVyIj6FP0B5ndLepfckB6WZrPiI+Ku2fZ0b+7XMqqI4ryel2wbzF5opLl+RtpxOFhu+qa6qt7DiD6aMRb5gVk160hnTVtmuzzN5QL8N5NSFf2vx0OrW8hELs4A4CYKKKFDcUtPqq/UhFG/VMl9tnx6d7CyqQA+4mP14540o8+fUMCQtWon"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

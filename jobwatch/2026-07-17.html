<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"54hseaPRcYnJNY1g/shWgg==","nonce":"0RrwumRShwggTLf2","ciphertext":"iPrCQ57fIY83kMzHfSN87iTo4KeIyeO7Jf6Ewb/GbjO/r/lbpejTn5Y5w2Y0+3kG2dxgZ6s/1zLZ+Yor9RFSuSnfKBLVVeC6HrHZckLaDn+1pBWjBSrvMQK4q7h8c1T0SWEzvwxDGiqg1AL17H8h1ywI+6NYfVEMkPEOtqO9/5imvqMKeI6NxA0H+HQGM35XhIbGNBT2VABSsNx1a4UhyWEVu6XcAXVvckgwwrtPonNWDv1io7Vs28Pbupmq2zWQiw3T91EDcJcehF/DO1NHh6UV/eBShjznp8ROuCmDPs6gnP4I37QOsXsYz59/DVzJiRPbPDbA9XzZEHdYUWlHXs1LViCaYTTSln+B4Ty46rRFmbQ6Um/etlGVuq/2T5Dk1SNVs0q8I3eSh1HrKtYYjvfftgaL/QHV5tW6LuDMYLYsr0J8p2rO3jJrUaBwsJI+ej0IrJRSP25I/XiMWeT7Nohwa7SyiraaBX9AfG5QJ+EcHAnsPWn+IXUwqcCdHAOAgFTDG3ZtUckwk2aCIrw4nUxSXvbRz3x97cUTx+XTB6PRZQMiqib8P8TnXuun2EkbL4Oc6pzBsoG/2nnz7z14DiIkSR0vov4vXon/fStIlHfiTWoX2sYThff10pLc3ep3nTjySqohX8S3joVRny72u2UKVm0YRcNiTReGO1p+AsvN7VVnGENCi5JQdLsuZM9GSB1RuVosVFGMVEPImKbrRu/0g1vulWEQknaGoSmJ0JDzKqrkBDTS4ZIRBRIky+VJgzCTDmDBJYzCCO5Ro6VbRNle5tFxswyBogoiauPZ5hdaSbmZBOI/NExSeo6WpLrwIpb0s2ifWCH1pCyHOFdbWtOBGq5UuzWEUws0VMIV/0EG5zFDt9RDrTqccpyf4/vuMrYvCv3B5UoEov70/YmMb1BsVLnUpjrzx1wjU2Ve4OddMZQgi2O8A0T0ie/w4dfbp0Cf1ZT/swFyYQ3Px2Uu/TGJoOkPD0tP5kqfD02ry4v+HQ5c9vUkRpdwbZlVHMnIBHkG442G4zt6uonHS0gi9CO3PxrWig4NS6gX89Pib1qtcssLaIMkwl8kYKxGriyNlsjGPdYo1AJK8SUC9JTHfRkY0hNsWXS4Sls0kdxAT3h/znruMgka3IsWmSRvi68AwyL/1qX/UHGWeUgMUfbC2N2Di8Exbfn5bGoZKp/XCTFAhu1d4czU9M1/nAnobDYI9g/ki8YfTYigcUQqIoKbY6w/coBK/0dQC+mjM/CpZal9hiybR8CV3syx8UYMJ4RbIxyIledca3VoWTp6Ain6k06ApvhHqEnKQ4nTtapBJlUSykgbU1/bSCRcYQBm+HoG2x7dLNEoP24ykMIXL/JNWOFxpzTsYpR2lvmAXfkTlvpyq/cexcYW22nKM856yztDqoZDR2hczHpDO/1W6Ctwt+Z6GDyRjVaPn7dEXmEM/i1kk4NQ9Rhr6WWn0mo6BU2PgGgPvUgVZe8FMdt+eT7dWcrEZMqZic5bnatL7EtrtWkLoUdrB4vnmI4DvGMRFbCCrOyuXkRb0rU685/xEZRaNaAYcFMX5zMAdlgjuNftCa46"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"YvPU2TWan409bc2cGooL3Q==","nonce":"fxZ5yljml6H4Hnf+","ciphertext":"fe8+4oqPvtujEw8id+j/TIZc/0tXsH6L22Fx+thpNiQvt+e6m3oduikNy7Gzav3wBk7KB3/Z0opYi5p4ISRj7uZTfQ3QqRVHtcREgP0m/qxLnKjB3JFx/VtFt9gucUdW1k1IMGUbsoGlxF7ZsHfD341cdZ0mhbyIDKhNQXX0koJVer4TXj/KlEKzWYtWRfpGvQk3L8LVX1yPhvVx2Ts3HoG5GPKbn2ijGqzGDwFgm/TvBv9Qv2lluVDYVCub9dUXKoA5HUP2FTdqYeDXXXIlB7JIwXynTpIJXR3M4rJim3RAYdyughEM5xPu4ThgfGEbf06F/75qOB+a386vFhIQw6v9/xr3G/CU/K8jqyIllZ0lcgW4yNUx8pGdyg7GQ2xUS9EtHh4+K4ixyCt5xmMPZOZ+OccLTi/IgYnnR0aklG5ZpsATMkHKm5VTuGHO0OJqr2F41MxAvv2cEjbDrv/CwebQANOSID87yYpWYOdlYKt+qDnZ77WFKv3WkODh0gAC5jGuwGt6O/AOm3jKsgAJqmgcTQVtZXdwEkuI5y/1HeUbhbyE1lvWnX9oDF0jCj3VyZhsTWbuw9pi8UWKG2V7B6+phzkf5PCPjBViQUh/b7rfqNYb4UnyNVw8W2laisunmfvb6WAqbPA6mahDcO4dusp4/IOh+3XoPDhwsR5CVvqXxF94OLL88Rg58jWpn5mgDuXi3Th0dBY4CuSu0l6iikafqblgno80ri4S4GFzSRyD0wRN1PhMAgpg0jADFzjL5wYKzzGRwg+ogzhL5OCMLmBik7WZ4YRvNMi3G/0962KD1SKhXsG8AOjG/G4rnUoDmMoHPi5uYGQ6r9qqNNSeKa7ICPrzSp31V1ZFt93mc4lITJWoh8EERiWkZ7PbKJatAY06QSzjM6s+bBIm70z8T1XmaqzvDIGuiFjRWMSF08qvv3fSqlnSeRNqO8ZyOdGFi5sQo4GXEwAaMNdyBBE/BCbjzn9Mts8nI7DPDNZqOjlaDnEwN95R/6anHXzrj0CX6YKKzeBP/3PL4tOiSD8x+rrx2eVrPi+ZKDvJ+AEGbHQtI0GTcl/iVZYFn9XUxiwjTQuSUKoZj/Z90fcwMbmE7RbV5hAeFR+P09A7swExUQhq01/GjmkDMye6CRcJX5B8lYwLk4KClOdALLvDSlLeSL/kGZHH0lrXu0x6jNrFQJ0pc5J4mr7Vz2zrOCnfXsrW0TC31W96wfQh0B2fRLE+HGeg/7WlRbhB2/mBfWhSVRSkNR3iji3OoZ9zvJlBTCYWlwxbzcdC8lC3TvM9Scf2ZFvOPhxWUZ3ld+oV7mhDyXulsgPcG6LEJuzSuDLUFzlqtHXqv9lsseTCZFLT5s6pJXuqUcf1BUI425ChdaVp0xQLuysseTSspxn2JHEo3kGrvjjQOLx+6KARhM4r9KqEc2n7nlUKK0LZf+hH1oX7Urfg51wTnrv7cZZhonOU4wAs25vBovdHvyE/2/jctehd5ORWQJB/U22b+wtrcxs5xKiQwYjxz1SSTl1+oI2JnUewREHMZz2XT1TszIgv3yjmdynlxxDgI9XjsZ+87+cgTG+I"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

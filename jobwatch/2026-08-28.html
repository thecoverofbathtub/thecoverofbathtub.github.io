<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"GL8gYuGaEpEAW5sjyPEXUA==","nonce":"lbyJ8gZ4bkbRNqo2","ciphertext":"YtB0m0MmiU95GmmLpTtwNRUTQFpdIY5Eiip04tOAW3cgltbfFWuG7JUJ5szA4mRNQNp7MH2Q7KUvKM4EEuLjcgxoTJMenWdBQttk2Hdy5QtDCh+8cA5+Emf9wLo86vU2F47eYMSwlrGLQ1L1zuqHoviU3UCm1xf4UygCHXSfB0gkHKGoNLpV9GMMfPC0Mzta+Ong3Hs9EILhf4M8n+4M5A52ARDvJPdpMHmw0JLLHVV1JhT03eTcalYhRFYwdyQcOhS0qAGzmFRq+DdNYlFeWul60wvN/2GAdFa/sYaTQH2hN5b4oEqbDmoLrzghqBttWIyxka1kxrGgb/cUpi0dgmULrlWdO0twBKbFdsAwCFjHfnZezYXFAQL4sj3YCVwINTKGoBsn5xaELqBnecwwa5F0LeoSvoUxl0j/CQCXfQrgDPamZgYmKAgLQTGfKp3j0Pv95JFovCe6mLW9QWBnKkSVd3Z9fluxa0+lmsiHzKFv4vq8o2lc7xcwKWUgOTk4MrKufQHrKDthOLZFqrW/zGjoAScGJqyi4c4dF8jGSDm69w1K4p2RMhrLH4DCvuZsVeMoT2DDzM86KAuXJhMgCVYl43lFiDEj5iTRkukpeKndlYJc5UV3ZIdijTJDR96JoJAgyWaT0K8djz+fGDCgllqBz6hvDk5qvLDKNNXq/vj4pvsHzGsoYp3jk8tPSbZqpjpPIeQLNxDDnmKKR6oW1Mv8EN838REfgW5X3LIgChxRAH9jeyGRDrKnw+mSjPZ7CvJQiuk/AzXRIsYMS0XbdtBVWH9q5ScQsonbl59gzAhkrfTwB2QrenHalJIclAYXoJ2zTcm4yUfFyTZ/a2qQq+mSxxCKpExqPo7jjwdiYIIvG+kpAsb24vDzyeU++m0ilQZG2lHKizdPZFhm/Hbt/FzVoEh7B8DiU0TuE25Hnq7k8Qpgf56KNN5bzryDzDeCP0IaIvZt9dgsW5yRNCC2nlTC7uS3TBX3QF0B4kYnFXGtuz4oWSvvkP2yyZOYKfxylSZWkSV5R+ldgjAbkMN2E1FbK0Mc+emmSlXmhrF6jIYZI0FLYTrQYOZowtHrawCuzt1z2J9AJl27m0Ut+yve9s26UoSaUjY4LMKQ4hF+Sfrappr/UPIMBHFsaM4OBUdsZZXk43AwSGCzBqz45qG0NaLuP5cCykQyitDWEBdk0IQ7RFKoip60OYavFJiW1V0sbhcAkVe+c5I5wVWA3wLl8cE6ZKgOc6M+hkvI9MzG9IUQ7mOFKTdAc7ZC/yS5dwI0MAjo60coIUaIPmgstaJqjDDtCAJf3vMSqW/phhty6PQImP27q/bpzo6TLjubHl4W5m6AcVxJV/RuAwdSykMM11ExEMMO9Ulq1tqpmjmXbvzBV07IrGuIcNWHE2kK2seW5GsFWCYX9a4QX3I3nO+ScMMPHhpIx4YW0k2ucOXWvKLgjS5ePNuxCzodesPkGGmd6poNZkaTW9dS/rTblqNi/F9jVFwxitOa3A06P7UcpxhOiVpuwq5w6vIdUYz/5tah3VGFTRXFr4XEqNzlZJob8ywI8W6+MVwnuNdFk6XDp8/b"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"ByhPeFm5xVlJEx9HzRQBZQ==","nonce":"0CtF+6UM87AeWOJc","ciphertext":"PHFqRzvHtcPWMGqcGQih3BiWdIHeqONO7TtvE684kyS6FgOqjuZZva3JX40YA+oWMb4BaEDswBWRtl6NrTWnMonxyayorifx93UpLcSz77zJwdbnH4Dr1iL8l6xyDGkPmWXYR/+shX1eQ0uDe1kVP20ftPEQSwGao6ZhoEXwJIhnDUxFAxAkqbjBeOJcl4l6QBe+HvCXuJSX8IjCMDfFNe6JUlV4cO3XU0jdM7FdY7n/VgXAYRi7ozxXNh6VJpyaeJca5zOngs5k+ogv7B4uJx2yiNGecZWMyETfdYW1zl9GRTdl1iZxHiCn3PfRuv8IQPGzmbqjqtVzmTShGw6WHVj7jXWctByKtGRNaxzyPbaHEiO4Hh7NsgKFYIE8oazCr+qdHetLCQVKYyvD+QZwHi8LcwTqXEOqjcJ5ZY/8OE34OzSacv2pc0cG9PIk/L+Iqd8/uks9I+u299udKn4/Xpc2gvBhN9EZpFNvTL/24bokMAgoksSNaTus/SQSxH8Jw5oBTYqEbCNffMY6K0SKTLJtU358o46Ccz8qlwJmjCm9EmliYbmxBpXuxUPUNfGczt3bpk4cKhRUIqKHlOMLWaLhGyB+BxVP6fim0SovUtQxcH7EYb3Sy8Xorx+0o5EZgxRrpN3oqB1maW5jeXHug6WWvxwJE76v1JlQHsGNcvz/BgTB3GTxg0hwFFOA18qEv+cNo2j5hRoBmEpm/ikEyOV5cc/Xa27Nj8IWF4ep+Z84OQtfbjefARShUard24HesHIL4x7XU71ZNzlVYymSVL70wFYK9qFrv4GqhsvoHY5H4dR7DHAdZjhixdEzWEE2h3Z79jADCVZU1LBA3faFQ15vemsET/bfSTdBuQWppIONOGTE7J5EyGMXbDU/GrFBMIBC1ZBNVNoIUBPdmin8VyLH+NPEMbLHtXm0etBBd3nYvI5ufz5W8UH6bueQMT/ExF8q0KIx35rIgu9JiCfT0V5oCNlnZGWoErJnF62l7N4gEcCPf/3ycMnXm1R5G/eo5kzttyQ5enw4YmWRLELHERQWx9Hsa1z1bpCLdLM0VwZsaNZEY8y2XdcBNAukGq7RSnaaaI9TTVFEV6FY3TF+NaQXnxGxlWc0t3CE8v5swMhdNok0ioldNY10a3CMjLxeQYDFtK34B0+4bacSpIBOzgh1wqxi/t8TVSuDoAmsPgxD1TZFwOvot4F84oanRdZvejEp7HA3KZj9MBXZG+M8jQ8pAetAoXA8xwMkkqVY9WZKVSfAKMc5qWpcmkFYx3OuqK89XG5jcjDlCREPpdV+PFnbusvpBSyh54/YzeMwf663ac2zaZUKHMfeg+GI3QM1CeEiITywbhHXf7S2RrYCYOTffxpA0uNFKubrAb6PhXxUP0lj0Jp6rXNvMoT68EsvLW4AIX1pvxeAH7pNdcETK0zj2FUfPhkGxDKijslPFMJxGifiUf9IfQTQM2LVmDXHoE0x2AUvBY4n3+A4sOEE8mX+FZfS0F+D3uaiXOPFhRKFoZSI3nltAtKwaRVyADJ8MyCySGR6j0iSUesmNO677NHmHJrpIwQounpcdNz9O0BK"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"TTI9vxHSvKNTLojUv0uU4g==","nonce":"pcZjUf4Unjbj3JRe","ciphertext":"ik4Hq2A1f6zC6/thbSjd6KO6Lg8UAweSjMCNTExn+We00yyyAE8iSr9t7cGBAd1WCXyTgbQ3zF8CBTmc//d7PnkEQKr9FeTWm/zS3N9uS7cn09DgK8ier8zACrr+VXMJ4U8dYnG9N2VvPIpTSKQGnmG+aDQm41NH+gmRN7P8vIgfnOsZTPAitdCWJklN9dwvnnrADcRVENLSvHc28MnLNy7pbopqYhJPh1QvXVBIajgSyGVI/4tuuFU65vsmyvlkDEY6rELp7h5VDwH04mwO/b6W+aKoF4dRR6mvVmxlAUvdeGlYH8Gc4KQ5stjAc+snt77PqP5jxGG2LUUMnKyUNrn/boeagCCIY+jB16JvPKJpuiyaW/HF/Wdg9Z80p7CRnaTCrYkxEYiq/s3ax6xInpjIEeHep5+RiXtiiWV8DpQv9ZGVciTt1lrR+Mhvlq0lysaNkXAA/qS7utjlj6aWMz7Da0JAjTPhgdB4rhJu+QlBelMNNMLsIpm1eJqSonnTx/AAckFz6ZLx8OfyM8838NAVlyxWALyNVpXFxzhNxA6/qtVq2YD+xWyA+nOFf2g2eMEJFKrGrhIUGipecjk88lw1+r1EslFM8zc+rtSNzJdmNlmhqHfvruOwHPyO6samPsaQc7ooGWvI0eVDg3dv3CiN7VidTvF5jsLx8a/bSGTdwpuQGUEpwF1YGXfY5d6uOi05XxuXNAI0sPy+OHfoaxvMQUCHx3uDvJyZrZ7821hJkaysy1yqFE48XComI/XQEJoihcsOHHgAKTF9EuS4uBHmXL7feZXsdx8Bvsmwro6gn7kgaeALFxFQsAi6NuodKbd5tHdZrexYlA6Tz6Q9rWmnN+ZVxHorbohqdGiu176FnatXpD16UrsxVhtGKLJ8Ub+ra5QtNuYjhQGjfKc9LHSaJb1RMtGryiD2I1FvLIKfmcCmshjHsHsEWqb/siYgFgj2XZIfNhoi6RJ3Lgqvql12j5OMnlscFdqDwjf7s2SH0K0IxATTsDxIVT7xYo5lSVODaNikUK8pikfphisFK5k2p59UpJK/I08GSkWwUs+z57DN4iLPRaus7FOSsmQTVVJirUQgR3tM51C7aZ0k/7M3WI7QCzVd5qD/JaU0zA3VtM/OdS/BwKSRtaNVK3KaF9mVHixaVzl6eMmjzP75f+SwwkIyVJVwccsNU6PEIem3z5kCqP/UEK5236zaKefwWIzLqis0nYyuSbTdbY0UPR6IfbPsjZBH7n/0NcTIOJOETxq4tDwQBrhNool8fdbnrSq4G3zUgr8mBqMU9jgOSJ6pgdCqFtNJ7cHz+tNWcRijS/g1kEPAl+q9kv+/ZYupx/flrnKjfohsTySDEEr/DMtrp6aKKQtQUADLaVNsh8moHPjPsnHB3xXWn1NRYLFGi6ctrQ9m+vP8qP9ZZt5ClvLSNqSDnVHXe03Ssgmb/tu6JIaCc+EiA/155GHlGrfzNGlbaeIubMAFuhEWoCnfjnom+30nnYhtlhGzHsI4MC59ENTQ5aoYL0rhrwr4L/MBYCIOqiLeGyYKeUF2/l/oxY5djrN+TAOj6ifp2nDF1jsc"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

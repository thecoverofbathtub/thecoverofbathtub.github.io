<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"za9EZsgpfaeR7A1mn4EyKA==","nonce":"Tr6fht466H/CzHJa","ciphertext":"Jtqz3XptuUiEcufKVe+mWWHezsuchN79cMb83cHVqZtcXzidetrVmhhC2zZbhIHa5pQG5aKURFI1iSOrj6D0pNMCF5/4vtkUxyvcKOVd8fYFoOAJbHlr4M5b/q1fkXkP9SJgFub8+E7srBiyqh5ZAtWdcTL2VQ4MNhIo7oGcoSTuIePj9yiEoC+299LIqIa20rlJnVnuRodoksXkn6cO3NvZPheSjgoz/JBOz1pEt2vJSVPUi+rH6OT+zksg6N9jFluM6x7xCzuqLInf1EFmk5QmBhkuZa/Q0SOGG0/gkFsypWsI4CPtXP012jOWQIPjWXR+e/EJ9qjFb8Dq7v2yJE420UaUWQ+y9AY91fr/O+ZNrHVL7YfnQYjDPqI4SW3cgXOQrwMl+qg47lp/Gb3ht3rcKw7MJPGRJ1mqS9SH2/ggg16aOYHW/OBb2+0MC8yEys5hNLdr1XCUMOwHywgNOerXFELFaCad3xZ/sL9iuvl25daY7gVbpEe7X9ljfqbHjdyjdd77S4Dy+qkHt4VSSW5u4aaTaQixpRuOA8QNwahTBVf8amj4JyiC2ajQMjsRm90z6jT0D8p/nN2riGKvtWhtVnosTfn4lO8QSR1hd71tDXgx6jAn01f0VwBZiOSAzG7JBzz0ICxHg6wmU6zyssnZ3bGFEDkuFyKaCM8aEqwzue25dH2XvxjNLh+LBX9DE4pRgAAhRb3LMkqzganFavfWRe/QqUT7MrXEdIjg4AmOYgqWPA9TZUGXU+yUKjmxXuBKRBsTWpign2yxgGgrGWpYRW8ilrR2FVRpYp/MbSlHuCBnZr/k/AjWUdYn3KIjvgP6x8csiEvmWk14gJZaRHxQoEvYeiQbgWOu1COY+1dLwAsPIPHVRrqyoUGeeaDLB8CPIMt3i5hsCidfhhw/54EcIYB2J2dh/BR9FztYdZvzL6bEHMdzXDk2P4dHsDif7g8Z1eRdG2+JamI/E7X0Rnt943lvNSIORarQWUTuP4wz1CPHRmFfC2bwtp1iwUvwMcDAWSjxufoPHFxVM9x6mpVFZOJMc7IOAErAl1yBhfKgKS8hPtYVznnfPOwq5ZZsHaytE0y5IvF/+HEVdyJG7ctkVTFHmVBO7OSuO1LNU2hsf8j1YryPEbfNm7O1QDSFA6Hnwdk8kaWSvsCYZS0j48LfxzPAirTWvkqxzM9scCODWRlyYbT0WYTVwe6RZfvDt3QUW0NRce2shhM4DTOyYQYJJTt3m6ZaVHcwmp+UI1P4JjD+1L4APvBnS2fu91yZOU/IubjKoqddOIrHEKvPhT0ea4lSvdiW3l2HZ+L6QRKX2yudg4pJv42judvqCIqisr59zBfP8Gt+5RvouXGJhZNo+g/geVHJw+BZ+Hup4/7rkbgyly+6x6wsMYZxnL7UYUbcp5FH3T1566aOyWGSnFTOMpF3kxA4e/1W2docAzAQp8ebxPpXITqHmCCWoPfn1sK7PDID5NgD3KR3041DKYAW/B/i1TA0LZ/yomNCMJliZ2REYgvBukfaygTTMRUyWmfUFICnzApIdWkLojySA3PJnl+crJQGj+LXqaJTD6s0"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

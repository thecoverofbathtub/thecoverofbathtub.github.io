<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"u3XOiKhxJP4k+QsHeUsEUQ==","nonce":"eJf9BXSjQ8295irl","ciphertext":"DeEBgAnMTdyD4PbSr0E7Rel8OtTtIUw4y1rC1S/CzSqKecrx5LMjMdeuPs38uSXWOqzdcpt67WBHN5GphttyYK79fjBSl0e9dUU1cOAN5MwN8OFyrVPw5qaRzWoMVv5EnKH7EMdOEaRWHWMtjlSTbDBMAvcpG6zx4ahAbRNkcoZGlXntil8loikFu0Wc966MGgURJ7RiH0IpgsRTJqcFkzyUXABEU94ynp05dVYEWM33PPOwpAupObe06xd+m+1sp7B7QrjVTv5J1UFLYCIRCq243Tz8vhcCcGh4JAC6KwtMxi/OcuohQ20hk0ZvJX0JaEEyvLNr8pvEgYj80kRTn1T+GuE63XdRKu4dF88IWp02ds4sjorOzbPlxtPHZRc4JR5Cl32ysbqRHW0vQR7p8Vxg3S8C0vD/jSIJjetaUv24mzsqNJU7xmfFQz2mR5SjSp/u2P1muen5cWSbMdfo7tL6iNUxFlfxrxUPt2XXufgIqDXc9SgQtJYKu+36kvbZTsctPoANeSdF/SmQCSGr5tJKajVmq2AO7RYEU/ujRTqHYq8+45emGzNk3ucFyA3F7/XeC0px7F2+Q6D4kMNUPDlWwzLk8ttngpu55CxxfjD3PVpj2Wcb7rG4OswzDw/XZ4OCzuV0x4JAqSTCB529ZsfLoZBwjIHDGGSBnLDpuyUfyJi13Ze5FgnoHHwKoOpUSOsYboQNgcimsHH4H9WsAGxDzzwKTWKyqdMBOsuWnCqpP5n4m5aWXmymKQuw+o+gFaFbsgowJ30Md2EvOVQP7yPJHZSOqgJfMABrd7xJE+I/76Y6pByypv+ioUDd6S3oX8rU87gDvInqIx9kwwVeWFMXZj8zB9RtqLQO+rYCUILK/0QpsCPTeM1Wy6rNU5IB+m4GKY9j6QP5jT6nTLMe+O8Nlsug1Kf5pfJNMuf7Nqw1BJgVCHWF+2wg9nPi9woWAGRGuKY4CFHDQaRbtURzTtxnRg1UVrewvamKq2nD6X01mX1/ZyDepoteG5wYcGqESQXHl+2hf+Sft+m2aYBcEPpd869IeWlRQNH5o6tapabM/EtmMA7IeAmI81P1iI8f7Crou4Y2V1P89mMvBg0lGSEHP+77zcYF3xu55IClDoJFM4cHv6HK+HEZhuNfEmCxBjQn6uGFBJ+A28mqIOkFq7PXLvu94QRWRWGX9u4nG8peRHT0KwHFktE0JZxR87YFCEGNN13o8n6kIVP9iytNifquNXFGzaCXc8d5eyE8+ukeARXVOoTVOhnzkJZQOEg4cokDrVjlMrQZ/PULJftfPPRvPbU3GDBiUbqRV+e6kO8SGwKTl8LwkOuQyModchAtyCWWh4026R+k/hc6u5f2rWfi8TKaxDKzob1Xgc9pMBP8SOvUgWhXeJID9J6iQyNbKcHrBnjVkrubUktyRK6g3wHBXJZNV6KAuzN/FIaVNxwt9tui08ihJEyecvFYI9imAzE2WyKQxGHebAm4C2esbg7Mg1Hz0AYOv6UOt46Ai9aGxHBMUxRk0u6CvpnI6x4NnzNI8Nfw6yLqOmB6AX/0VhwRaRbzubPyPgNBfxnEQagl"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

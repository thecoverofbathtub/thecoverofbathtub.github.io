<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"VyLYMQokPAihlWtadkUGbw==","nonce":"mEMS9aIqLbS5iNSV","ciphertext":"sDDsJXF6KtG3oZNkLq7sLSaZ6nn3K8lBQHkdaWxlw83TXUwL5xLfmyc0XdUOTR8WZsLnZ34zbaYG2MsUrWVb7GBhKQoI8FaeCWosCPR+ubSe0u9kMXU2ZzwLzqhytHm7NKV15T5kf6DjZlfSC1W+9l2Rx+aIttQuyM0FNwl+VWsz/DtApdIhiTxfCnu0maNplo3v9XA1RFRLIgFo5YXPB2JkVdifNZ6+vuG3ZFNz86dyL4OS9ttHxKVlrejVZxbnXmMoDtpjdEF/Zn5J/r6txseuvHyV6Y/Yjp/5JRc5q00R6HDAIKhGUjgj07otPpASCuqBrqch5AwWjbXVgkZcTYHrWQt/L0xZXpCOqtzSZst7Z3VTc6o2Jg/WFtLxwmwUb9cV5t6uQWtMTnFiSR7N6UkgVcdNk5RXW1ok/T7KHjpRD1GH+K3LQnmdyvQEix7DzqqUq1pEX28QTHcCH6Ig7p+5aI0Viib9M4uu5lfIorEtYtDvIgFLU8+eNM19g93ZYHFw2KemBg9gC6Z947NhUM4CgGMScMDM6PxUt0RQuDxH90z8JkQ+oPLCuMKqJYk5POOKfU9gzsqtFC/OWUgcDv6vYw3IKa7O4sLqEtqhylOMq1/GPGHVfo1Ejhhq5SeWQ9+w6OvsO/SYFOkwfqtTmivRDZpAjYbZ+nPAwLEQGE8kRyd5UL/IS4NnAfunjDa8D5wTs6ZQQ4EhIKZRk6W2e+34jEyAmxObwlHatuefGOXTmIz+hZEt2XCSatjF+dO7yYm/pJYeNSurXYgT6FXbXg8RKQUWrKpoZERq8ta0Lcn9A3z/csscX01D+c+uSeRyGyfsM3dTrSerMeycpuKPfD1K44gy6WDDnxc5DiIX91NSfzx3Cc/3IEVnUGqBVt5WyjnRN6dfncUcRQKUgeQY0br17yLIyZPGwNU7hKbM2jXTULG72otT7VbpuOZyZ5tgcFNrJ/DvuTbvlXgkFOmQzBHcEpFoJEophd6e6IW0jEu0bPAqMbPIM/teJejbsb57H/nrfExKPFJpC3cBapVrrvSibTXjKIEmbN1xPSF4oq6Uktqy3hW1s1GD8QU2T+/BqqiuE25dsupFANd20ceiwX3xCo4rnhDA4ZZzx9KNtk3tYHjuj7kLnjCJLo0Cvk2j00TMeZM6tVLfqDuQbd/yOvzvtbRPqqxBvL0ENS/cNF/nrwM7RIC7TFeHN0k7LHq5QHET5KfLR+RT8X01LthWoNqZ6n84oxnIHzY8KHGSMvYQW+3BjzTje3LzE2/rL5EX1HjvHAgHkZOZom2REQt33vZbdRYF1OBzZzfyr29QvKmt+PLSbxeF0ICCxLmk6mQfmeKqDfNKYZ0t318/o/VH8YItGLXXddZuvOx9yRj4ODHjsuK2B4MMDE4YGasktiPuA0PNvPWiwy1JX00Dtcq+gQe50foUz2YUErWhazAs9aJSWTWwuJe81JkGPs+jh3K6++D7B5OFXOe25fH7n3sSmBGq8dG+RwPYpSC4IQ2uAD1ZXdB+6L/COLQKto8vArgCwVRnZCEb5HnM8rOS6QTSdb7EXoSp8U8iyijo58omXLPU"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

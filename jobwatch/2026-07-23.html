<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"c3sn2LQFppresdkq7z6LIg==","nonce":"/sFs+Jn+oXyNlrmP","ciphertext":"tEjcBfxFD12nhA0AVHdeFxSYddHy90MhSpLH/S1uv4CBXrqHAIY0Z0UdZJWCLV0bHyv8r1fQKSayYeyF+ni0xLZb9x9DlWemb2St7FGfpKFgqcLiAA7CmKwakCOmNx5WJvk8oZzpi2RjMz6hF7vqszPi0N70LbjbNtiwd7ZnYgbUY5TXHggNDqm6Z74dIrb5sZQIKcsPpXM5/CUinxA5y7dOhIcy3Aladf/peBPzZs+g/4mGUM+reEU8DSnXbqJ7eXsvsg+drLQJR/nieIUG3utNN9Jnvo+WDAMbqTasbMUNuA4frwYQHXgxb6OYYfTFX8IQxAxaeHNsFS5O7VW2ji5jKmeDs5Z0VeDmxiB+5kTUBOSbf3E8Sxd5smdXCQwTHlT1au8dIli2sO8l1ZpwSdrf9681LaITUfEe29su9lhHgBSRIDsz+FyePFXqKy1hlNq1atzAtFBVxKI+7g21mtImvNvwSx/eNnefLDN/M1pcgD35kSTahjVTInMbqNqJuoOTaZkyyhv0RGkAn0VO6tHACv1S22br75KVGVHUjqEmnjLf0x0/JyTmjJmd1PHLQ98UVJlKbjzhTcSLPm4fHUyXehQF/bmSHnks3cOkpUrQRYmo+bxC/bNVAfnSi4gf0tl1uIpCoEHaWVssamKQFLMGkvflBlGhlqqYTik2lO+NdWjU+/kPlu71aPguUcl8DTTzrTcHNM0dMq3QsPFCKUq+ndFQB8kug+BUEXWkdMYIwTQjIQADvqpfkt6DF7QiEevf9xE0BY9U+ahpgweMJjypnHwWo3NowUem66Xar2J+If3kIA6oZp2lkAQeb760c80EIuDSUI7xxD5IkcYNEHHpi+zggOHgrLBydeaaxUKbGpHkRzd2Fyp29AlsL3ki87YOnKJNiQ/Mq2R1q2qGppPlXPgM+3IFvCtBZgGIFCaIs//zbIyzp3uRbUr06AZTC121WJhhckGl47YK0TVp5McBF/CBvkGgjOkogVBPSj59KDWnFsPHVwgqKZEiLdW4zy1NxAQuzU6Doht2x0OtDrA1OOFPDJMiEVxnTC5+AT1X8ycKY3djBVw/K91lta9DH9EdqisTTxHtpYMgYKzaWam+DKyQ6ou9TFm1WMXFSYVPZAi7vPcJ5n/Hf2VvuCKq4ycliubdN+GB7AXTN3O3Tpx1PnS4kRpvGRTp2PYBF1UpuDVE6Hxr3azeH45E5hKEqAQMnX1hw7dzTtYXHqqF3Nz6PSytWLTZrv5f67t/k6PeCNGcnSb7RmkDFH3ZvAH224vQhyCdTDbNgpZ6+8eKM2Xer4E8kiQX24XTq1zCZZFnkY9IhLbH+HD/xulxtmaZq70GAgxhpEj5fy1tHtlPoPm58pbKny8MxpKK1b6zpjX9MVko+3EBK3sLoKrAYt/KjERQBZQBxKXDoAKr0CwOfd0KtGMJpZaEtzmk8NCaAzXMnZXngAY4xdJ5v75FVaaHnfHNhQPmIiKAgSn9BDSSaGvqVRqnnZ8rGMUnhV1iuO00NG3mhVQ24fazrEw8DYdv4LQH3vyI8VaJnxBsCygiRKCyenaH55rP0pfWtmnO4UKX"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"gmcGbVNrLG3nXQuXR9X09g==","nonce":"zxmaMgZP56b8raMi","ciphertext":"IZ/0Atrq+Wx7yYm9JRBCUfem3cfN+2lW8a0XrKg9rEQ2BBd6YVxNay9js2YSef9TveRu1ptgcmJxP0YzelUd3dn7lEIUU57C3BsZ/YU7sdw76+nOsvYuZsOGtNkcFO8VQ53u2VKTgiQCVH+zKROSlhqDh5lA0kCRrkggY+LTxCSHwRukOlL9bnkZrUfJXo8lf30Z48DBrK1+8yvF+bXsnjWcCLXbVW+uol8u8lLAXBk8otKJy42X0S7RdUv5alR55wYoBwgUYJZzwuU9NQOVcJ2NaVtA9qSKjFoBtrdkaGKZUu/V54ABLTBQbcvL5cPobKIYDNuTgpRviO3alWy7iYeBlpAfhN9SRwxfRI2X67Ek5EMnWAQH7hzpWdXBS1Y+/plg2uNE/RdieBrXD+tYbmef4+eJzyQsJOhvoiexeHuTHh+8OUZnVy3lNDmvxT+irWp1YSiVnK85pMmK+wtm8pOweAk3o0T2vIgS5t9dSwPMJxiibT1FqzfoYILS63SaAKdXms6gIVgXRp+H+053RPGBNKmsEYHdjevvVWBnM2EmIUxT225uGhXtDXe2YXcx5gitqr1By3QTI+2OrAd9R5fOmfFWiWK/rej2qN41xhXdKbc+d7m7UWnqg5hViKv0QVXnBnE3BhpRmtDe9g0Ke8c3lNOuwfiF7lMzaU8LTkqFE1EKEWU76o/wodTph7tNIkwdPFx119Hhqgw5pehj4YbReNwH8zV+hVCr8FtfGRQJmVflhPEGklU67SczGl5fw1Tip8oHy5+Nhuh1+eYY7cmi1I4OJeUx68jNzbMVjthHR07L9kuAZjEhmtO5/Nf3QXIoTsreLZcWIxy7eQVhRs7v4VispqEgYEb7OXTgus5EIRRhJl/tYZ+2vpdY6KPGnpj3laV8sp0h2EiptjCaJo2LYxUxyd4s8FvJjFfcRcqWg4WQMJZXimE3qBV7QB/Y7hcdJZaAvwLmFXOY+7We6ThIyAW2MxN9b0NGEnQZbEznLqgmd5IM8t+bhIZj672KdToLoXn9y5GHXECqsW/zaLa0OJBxuDFKVlnvCVc5hH1HIdBmPqpFwq81IGjG8C0Juv9gsGkLrmvQxQbz0TvR5BDQC/kXTNXk1/u/3hUmMDAa0Q2JG5yNCeNgDMtNPNpqBwm8mwzyfctgyM9E2DnPK1sh2gArNV+nwt82oNCml9c+S8wCM6dZRm5MKnMRj/ah/jnLLrR/Q6EIuhL64X3V6i9h5FtbVZSXFEawOMMYMm/cKqSUR/SaA5HwLwRoNpaTvfMUEZetbiR1tv9XmjOhw3fvFqA2p8c7tU4E4LU6LQSwnUNm8I8ZZH0k0KELqJSMMbI71b0N6+HyV8gJP5LL030tkKZNUkKl4UDEHE8tbVS9sCorzZUVWMOoD7FSvqCwK6K87q3i9B3CjKNmHkaOFHjv7eC1dySaNGaWQDsaSvEVjHRs8Wd/C6346iB1gnq8wPqiqDyjaZXu4Mn9BbPE2kvFHy7J1rJWilcNfVz9jp78AvET9r/pAojI4++q8f+0DJtu74iShY/u2t+bwOQXQe9wQ9YMhsFOK6EjRQI5qx+B"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

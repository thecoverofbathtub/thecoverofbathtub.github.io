<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"fXh/dx5bScSz+J9e7YCc5Q==","nonce":"RM8AjPMdUPJBUDK9","ciphertext":"kdly/mnRKpEAnO+JAteczrd0msOyJD7BtzaOiWCTvmJOh24bqnsqsyV8nRIIbR7l1Jf1yLBuXyCMBkp7xZSrjJpVuf4L0VG0ds+pmVuVufMsL41zCa3ivVqnUHq6HhcFK1P0TU5pzDretkFD+ETZiulxrWblUOkS+nV1X2/MSKDKEQPObmQQxCSBJVOuOopPewwmm9eGpNXwNrTF8bfJHFWGIgi5G0nSVUZLMBilUGMmYm7fa9zzf7V6DAh955CtOpX/qHXZqz0CA/3mEm5j2HiWYDF0kfVB6JagRRBrIcew/egzS5PixxOsDnv+W+PZpjrQcDnvVje0/d6Tw2aXYnpQnIBLoX5a+85jBcRkv5UgAH+1a2mJZ9MAU1oSZz975bs6x07HRf2dNL8niqxOHsNmVCY+cZqia+8htgBjMgJCaOU6Q61DNnIXgTk8xI5ufFZS6uKqmgmv5DJHLxoaz4xevBzOwYLGgZF3ungD2Wv6Vt/SPLn+2jPWlAvteUQccxJdKcOqaqi7mjYmnzoY9NItYJFo6L7Vlxg/hwxgKsvQsbgi34eh0rHOhkRg7iipm4EgLFrJS2nvf841QNLIRadhvgCbjZc6sFEV+TLQEU3pOIMWhXaNGAJWBCVISU+dN8XRL9EPbqqgqa33qQCaOOHAbfYhm4grVGytYAnfiJz1HS5owJ0I3smoMw4eW7m8Z0TQrPn80n7EDcNqMNoXbU8BoXvl0PwCCGO2DHGKDYyWm24bQTpS1mlsG1gAEKr4vO1L6EzMv57Tcqm0UwGUi7QxUoqEkz8SuTKZLQn/+DgeM+dHeCekZChG40xMxsIeZRx2do7dA7nEaONQwyhGB+bzU6NiB5lOy9SyOguQgaVQMdW8rIm9beJf4kNRklYyHoGO3cWPcLmQRQ/pGBjZvJFQT+CABIQArsuIPbPmfh4TxkGfXJIaUmuyEfAOrTyk0h+tZhfupnOgwwvDUthsv7OzEfPoSzKuamk1rGzIj5gYCWHckRukio0hrC40GpzPSb/+56Cc/8zD8pFD5yhrx2GQjZ4kDmcJ5wLTgWbbtdtdBmaViAgA6t/yJNCkB/3iIxRoJCxDfNwd/RqfXcFKOboK8CIS57LewJ+DIy1icj3vmh2AlsiqIlkmbQElogvj19PQEt1ESr83o4sQ+aZpqqpbCDDp3Lh7gO3oCGdoogrhNBgjPJEPKtRf35ZULhTBHt8yRELGCwugW6zSsjKHqRfb1VBWD1mvWZUlNGj2vHJSib8CkuG39ij2WyiDMJ/eS0Epw18R4p0DHCFeLo7Qr8tfuOImWn4Sk+h17WvCJvgqi0N/k4CQI0uWMMyrfMyY0OZJyni42H0dAaDoxQNqITOhRxRhp8lKCOOmc56aYxTxBz7j9V+utd8e+EvdyOXH0ULZMwNjdU3LnKixxFOg/Z7xg1Au7Pp1jBAjowDIzbqSrp0diXNLtqEDch4rv5JCVCaDcMLhzfM5sfrNoVAD8D7NJH7rSk4zC6u3BaGkA5IKkSeKij1lJKPpzeRLt9vtkNWKItPvwu+qf9bqT9E9rJsaPrIzDsh+fHjLjiAkPRaY"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

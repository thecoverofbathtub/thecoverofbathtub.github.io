<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"I7nYKmOs/OQ537B5FNezxw==","nonce":"4e6rpFKawcQBG8lU","ciphertext":"RjJvj0mkYH3hOqbxUhwWUXhEKGlIoNUc8DX8KopD0o3lKcsqf5tPpAxQcJ6L7W3I+WuMrZWqQhStZdmP/rC/rw9GK7AdtGj+XcX/hx1auWLCgwz+CzPcSZs/To0ItErj/8cyWFiZ/SejoGfGISBgak7lvlgltG7DZJOrXDCqv/zhmcX0ueyKFyx7AKGoztL61o/tmidqkNTrNmbBL24fRJvGtyVUKijPruuwHISqUZ4rZXVo3vpWUxB/yN7Zy1RLCKJCiXI9ujo23szeoU1PYNJ2N7J6tHoc5gq8EYkd5PYt18d9ijrZBfskTHLLs3yxIuoxZY6u8Ox4Fyd+8YEkGQIbMWCr1EvI+jyQs+/6WZa+KCQ6kL50mNr4hkLUBTYDJ/wmpiJkRiRKfbG+lnNMc24/MBGMBDUfmj8Pm3MpSiDgUmr4AMrz5T69SirLnxTqVvtEZsl1sgY4ZPjULv3rEalhjIBSQ65LPxXS2Ro9QG7adLn+Oq43MeL3XLQC9Ypk+w00UccZoQTr94swpjUu2duGDuE0vJWmUC2XVT3WX2a4a/JsbXEm4t/H6gl5JiUd/y/vRDG7+AoO449H2RZsaQ5ObLk4Y67VGMB4N34FQYDpj3uI6tGsS7AtHJ+aDg88V7IqrQeJDgdizVbfvfpJjWfi6XLrJUuVibOHaCNI9Px+MKNnqUDFfz3wcoAnxs2Y6KypGyfyTN+DrIifAIkDqaashCplKrRgIHWO7wXvkfDHB7F+AOubfAsTJ7jVOP882edt3ulu60QKcE5+Pny5aZePUQUSh7XZv2scYDj8uN3HX4gH9G9J3ZvFZipfYK8bIjaOBtfNvJO2KVCSBrKx3/BiGS2/iYNOEVnUX/x7Mg14rMT1xIV5HRsi668pbrXHrVUJ1KCmIz7xhJOqcwamKo3f8+4AlOP0gI2oYB7ev4tIjY1K3igBaP3xIbsynwYtHTakRKPhQh65sN5JAGPV6sSuIdvUwUzt6xSuFaD9IN018AXiPga/aBG9oyKlesGrRhOi3JQGNr7YeoZ6MXGWowVB8r+cSeNnbvJ/I8QIIeDJRmNRZoHaDcInDHDVMbOMHCgFX/wYvfUHWw+AzAvgMnn0nDsF5Gb8BoNfk70SRyEiXuCjwa1BeFClkJN+9P4MLFG/e0NfoT1bCxcdMSd6MZUg42a4JYNwFzBwFyCY9rCAlpbiZAu6Wv7RhgK21sUC30WZEyfGAQ1DFMu8nflAfK701XZEYyR4IWBw9Gcd/bwsz22j7SwbRwn7+TclJtx0/tzPZK/nL3AuFEeQar8IYrSLw4iEKuiXR7wLOz7Qk/mOIehBdllYtdjh0tRqjj40l9XC/NGOPJ4iwn8FV1E/ZRfZblr4IFpkr9i3VboTYz0FDsNlZGfovbXk3WUGN5OvcSKxW0nLhDlnbzlFHrPwwcq0QAVRjX1EjYPL2VquLlJ6/sFD9b9UhNrnX9bsGpF6uHLmGDppO7iTvUrW5o/AhC2ZRvqbIfgFmMQ6yflYdH7S5AKcvZfp6ItQc2yRUYFziCR4Kenx+uS/rSb0BVsfP8L9187PIru6o1YgEHEXsPTW"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"NeU1RgRJ5jqyYfsl0wzs1A==","nonce":"aBrW/t4iKIwwNA8L","ciphertext":"dYQmdXipkdxCX3gDSZrsFdoMKafnEc+YAp1vR0crfdmL4AHwNP9nckqBlbkUDEQsZjbVS0HkZe+1vu4OrSI50GZwo3mlvQ51xz5/eVaXLgU7Tl05IJl73xz4oSCRgHuU7lwSH7/0iEvRhZNtZNJrBpaeTlJM144x8R5IHZ+jFrs/cnE3Sy5hW/GFViIXJAkuRyug0zTKqeJQ7uu4fYiXt/eYFmdsQPcj32Z+E1VYmEQhRaLffmCTh5jyml7H/CnqmnQnc+JXxxjhtm4A1RUy9euyTOjCBTJyJT8bzxEATOWJSDaTNXklJqcgNX2SAz11VGxk6S/GH22enkXgLWBQPQhqj/138rf40P+cwSX+T78FPnkR7I50BpKRIMZtkqCvahLJZwKnoMvbU98E5ZSXwO8pMFFsrYwU6ykTFIo5XcZtJG7UQ1uFnXhe89vWhvlmV+di5eKIGIavQ6aloAqxU3OKwjdp4w7oclN4M2kKmvDacVkuK5E9iR+qxcr1K8NRFQzHSnpB5BDmBw9FDeLOyaId0Qw2rn41hOBbGy9nbvjIjHbgmb3h8WAFgcv+zgB1HubipkOr55/p6yUVccgo7d2wGUayUslmszQeIK/1DQhscLYojuuix2Jk8kzS4nrccr+EeGYTmUNbnCxQLgSxjKhuOcMYK4vSviIVrOlXJzEJNwyIVML/dc10VCfMYflsphD1CvcKrFpJ8+YcNt4van8sK9R7FI+IRWWk0A9Q6nfO3d2fpbtb3lXbWFvj0X54xMvdgyc7NlnJ0OriCzyOzWs98nURqJBiUnIcMhbmKXSyQ3HrZxtjfdL6K/+s8I9cQwwPiyEswMzV7ES2gjY5pNZgl/uzgs/Ao/Ui7+SZN8iUMkM9mNezTZEelSwsnMZ5iooDx3k6fjaq/rGbjiXiZwNSAUkfJ8B7hUE+JzH1FwbfNopyFE3voXnWGeHII/8iJE2LxpVHmccSbzyTR7+B+ngPoLZx8UCRLvvt/389iEkZCjpj2F0nCkCzdHPhUrH1auy7sWnOaSX8kzFK9hxWnKORyZx88EUMwFX+HMgXz2Zu5Xamsx1deblXYp3r0QfIp7kaoitE7VwWSRf+NgXfLYW2EN37wrH+8XU4qcInebN/z+xeYmFjVkGLOIDtcmRkeNJ1LHJRgE7hesa8jT4sYcUhxteKOSwHca4pzTZI2KJgOdOagZger9T7DgQCwGF0H4Seiyx2SGX8nOkcBAhIsGtO3y/KZzP/jDPJYUP0OEE2jjxEiQWMzVKkZv5p3HxdhhWAkpTLbm0mIjJP1KnrofE4myzMCfpXfgCLTW6trfJHMz9yUGN7boVJ/FXnr0Q5yAgVhq2itMbZuzMY9eLSDfmiU37rTlJ3BOnSQI63mP2zMdtssbSpvrUETGsmAkIJOQYGB57bdPjgyQdoh9eSxxW43QZsPCXktXsEdKPYxh/RIR6cTfYbuvzDIPJU6BDV2+J3LAik3j2G3YKeRhE7zw+6/YLLVuoQaDQhBdltwHW1uzTiFr2Z4a5gNR9QzsLUshLcIA13BAw/lcJMO4jwg+w5bzqA0/S3Ryoo5rq8hS3f"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

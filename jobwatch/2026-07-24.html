<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"nTL76NJ2d6za/D1Aq+tmNQ==","nonce":"y4hil9PTwukRpQrb","ciphertext":"GMDlwHC/ndg4eWSzvFyS87+XbCaNzD4is96WRw9HOkmQKDrvtXep8cVPcVPAnrCobZxP8Zr6RnRMJmeTJzBmWdURHEY5t0h5qaEwd7MZSKGowUymX1niaKa1QgJ0CDVmvTVoRmxCJ1ARnwcdLXB8ZXaGQ/X9JLIRG5vJGeVhcL1LMdqeH1EKHCSkpET3uzn7Td+vRs2C5Vl3+7vgXRQwh/PSCR++r3n1yYi/IOb/M3FDaDdP1Mlksni0A5MNcAs/P1vj1NaHE7r/3b+eWMRHrJytDwEPQtroRk2hVxec4O+ePXNWsZzRKQW6BGx7J8wNIZ7CG77FxpnAtOimHukAwNq5Y8XHSu1G3MQrECAnGYqpVbyFF3YajrYQPMbC8QKqDs443JXqFhtjIcdiCnKbFCkUWSLM6JsKEHxNN/PncSmhGh7SJgI67z/47PeEGZotbBNacYj43dnlE4bTWhorNMlYF2LsmQEICYfEeKWkQMFK4AyajDuosDhrGywSS2P0yZOs8Z0yD6gkYqmQqraaiF4n95GFvuwvE7LZIbYd/EWUxussQr7Ic/1VO7p0dmLkZeuV0oMeTnryl3J48m2MI0ZjISo/N+J0+q5sX8xWZnWG1Sbe4X2Gdm7pK/RdQhl61BOoUERdA1dLJ47yHgIkOUgXRKNb8x2Ed8DW9SxmsuInbB+81d8H7G5iSWt4/kkVlSL9VZZ3FGZ+IeRniB83ndvw2Fs9kOTLRlMyRuzAQnVdXd824EB7eAQe3ZeaLGTJw7e5Mv38eB7STVTy80Cwy7XLqq4eaUUV7zi/SUH16h17jN9Jb0Yh9wpsx2v00OPF6ypIxQY5B7IHm8MWP8BQ44IdwN4zrA8y1lhqg4F5RW23e2O+mt4eNut/HBbr5qiyWdFZYIR/a5PupHTGB8lpfjpbXZm8GTuZh2mLoQEOVNdTsFoDflGW9C4VJLEJ3mcQDDtda5kT+GRtB6Qp7hZZbCeS0WH3fBxVpRH5D1vUML+P0R3fdB7qm9qSV/7+8UZaV2E+ZyuCfx/UpGxXZMwbxBrhcaCFv27vKCI5SoE9C1a48uY0AodyYroUFJPrVc3EsgEIKDwi1O3HWQTSfXguFSjL1t30uTUn6WaeRQOsVVUPzD3imyUpTnBpCxKY7VLDQRi+OsXk7uUmjJrTMe2PiK3rEWmGTVh6RNCRYiqA0NF5WYjNomShdfDSGt/Uxo4DNQIyTvlSoO9gAslZIOjugZmyyK4ngPpHSeAdIogKu5QkGHazFIUL/Csvwwi/CIPmwZa8NvyMyEVrho82cp8PsUjeWJJfB2XdtA17jbWTgyjKH/PK/4Poj2kOExupIdJ7tv37JiO5GE3psVvH62ePhUdsMxtADwwgW+ksRyIxZVd90pBoWGMLQesaMB4F6l0NSwwBpfXtLFI4msbklJaMQekoPFtF+xVw7+aEWHoEZ5vpJzKIXYLrwgErY11+i1AzdUG8F9Y8xanfPaR6DnVGg58tW2SUIndqC6AEd4TdK6NJW1ctZ0w1ARkXIk7TWQaoL0OK35qzkndiMWRWQhpRbrjTwv1Lj/fNFZx4v4olyYBY"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"UQpNUJwvwqG4HWnCAnkdGg==","nonce":"NhVkEZRvqonXKUGb","ciphertext":"xRiK7we7LIZx71ilaZYUH+Rs8FBUCCBSNMvNEceFeN5TSzU2DjhkmZU9jn7N5r8DPDl/2U66Kq1V64X0oCYhRzDir8PRmOl25d7vUJcGI49uIryRwSfeTsyLUQzN/7nt4pNNccQ8gJJCFU+Ry+rzGLpotXG61Xhz9knf15XCW3obXzZ0AoTKZkK6IRaUtun9REFL1s49UvLlxFLaDu0HFfGub4VrcYQGl5j/+lutXN6xlSD9VnGoevjPj3Hb5kNXMpjbsWq8FM9NucAbllU71ZgevdH5hh7uafYM5Do99h+JkPbjFmMfJ0yzcwuuP2fcO8EWpH1QYJBf8eUWgbwoHvpVOVbkzCv8vjxgRKofgUgmTL3gCIRIZT45S+qkrPcduwY6EUFq3JTvg+sYWu73TP4th5K/HdRq2bEGrZOuLgcpgmIjTkUdLE3LXiFWHtfmoLEl2Hcr22LXSf58lqDk/mZXASzFWYFQGsalPRraa9cpc24Hz7wsQ9od2qFckkbh/RlB+Zamhrlo9a47OOjP/srd5hSYj6fC4XbCv9l640yfPrEfebMLoYRS+YYOIsEyKKA7pwmdDG2vEpJxYKo3CcOk2E8GPJrNZaySthpTIa9I9mZn0bPYdC1BpIV85HyZd1yZTWf1mj9qsJdc1adWZ+f/iij1JymRahbfE0ox99ujcInKchE82pyPMp+mPfWvwEvPiRO3lahl2ov5cK4NolYONU5sXqWbPD3/WvShM1N4JSiOhQdb5FMsUsoRp7IR3CnlDeTsKwr5GREQ7llOpPQhzxV43Wh+6VpPQnH83R8YDy5JGzJiTn7XcDCQ8qX8SJMjtccXpstoOpZ7fQfwZ7VLLQpdnUeA9aGtZUdMepipHvKpu02MheIjmZPhBt80JTzzE1GR51gzjaMN6g/0Ni4JS/g8e/PSP2RJPPG28EbttSeSbxCBsjR0TurHT5oRuDlk8EJDmz/Kdap7SzH5nHLPM621QSCz8NThgoDklaZ13L+DDJez+LLTKsEgYqXuXjUPMS6y2lfqtTFzhgFE1lxwSOCZsKDiWtKWJTriafAtTc1QHeciJTj868e0Rfv8Vmj7x6chb2i7F7FVEOJSZQjf0BqocsT3JrRO7M0QCiVIbau3dB9Rh9eSMxOoymCF6bCMd36+hlGAqDvyiuMOZ8K4BOzM+ubzD9Au+BOE3zv2qQSlyByfcCC2h9N9GPn6wMpadPHfj7KlMcxASZ4xIkOT22Ja7UCD44rpcNOXYhhg2DXC99PEhIg4xKG1AhxZwnzRkmhZNQJkBivWGl+PEibPHESniQfKQokpzvEaDY36rF9wOerrSNU49v5er16nqw5Fa3Y3+9N5LtsiR3YIkhMmWvoVTnTooULjF0EKEk4/M6DIoEjfJ2yW+MNyf5mFHoUjSvNXWaATZqgmXCPE8XU46J2RtHw/P7L4dQy6bpkTzlIH9aOuWRkxRrX1lr8rOMs6dNX3pQpWltdtsAChWjcA2cZsFwFrqG2MfJXASAVtA0pV5PPYIXmVPq2YZaxDGZG6fax+cnZY0QdDi7y0PKgqdW9U7f+u3jnG0dcSqOwz"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

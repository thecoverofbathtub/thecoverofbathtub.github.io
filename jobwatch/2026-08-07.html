<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"xKxoZMnELUqiShCeepfqYw==","nonce":"Mf1FZ8CdnoQTSNol","ciphertext":"98oRyuSIgMl3GOt1m2CePqaOB1L+D+a59IVC/digFeZ3jvmIam7Zc/prp2n64cEgQl2Qlv9wwkzaR2HdtCzEQRXaoSDIFBcwVizRvdyQI1Q11mS2uKmwAjy6jtcI2uRG3hUwjgNaRM4jelBogrbifOwj10Vp0BzNSchYttHnMtVLQInbjR3fZ7jueqksWoUuO+JHJTWb/uu/WqH7P9peoW66S5EVmnGfR88PW/bSDjlXwms/FfZicUQYuFxbnbZD+KmnoMa2LEboYaeGWMRwdLL0KDZhDB4MFpc4iW4NFdv9QusH3pa6WHvozcTTCpo9UurGDjxbukHxEofYzfH13PpI8ghRLDBopomvTCt6GuRSUidKoSDmBm9+E63q8IwiBVg6b1cgDTlche2O9peiB4bcuTAM8e8xSxcEOH8XZ+5x/vRPBe6BNlPGm9bGfzd1aUgdbdSTilFhhgfrciwafVWFWOl6cXO6QdmSibfbkG4B7Lc78XXR8nna24tEN5YZA/qQxPeNJTGea8jcLMLq95GiKqRqPE8oEMlYxUxakxmj74ibVHWW1BO2sEH1mcSrerkdhjZjtmv4R7QhkSkSMERCcUsVto1hk1Py3NvithofqlNbQA5ZIrAJBaSBfNL7SCgs2yiAcNLWymcB6FDs3oezn3TZm4PKuY+Vik3BT/5NBiilk2dVqESpmohnfqZ9SdcibNKmRnCLgLWSAfMNhcBKb7tL5rrb4JLl9jJAZsZwPZQpqjEPIPPcQK8gpZ/15Bni3SXAlIkh5sNxQAj/P3DhyH/+WfYW1zkUQ8CEuOIjGa/JCJpfkGneD3877ZW5KMQO9+K5uDWBf/ocupo5ufFI2maHafF3pxQYPyDN7RR2oiOWsEtfBLSjNT2WZ3FlxsuYvDKviTSynvZ/RX5tjU/IhkR6cLXleZRtHVAGYQ4vQL79CnVBFRxX4AFlOu67nC+03tfKtkI5J72OQ0N1NiYeOHpVHvUrc6k1oUsV8bpSsxi10cXOCdi8vA2t6AqJEd5lW/zXHKjqD+OR7Ys8JUauh0l7w+KTG40dRttDIbaw2dJk8QgKKwafkSbRkGuXzL/mAKA5awsfHsh1Z9SriQbFH8GEJlZE2Umc12hKI6BMzCDG9/YddL/sFMDsKoTIpEEAVk0aq6RjcgbwWbJS1Q2TYg2EZHLZ+zXKcTIJd2xoLegWMz/2WymldGlzOJldI+g7RG37HwyE+Lbz6qKdfWgmYOMadVUUS4sQfLxIZDp5E5zNvU/D3kJmsAbSsHNrgmkuLJNebNdtsc2lMW12Bk5A39ugAcc5UX+7CrrjJXAmgrur6KVQXvZwfSuB/+3hYOJOEJr1eNmd+9ZMrzOEBzwjvT3IrEvpPoT6CnoQ9eX4XOeqM6lTHWxnuk2713vpHHQcjZQilberQgOhswXlpCbSFI4PocdWWvufe99ZONYPKwjorKM63U1YH7tJOlQi/vvRbbI2JGLBZ0MG4Kp6Nl1fRrV3lkmbcipP5p8WkfGZQekqHc4EIt5W6SNlVTBuM3y/qa20MB4sIxnSHGudtbwtU+TvN3f05CdY5EjL+joh"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

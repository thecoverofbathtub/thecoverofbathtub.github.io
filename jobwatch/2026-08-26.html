<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"QTxhqklSpPPgb9MAXXl8YA==","nonce":"txzQXnCDvplOra75","ciphertext":"rE80iRJEE3kwqu54ZgVV25cYTiYTFwGQLtavcKwVhAlLf0Fo22+f75LL96UYUEsYCv7WgMjT9uGeQnXrow01MN9Q0d8BSVDrCZAR1JvnL1rA9PIKeSqLe2PCaPbptwyVMMsIVsWpQdaPKrBP3gNYIwP9swsWf3Wg8crct1weQGWEq9GMAHZeDNuHRoonFfND1gNJ2uPliHO9VG3o7O7akZ/dA2ACaSKNMPkLeAhyFjsum+VOjugjViXKMVeizrOWaicVY2AA6SoWhGioCSt54tp6/CofCaUrtn7R6QKKV8bO1K6VmW56il3Thqwoxm8f7/9eCY7XnZnZdPr7JAJ5Tx/HYdAz2nMWLKbmPgqWTP9Cx1NxvEuUkRYP1v1/wJMV5EpX5kabCZ/XeOVYdHMqD5TgSpeZZJfxoWRXn8uoWIcDEOOkZmrwuX4CQ9k5Jgx+r1Wn2WRk9g0uyHvCxfqxo0+JQZIogcXvnVzg/xN4fKdxVlEqP26nqxrzDETpmQm8x4E+fAFaZgGBehSF/LpQGheUhVRR+1XERv4fcSYBI8DTDuQc8j3Dw9Jth+lyODnDqXCFfMfhRO1dGhqYUAg3sTEtiUm5sr/VWGF79kH/qqVQIMVo5Qv5oqWTeRbks3dxpdKJnYWHs5Oa78WOhkgmUz2qyHK3yoZ0PAL6B1oC0uwt51lnVfdDjplv54IWwDnuQw5SmwtP5bXS8gEARweOXizOI6y1BwIGzuomyZze4UCcr7ECSh0deUeFRGLvlQhs6SR/cYtTCPNd+SQPyPdRernOVKcLXlPdgsyfxlp8s2G8SInhrWQ7gvX8Rk532GI08YvK3JPZT+LJEIt0MpCj+Qlc+f4VeYUsNLW7Zx0x5ybRzoP+I39M7KEkMwgDi0gFcpKeupJKU2yjdQUUDLxq0JVfNCphE42wMofo1+M3EENWsn0d12JFofjJxKexmsDGQbafjVTPBEWUfK6whW91Sp0gj+TjmYQU1855YySCobHkihtQANibIj14Ggju5JxM4p4V962xps2kue7v62ucKIekzJTwekXpHuUT7gmjy4XkAeL+6cZwLR8ig/6sV+muHlAf+W0Ajs700XJ8keP1sMzU5l9HEOZf3YgFwDVZ10mABxU3J4m3xq57wVLIAOYWAWSq4o2Icew++hlZccooEx8CoZzkahgui1hAyEbTKTNgo+vqJCMpuLb2IlsgmFtSaG6Z327HjaNoY3BW6kA44Xr4XibI63WxKgisSFWA5+bhUZrm31U9e6oEoLoKjld8t32EA2tzGYZY8idQkx0CtCcYAe4fmkb3pXV4KmOzKbb/x4XwmPvf+XcEmmBiEKBCuSAoZidVICkDKxBgeUybRQ1hMop7UP1Zzf6R6QKF9QXhkwCXtXO9/PoSxhAuDLSc3hZ9tRMABhtM+p/diZOW6sJ6UN0JIEdKG1FtjwPLUIGuFN43sfMPWOWIL//DFh1VfNNpt3pyOS0TiijL0X6ELVK5JQqut99Xw1NrvD9b8sbh0ohdv1gwYpYyjd1Vl3kvGm5aMB/hblnGbXHrounOY0DdgjmabcCqLavrxN3eURc2"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

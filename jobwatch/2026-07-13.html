<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"2qKEKaq22ZaahFI0mtXo0A==","nonce":"BO+RxHc02zVuDlHf","ciphertext":"vPd47dijNgMmyzpYcNVS9I2aMrAEuMs9YxrziWN2RmomWqsL5irMweMI3ebUAmDrbyKkfQGGrsk6MW4AsvvyGel0hsC2tfzc9Jv0meCh4HLO/g1tlZaXVPjUxyJhCcxpoCJGbolxF1LOCInz5IZHsaNubhUbbcV22kTCsgTvwwW9Kdq74d6Mk44PPO7dg/O7l/G/0tKlx//nH9rlOw+LEP04lwcXYhnlCgBKysHJle9xBM9jX3BfuhM5xl4x5VpRWB09DuooqxyJamZ739+5WmkQ6hHSHNJe1s5WrRF+liEpRdTcbPhlrW/ECzfAtivPmQ1NXAI5iWrsYtnX22MVeZSUBT8QbWbRbvx80//QKuVJFIZdCeBW+4sASVmVugjvmUKsq2VqjH6IBKxrnatx2LPlNpUjR1xdZKAhgCb3vDlxGipqwqDegq9ZewaRA1y7vT1K2DdkcUZ2+u51r42DW0r9ETsbmi5hNzmd8KnoAM6Zqw7+WPrJ2YFwQJO4O7y0UYxCmLdp3nwbgplw+8FVQhAml5YU7Rc3JsnTuwppU9Tniddz99+811cDf3a2Dokg8FT+7S2CvAfQgOZZRDFz0/OjasLRB+PAAB7eqYMzy531+8LFyB9diuH3qx7GCvnFyZWzfFPcCJirE0Szx+C6RuIK1Z9t0oIVAbX65vo24PDRB54hCuxPErISkHD4s/Y6L45XiLTGeg5xxVkOqmzLkKuyVSXewXmCOlZDY8c14sGRb1RLfTcjcddKISjJFYwRxfe4LBgP9E5P+ktgqGAzTM1JDFhTbi4uNngkHxLSTPxJj0yrZORaDPDIjZoGy1B5NhXA/PUizB4lI5PNWVgyC6ebxLLiRdmHjneVCpJYEoDcOEu7I1Fbmlys4XADG175nqcoXWawGWXV71PD4wkoLVVFaCkhNHECnW6iKaWcTWv6Up37vOEhVIOab2zm+r0P8cD5FfmA3CRr8AbGAx1XK18CA4Mk265h93Idd/55NQ+ka6JtL5MuR1P9gz22Uyzo1cDLaTxvRviTwycIgWSZ3mjSv151SA6fjDjOGWTIQN+1LudyOGTmQ41Lt9bV5k8jlF0H8CAcwIlECL6gwBvsyhtCsv/SVFCVI02A4/HaxEHMiW9+5bzTrDTA59j0m9IOLydW6nrewNaqujk/5MOILAsVfq9hPrqa9EQvCeYNcJ8rB7lEk88wHnFanxihJAjOtwytsCNZpu0MzT6FyopfWPc8dwnlEK3EJF9Gx1EoH1HpqUTng39fYfscrU+IlL1RYGkI3lBfFkKV4Ux6CRZNprma52JtuLXFNPBq7jmPsJmpr0ctpi9ZsArzFsrbPOXdZnhlt14PK4hitRF8dfqdWmtcriHmLhx6ulz2bH5f5t0jzVwAZLaMb0bISlO2pOIpGUzH6HrOA67FyQn1QJZpLOcbTHoi1ZndwtE5p+HqJlvYSZKFnOf91IviypiBroisRe12crv0rqSqaxoV52NC4OKeWr0x2c8ztfwU/Alx2IYAALCesYwuzY0U+NKocXJpw2JcxuArRw59M6XJ1YOGkRImud1VrWgr9nkxlYGpIyo7"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"CTBf27rYqpxT+wz1jBmKhQ==","nonce":"8DOaSTRuMyYhTA+h","ciphertext":"i11gfU4Bu9YgXi5bpk4xHHZavp99rrAdMEgnXvK/gE8VQ8lG2xELzgsI03Nakm02RzcRHwHBNUL1o0FXEu3x6wBqPIv8udKBBoMngacoYcPBm521HAfoski18Gy1qrST7x1MZDUy/UP2I+PKMBu7vZfEYZ7U4k9OoDNmEa3Z8UERYnq69+8pgPyrj6wn9HeX2CRJkXT+vU1R8vKBzYLszXnK38narQ8DdY2fY46NwoZHiu99JwkTJX7VJTe7zoloGsRQeiYmTa3o/RwB0YYqgR7XJXXX+jpwM0mRwvFXQjqEyZiMVx2cw0UtEu5WC4Yx45PHAgPwfPerzFGnaoPJQsr+iGRmlBhKo4BuL2qdFPOzAM/yrNrCPtbVXbRPzRfg+55OFDGIvKtLNtYLqupgpY7K4Li9JtPZeOQ4wnjhp69/UZjsIARENENouMVQv+1Jww3d0N96lMavcl14uCQ5aBzb+FSqEepJFRsVuainjudJDuY5YESlTjOTTy+XRvCgKx5J8d9PSyA/EdWhdwhAIAfUJxUUpMRpob/RtjnAE+xLLp1EoRgTMAzXjnBS47vHPSEpxgnbSUaLRfMZueB85dFaTiQoQCZ7hzmqEobdO7dpq+kKJ0E7AISh+g97lHggUTqxTWIkhzp/fLhApoNmx8KUInqKJBVaipAYaZdSzyoDOXfd0zGzDsPMDhRzvCTkx9MoECHxcJI+StuFdFn52vxPfleTOpz5lZ0v/0RpYeYxU4sDA/VOGhICWsNgyJ2b6SRILywAhYFFxwWiS1D139NLKZgwG70oja34rquRmF4xjDXQC6FRgR8lJNqFCheOg9idj3RGsGuvI/0mrbnZkSHlv2MCTkYIZ6NCQ5sunp3zjVkbtxjY4KhQyxdCpiX3TYjTuBHymTUhIpe1/4GeWBiRAR3X6ytBOGuU9LAGYcvn/qA3ipZBrlVqdsWOdCK3T67GDNoQyPQbju7lpAqOWPtrW1enknmKX0DzmvWIbaWD0paogTVl5SunCLhrkKnc3aMOxdmMGZW7sBDcxHZKSio5yCh+t+YVeMrtGeJfEpJ5RaAEqvuM9Fc7VQrZ0cNQdxbV2VUc5HcJG1srhOnBmdrQoqI6bD9NUD00i6DRoCeMq5tb+7QqDQbPdZ5Bf+15+IBCfV63prLdMhB6TabobpLmkOI/L3/9PtqEgaSQaJZ8rQURMwp3Ir8nDjXBgcY0A7Dy0nygX1JVQNQio3a5jTRT2dxc0LUUMU0oUG0VEYTZQsblCphf0hxhWTEHu1GeXiK7BOMT9VgqINdHJwcJj3ULR3TTXadRNtBZl2HESXqpgkXkW00/5DrOrZYpl5CoD3bU6TLOd7Ng1ruQuEYqGjlF0p5BxOks+LbjVbAKX1U6MlbE8a0Psc1ZwnkhE9OD4Tilt0v5hnIyY+FQF6AOsHNAs25u7d+MqxteJEBdbkIid36lv0PQg+uZQJPLVaqhyh7pi7mRFkFz/QsU+sEymY85Jj7sbVxXDwd8yqERSL42097o5yoEg4MI9eD86PlVlf80ZS12k3SwLsFVonw2vC8cM/bEs51aU2oPIZieoimZ"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

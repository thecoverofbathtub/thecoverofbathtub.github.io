<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"J2IxoL9BGdRHOV0vg1OxhA==","nonce":"Rm3VOc77jhiUVclx","ciphertext":"6cwlXfq4CRL5E3jrM9YwzcO0HYGxcNxpyKwmaWA/QBhaXXhP+wP/HvmpvOl4mVk7fiEJm0cFM6O/ETHK+NlOuHpiOuJ59cb6qJ0yTHw9ci9FYS9DMJvVB9gCCFFy7zXnP/VALiqM87W1u36PoE+upGNiBG6ZgU2u8p9zrIN7wdnH3OdVZ7Fs8dnqpU7nU+xe+5azvhxuO8Bc2M4yKFmHWN3ckX52YAyyOo8LwOd3C+q1iukCjCrLEzpFrWpn5pTCSXJ9Ygdx8/ZuFWjfLyUChbunB8EYOoY4oXrAsw3H401WyRi6Y90BrXFpCZBRkx+OQjMQpbKZGfBRnoMDsoxyvsksq+wGV3QcR1qth4kXg24gmA+lLNljSdaZGVkG12eNVSl5lifw/+SKAzzSvTDc14mtjo1upxxfYE9u5QzXHydMotiRA8ylAvi206edqtRvOCP9rG/e2vBwkSkUqtDrhO/sbzkUsFvaSDDgvY9B1LySJY8t1dLyLwXCO3s0jp/wjtAUB8sL86SrgJV74392Gvi/z9pHYbeZGZDn4NPmXFmy4XaksQ2ShIwnd0c5F0+ZBznGroW2yghctnzBSrbgH7VmrL8DG7KeLUQjOmysWBJJBBeT2RkputzV3DLDDHw9ckhd5eIDTLnInPZIwxqdrTAzBk4zeRtKVPrdFnmFfkNVLVDRW9OGcEdf0/oCoS5llvwAH0NcL2QQdzJRuqSIBVAsvuGM0GVUyIeflvLS/3OCBYjNW0AV/eK5Y4iLtfahaRR6+9ynNJkSzhwPXNpa5Vqvvzu1AJng5yeIjJ0A7VO0Md/Xs2kCErYa7YyN7MPxxaCNLq6GjXZ04a3fNvOp0eMYPWUrrhiu5f/G2mf+ebBP7U9YTh6fnumSow+TklxaxYLcTMoPrwDu0v8vILqwQFccNhJ1omYiDEwb3SRiz4b8beQfXeDyzn+wLml+Vd7OgVAlhVjxDyAriAYzhXXQmyfJPqTOtuWKP71AE/CMcRX4RqigchD0ahC+jWkGucoeOWFIKh3yGCr9ISrmtgB04DW9EQOqEeJ4+t5LedAAQh5keMavJl3GbNot6ZBvUpo4WSwYlLc3W7o0zk45jfwfUX+xkcxABlN/3vGfXPkkDWbTDwb0G1kn/6pWR3PivhQA0wZDhdDlfKRlS0sVmsiZzuW3irigDKE0qVO/ZZWCJdfHF9Jg2hajhliG0+whEpS3AifUB2CjvuP+N0Obo+x7KlvhiIcS69CJuhtUpsGt+s7Bsfx4oEizYvMN/l7KnTs7rfgRjBvDfesFtsatVTPnE49yfdp6YgG40WpMqXpLg4HCZLr/JiPYDSexA0eXEr4umd3L1uNJn0R2R6Qm4RD3o5iygVq04KXOCu83KtXRvcO/0DA5ZMK8XzvNvAWNWLGGIoKapdX8tC8xDUgwTJyW3q0dbzJNHr7HWJJTBMr3dseRAGH89jC8Ue+m7tUhhAxN80ybG0QkPs1dLALdQat4ydqopqStfHc9Bd+CKnJEt9/nLr2yMQt6W6oG2laoO492Tv5yY7shKaPYbwL0CRSd/uQfpXM+n1dSXe6+JgmoU5Fh"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"6eM6JANQqMsZqn4FN0b6kw==","nonce":"7cllzyjQ47fwqpAi","ciphertext":"P1ggMykI7jZJa8VOMJ0WhOk+HvJU8yoJv8VNrbqbDyiOLfyXao2txD7iclDdJhWC34D39pa4DJXk+xszhaQUibehIWWDiKZva8GWUyigHEJIZeGzTYfQRRPxo0QbaUKbqF/cIun/64zSVo+UNoSDLl6VV5phW6xWECE1ivdw8SDJsdGVdP/dVygcjyhMl3CZ0FtelBUUokZuRtJ1J8oE4P9qCe8xxMVgwY6IeksqXNdJ1G+pv3r0wLiYCfk/yMO8/7XRgRbR90Ev5RHrFAF/CKqdDtgxFe/sKw/1rBpafeY4BpGqQE07HpqjBZqsvoAR/C1cuCD/klPlSv+1C8KmolmQZbXBVrq25a03Y2AXn3YBriuEwcuXVXFUS/X2u+Qfim+U8rCj09bry9to3xlL+/P9I4Y/Qxmt0i7FUbNm1u2LDXvXEiEp6kZ8IGzdvUv+zNn4POqHUqf1+7jiQXo8D0/wSNjSkFFvcJI2hqKe95n4+BB5DhscqYbvGVOQ3WUbuycbwhbZRBaE0SWw5UJVWF9xShFv2lWzP6IhOhFGLfadNKUGeFvIZPQQTBXa55HP5JmL3aIW8nfvNGpLorrJigsCyzfY/VjgSiSO1LrpEFDf2eN7PT6BReuZ173r61rYpmu8oalzzafY3nIib61fmUiOewWtIudheGu/wK0/e8h4wtKfdFCdVm68D7a2IVnTshJ15rg0ZQOSkRqRGpclDntN4RTMzF/IjBOda+841tyb5kd9i7juI7aDOMpl86mwyT0GHNiHz1abIKWAWDoxVsFF/F+KszkrmBbC2ovcu9z9NE5r23l46K1/eYrsHM/08hPrwSf5Ylnz1oIxaXtsTeTLJS4wBjOcS8XJm3fbYcG2u7sK8X7D9tl1TEbOGj7WIG2gwrrbj7qMOnhyc4GosqJgrOPZA8jTlRW+bx7EulEKNW16hr8+KDwOOgJdeqMbOfCl3oc5w6IHxHDybuy62kUDQJocstpZjDd7FNpLY17zItd4r1lB19a+Vv7ndPW00Os1/g9XbkWHjmKZL/uRPKWqmVfetTk/jCwsV5CainbzhKBWZZzGmDs24HORepMz3IFMaXc6bnjtxPn7b/SJ5fARGlUsOGiJ1EJp5afkmOSsOYiQpceJWz9Z4N33W0Zk+40/TJXtIsY+ZvlOprAF5DQOib9K13qwyt6kLWIieJYMWnEOYFGlre6nIPguf3r8IY4e0oFp3IVICCqeV5b01J/5YH2Uk9j0ZIwWdc7kewMkdGP5xk/ETUB40jhpGblycYgJxNiP+LYn0T0T5W9+KcqDPhtBjFfj/ppnLqMQDeQZX9N4lHGKobLF/UdxndGMTWX6eM9517oiJsS/NjFNWzMl0LYAc2rLAA0ABRCfF1ZIiddHGWO+wjJmokunbZDPRdnrWLfIaT+RZXwSlC6krIiiM0GzG9ZfMQhLKx319ox7AxhtfIfHYEExgx+IlL2hdEtSyhIGEs8kDeqMSySqwcHPnTR3TdLJVoASkFUDGLhQMW3uB4Bobiydkzg9FP0E2U2/10s6CpNPEDAylZL9jVVlOfwOLKZaSnWuNrDQlZXU"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

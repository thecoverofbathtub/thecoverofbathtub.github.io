<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"dwZlzRbv2r8l3/FbLB3MiQ==","nonce":"WBJG6Ks2IT+ysb5q","ciphertext":"Ktx4KOyzWaPgqjISaWvF9MKxJ6DGz0F9FRDtUxMkZpwt3wEoXNbpz3YXr6QPMtwhMZtqukaAhDuNRG5FXRAJWEcrnQJlR/CJ6wp1jOTH0GG1wUQcBGW6xsbh5zASuTmdSbEoPsj2wbVrN1riKa+MA8w5nScfioccVtu8jBwPVZ5DcEkMBNZFWk41WN3m2wB5IgWxwA0dJxvSWw4jFX+Q107Xila7o8yxMfQgMXP/6g+DvpNXPNeS2CVhgEErKsUE3Cr+1jAQPblQBr/DfseKV4tFt/9YMIbO475X309sTUBcFLNeidkrO8YqBbJctLJ9rRazbDjwTs3DZibU0A3UmYnGyiJsr9mIxhJqGpFYPCMmx9sabyFgEs/yUdqqJ99TR+S64pKNad/01UWriHa8/eERBui83+EmNDMEdV5X3d+il1cQUnLmFOySL8wYrnWBwj5afQTM3fyPEpBQyNfS4ewuVKhRaec3Wz0D3IqRvCBOqiREa4gyQKpqwxBcEGyLnV6bMMEKrJ3HcypY3AXNbZBZddIZQ5LVCgFAn78A0lICARNEsigRf9gQc5iXvnj3/f52SXHwPW69UnPNKSiBmSYkdLb3GZhAFvpi3Hm7Gpr8mJjnLWGk7ygSYQ9mXYjyCIfhRUjgp0bOLmyk1i5IBa1L0QvSHCjcyLiabUINBtYmELGhXOm+rjXw4stK4yyli6N/e2E5DVYWby11WFkC+m0Rr2dIDYpKvcs0Oj419xY4vHxPLDjVt9ogTk0IjyPSHSOosHuDbHdCfv5u3byxWi8x3icoikf+/P0va4FGPzaFPbovMguPBpZaC2YTMsN5mJFrK91iZY+JVb445yTfe5L+VvsAkhRciiHXqsWXLs0EHEG0+UEZvHDJNHB0S5/WDohnO5eJ2uw15ooxYKEmEuiKBHrwsvibpPYtRaV+4icvMOZFtB/AAkkG2+IgDFXvTTvdV2++NR+k98IDuzD22ljfa+gw69WEzzfY6F1n81WhlqUw01tCw8lp338SYP9gIGtrc0D5qwcgLk0ASdSBlYdpssqENTHyWDd63djmSYgqx47KqnevKfH1CmeL5lANCVPmEXWbT+1XQSp+YBkSWgrQfy8tGRAhm9QnGjNETp4JQUIG1aiJBYm8j7CsgN5+gU1rQX7bzWbte4MkINhHXvoaTozaFOtLDrF6+L0LrfSQvfrk3oGT4RRKMwqiSu9/uSbNjO44RKiIyCQy/hE9J9K8AUlCZH8aCXtIRcHZb8TJeVcsvtZJgEacjtVEzWQNdqxKeJaXBNIXPn8TEsTv8DKsB4Gmef075KuuKPam6+XPKwacNAYBtdWB56jy9+0TYKWwiWQgGPFARv1K6Q0FRYX4Lz+rK5w84aWm2xHOyWpyLGClwr/C0KJ0EPQeIUXOeT878qK1B4P5V3EWnKsFXLvs1EkCkRLIQhOfaQV32wQbTybx4wN7Gc7s2ylAOouwwaaSKRuzR0Tqvgs5pvCGfOkfta9dBew8o7n9F8eAkzZKLBMVDWR1GULwPJUkiD0CY3TEIUCCpsKAdvxadiSwJOROSBP1oWQVFu4Iuie+yZ1Q"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"IClRAXYW/BWiS1Ejnb27mQ==","nonce":"iUbQloSaBqRlWuKH","ciphertext":"lFOtGwjpaWy+rA9CgPYdgrGIXfETZ8hscgy4D+wwkhpIL8+Fl+F3fHdK3/bEFdUZM6+T5E+O62nLZvsKKZVR5vwYjh5s6zhkXXtYFOmF2lPl0zogka/EEh+ZGb1qcPoOH3VCVXRRlKL+Qg73Zxy7MgUP9BIQOBTZuzbBSFepgpPKgNTQf6xro2n0lDVZHRPF9TI9lUPIREmWWqGUA2G8Z8YnVVB17eOLH5nEO03ygJfvDh78cbwS5RnmAkxNATt7joOGNwyHVYOG8fQmpJvTLRbwuyqdrJyZAn5BVb4Bx5pzb3uoLiuEF1eiuOkGl7g8Hf2MVIcPH97PeUXnCW+idigBhoLTSwwzmGuHWBCC3AMKbjDy4hmOEewH044INDEkwD5tRKhOrqX4r+zDzMiV4ShAoGTBy/6CZGp8Han8RHxmTc/QLfVRi9PNzgFGrv+usTHCOZE8+U15X4VfWvSijqrpQEjmhtTi9giNw6q4NVB7yID6TFSwBQS6uIxZusyWDJECFLIQLhRY6uwh8ElGFUzDhX/ddq5SN+eK6tycg7Fk/RBiPStJAyhOOwLg/uHJ8w7RDA1LHiuP93QWVregGkMipXpJQJNsodypIzsDjlYXJSyvvLjyH720RbcIHqUPcxzWzEGmXyJIqyhkzyHqtrWAdUrLc/94nS8GxjQY7ErfW4SY+oByQNimRkbySbQsxI/sFOEY3dfJxp4R/VIl5sayvmWZMIq+2kg/0Y9xCfBl1Kx1srEcHThNHpv98M1vfVstVnnFLdUQi/uPNchk1OZaSN2TMQi2G8OnkIFgqPVBXzV8AaURZgnWrn0y6+OqcQzr0+x28vEujgFjMcei5qOREr6tyfAI+O5VvaBibiQVJwCbX4KTcBiTp+he2vo+vHAwRtZy3DPHfMrI/1hMwNU2VohzIeWzqmSwkxY7ONUh8T4CsdboFm4H5UGCHmkyqJ3zyzDkhs2radVLQEadbOBwzsdoiIvOdxeOXE3Aef/ZGfEo9EmaQcnemwt9NVLzSeW2/RzAz1eLUAsI77pOTHNz1ItGVt1RnmjMOAxgisHaFL8KeKxyDbv5SlKvCJHhG9LYHXikEPELq6zhAQt81Ks3MyXU9RZAIfJnMC06bw4seCnLHehNxrSq975lCNdjQsimqaRjqawQ8/Zcl7MeHQ+vkrh1YHH/arZwSNS0VSUzwm14RSf0o6nqZTiXoU0izLI9KRUPsSF9OhIcOD4E8WBbQszFGbyr/fSj2okGdfky9JpUTpFESWMCWVw1x89opUjTJM2Oj3arY2QlFudWkucD6u22KXVvPtuqpccrYuBFEbL1LpCvfMRyW1U5zm6myYoajaYjMV20yDr5U52tZv4oqbBXAXwk+cQDFF/cNU6mhOFcnsRTWQg9lJBGJLuESocV8d8UXUhYJXV3U2KXgNSIeelp8bZDQxrTQ/cv6+KkKAsslQUzpPA8jJ0n/z/iw52q+HJVP60M3+auOanJqeQfCbnkuTjBX6TuxxsY9RnXvZCWNrUCkIwNBDZGQVmrSolMnY3Prb9BiX6b4g/xx6o6/ZSllQIQm82f7WAfthQj"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"L1ImG3aUBWlxSFPpb7xgmw==","nonce":"2nPLFiE5Ze2/rv5G","ciphertext":"tOgZB9IXGKcHSMaKJb4208ya17HYwREHIUnF3n0wgpyZtU1F082NoNOTAtqJ8PVUb4KEhi5CteVNJsZp+fARQFZLnDmyvWsryFuag2RjrCt/KQAOf6dHPVjjxR2nP4U6dLRoeKaLq79yhEibMfDkZfREs5k/bM9mykjIKJ50WOmsXkI0RF8Uy98uop3mCTRkkY1IOMjaBGM/ulybQKdSMNqZ1VhLxUeou6zv5i+hEYflwA4idB/C7ejofityJeLzzI3V/v04mexy4ga1eef8bcQsmVsn8fIybn3TbEMJrsd4kZ5W4rmuVcuiCz2UpowRctkAdHOZsjG2u803nUNPjihTArYkhqSZYn2CYgiBxv3FoEw3/pcZYRUEV9fYV5X2eN+mUN3oHGbTIQ/c5Do9jdoGpJdkDTJIUF5DGLKfQ618pzcZ/XiCbXUfWG2vExU02Ck5s/IBeCZcPDrv3EVzUhrgATkqHXXvJ95EYdA/j1DDIWi+58dsD2sta25oAj67A4cFpl2pIXp9b47V+sVSi8Z3V4Q5Ehe4FX4EX/VNuHXPqZPZqYJeohRXHLy+UUuTU6NvvFRmuLz2TUmtpcxlkis0EmeAal056haLBtEg26zRWm5792CzmzSP2AqQ3u4BpX7FHSizFpKJ8c14SQP+jQwrPvS6hEl3irkiZA+83XuIRHRXHUBY3XGXCwgvEpGrTu/BzPzy+SB5FttkEoeHHnqxrUARGWSzgXUk51CwDMgVOkSQ5re8GJqzfdo1msyXXVv6UYsqdAGyKSe39dGFHpEnhs44q0nYG1zZV0vKXvLXnaYDQ2fxCwxjdzz7OermzOEXWBTCl/hG7xM9kAgTlB54n5Rys5tDR/mwx0xmux4WbrntIiJYDjqR9LuOLXVxsaA4JZcy4g2bALoRfF06kA3k4dyVaATCuixiDKWG72ogIR6JwWyYRj3CpREd6zeDP35IKHxIzaNOQR16r9htBMkw+txX63HgfZxhVODVmzsWxzezoXZaT/Jq9LuWlEBiAckmJE0enYALWk6mITaa7nfPXYzFkYS9RxZ6nfeOv+J3c3e0g5klERE+y7V9ik8BDf3Hf5TdOt1Ld6MaThMnZBJcAhscglTPVyUbWZV/5oy1z0mZUwTuUoLi9MNM9uD3wcXZXe8SDYZTCIYH6NjRympEBOj0hJoIZZ7GRcOPIok5AAwI2lfXVL+CCRJkt0brhY21N4evp1XZCOME5CUKa88yQF0Acz+iGqxN0Xez03zQ7+R3Nt7V8kUwODFgmWxBpk9X/xz/cwfsUlaiw6YPDodgP2HrP7MRSqooHc9vlKhpsA9JWadUNee4h+VqmH2BRdRIZ+yvwJZ2ac8qoISYoH+2U3GjLBumLXgqa36zdZ4PQl3vVNdrZpCP+AeAH816Zm7dC0MPjMV82P1pt1NOBPqGzHvzN7zUI7ziz9pdz0wRQc7R++FZ9uLKZZ5J/KJ3g826ZuDmAz01ij037RMV7f0olZTx+C8LoNBhBOtpjGMYbajs89nmUDiBd5yNXgB72JHeUaY7/Rp65+8My1MmoJuqvoy16P+h2QZZBQpltwEN"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

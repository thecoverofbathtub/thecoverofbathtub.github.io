<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"pNVq3QmwAFS4JqLVxGiYFw==","nonce":"OTFUUdJWRoE5i4wF","ciphertext":"Q6tQGSWZfUXoG+a4HcWE7X02jR3jQaRJqQfzNULfO+17bUbRTqyKXtfhh1bdrKaSlRFLc+Ly30djs5R0l60hOtEpSqstVR4dCLh/ZjSTqxbd8ngvHe4cG5GVRpZr4ot7cZ0/noD2d6J5lCh8JxSyhL82mzLIzi2uEyGQWHaRr4fKH5uE6XVFpcqjMGRGy+baT8myxNDXi0ntNa9R8XXS28KOPID5cacaY+7jXx1mFURlkCA2/l/Qhqx+WunF8MeMvatBNP25CK42UMCSuSATFOiIwTKCAOay6+VfLk3VbT8abgu8B9Fwfv/17a0paBck+ObTo7kAxrMdFeM8Fqus/1BMZBdP3s3upydHJ8q95FRBtAbtp8lD1bIgHy/HoH0E/O7C0L313OVUpV7TxH9QTTEF7yUxAbwyX7/bEvB5m636izYeJ0+M7zkHB/0CYfK2FI6XonSJ5iRGKMDCk588gety9juQjg3/o0sBrdbFmMzmZfPeuknUs+tVlxV0YRbKuvmZ5JRuRiluoR48cCpQqM/p62hBp9ybcMfgAPpN2dlecxv7slk8RahQY5dpxwkibmX0gke9hqTgKz0YPdeVEYXAWcBF7RfhkvJEZy5d3kP9tyJIoj2mD9FNKJXBQtnCTzmaIqXJe5v0mtFgOcgMF/dmYhFD7hD9zXxeVnQkfFB9Prn50LR+0f+O1+XddCZ+jwOBbulUrlC/Vj3YubOSPA9sOlDDzPgqqUL+4K1uzcXBcous6qVIBCJ79KslgbotTjW1rE5m8pdF17fyM0HdAfo1dgQorZejW6qv3AYATx2J6RS6V8pDQtZNxM7yBkqp3Z4ai5yrTWJXzV/XkqrLLcYcAuAm6OWtdH7dBhCsZMAo1S0VUVn0vPOWm5SC0jUTU82GPL2cZGVc6qW1VFB7sGOV935vXaPudsEzKpV/pPkxQ52RYk5sMR5BkDnEcWcqD0vkVIFebg7jINS7Ikyia5faLdGOrs7I90UwzSCvJ/uRqrHJ4iHk6YqtWbAmRvfwRwDPiQ2GKrRtO4Gz8HeigrsxdmIFLvbVhVLUZx2J7knfiM0fOIAjQJHDJt08bPYfdtTz+qH4QIkUfQKOZbo6MIZghkGiBt5THtf+of+JcOuJletP3yZnpxvLt1ljsgPkI2pnD53KValeBewKjtMxeN/NXRf/blUhGpszJCRku12nfkmmZeRDdNikfQsDoBXgTNkDWzrijzLDfiMHZGesDdAMZHPqmTZc0X+MtR+OwG4xyMfwc+aTpIhyc3JUnS4KzDFyHTeVkR0iuKwPPZjzPLPHNq/6D/YnKfhOf1KHawCyoYKmLjfvcABCmrkj4rXAYFVvQbXQXlFbUHuMisOgUW5dYn5tfFyRMvgM3b9cc0bOKC1dohytkm8T5M7hQNk53pUZ+d9/lAEBg3Te+8RAQrAHMhaAtDyfBVAZpcorfNSLoKXSIg5ua0kdzvWG+/Mn99OxJrUmzwy7vuhC9YAxns1Brqle/OSMugyRBS9hqdZmHLw7ZMhAzAfFhhopvqE/DzSmvB+IG42obMUHoH+xS0kxiOR8EqN+ZPq40Hy3KJ4o"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

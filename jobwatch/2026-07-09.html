<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"Zli3/MQOVFgjImoDEhy6+A==","nonce":"glBf54SOUFDFKEit","ciphertext":"zRkYVfMgRojv7rloYT9wftiqffP8dcMqPuB5EgW5TukuROUjXG37icGVGrny/p0vWqoCwOaHsOSMn8qUqxqJfHG2EgKV+AyAIJO40HGce2ZCA0H+3+t3vmY0ey+Rh+xn0s7NcDGekiqcG+52lC7UeZZB+PGIaSwHRW/GSTo6b0h+jCmuBblctIdpo5sTUXvcpmNa4Ut2+jLtYw+UB05o6yGxWj6NC/yVWHdMaEyhuYyqAzF1gJ1/pAWknDHmwxB2xA7kWxXhwPTLKwsPOcJ3sduhhHWUlb+DAOmic6sG544MC1Z/a/C//iMDvRyzfNL5ZHQjye8YrDGjiQPWYmNOM3RfJoDNPWJ/6xB9ryzDudOhp78Ya8V0HP9+LRIxcZbELRMfKle97SASICHuX2r4HqC1fHXFkvBbLJk7vTqInkKYdmhKZ8ExHj3SAmbK2CiRBU0jS8uaNqGg1en4TIIlHZUuBKXdHZaWWxLgpd4qe+TRyK1YdDVMPH+iGSCiCCVJ+V+9KPTvxie1UsI26RMOlk+rzaUWba2lqd7XmxaLkwZzf+X/e5tQdRyP3XKm20BTACB22MNEk5ytH7Bsb8exeiv5XCKeBMJDhZyy/5pBUcctSNWWv5ynUiPrPBRc+wnh1H3PiLwWxg8XpZxR5tY5DNIV5L/5NPbLIOOqa9cT+ajnhnucULsH8BfLUzwkI+8u8l07VqfKJ8QaQ5UHGTnDZWEsLhiGuMZh5Twdl+Oa6g67T2dl8ZVMYgbg68I0UDe8wzksLKxP8KRTRBcwUWK34rnNtKvznor0ztfg5fGoInXmYb1n7zi4RWb6uU9bMEbcO5P5Ykv1NA4AayPOWOLX6jOAy0lO459eZqsmw3DM3ckli9imG4PQLKzFMNcq35GaP6Ueha7vHaViWY5/F6byBt+xGIsJ/6buQJ8J3RCU6beeJlPmdkP75ZQQCHEGEoAaGgdeLA3Ccmvc4FhjIsJEMC7BJoLp2yqsye95NO3y1uyzK5EMkEp2Mvj0CKb0FS5m47/3kAOcnSKpv9+6uWqWTuLAOMadyKRE1jxP/vk8zAAKYQ9VxfWAgKRLG6eQg/+9SVBZeJxJ7d+AnKjNKkU9WyUMLAkwoEXv174uQa2Yxs5Ppb/HYxtgz476frF4fovOX+2XVGHlEVh4D3MdxzKX30TKtHK5Lzt/WncFZZ+cWNKuKAHu8hfGTSZRCkQRgPy5lDS4BBuL9ElEWsk72XtvfhFpDlMMuldA8T8DAEHxluaIDGi86yHxm4oPfrv68r0m9Hjc0pnBwAhsY6Lh3quSxJiwHCexYxRHx6eoHPmzBDJSUrVke/oqPXcUKX3ZdHbUd7d44JDM5uGO6VVr9Ue9DpEhauQ+CjRaL/jN+0Lho+SWnCeZwvrOIYiPiVq/ttU2tY+uptvZDrBDP0+iVBYUzXeGpx2xn0JHFpiIn/x6YAbfWmcFVlDlnUvlfCEk6o2z5YCEUNARwgWUl0psbfjVhPIFT7iMAT2uj7/L1Y1PQh5Y/vLXzODZoKRcYIPcAqEg9bUTFD+TI4sZ8FH9f5qzjEpyyiMijQALb64dB33rvtoQ"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

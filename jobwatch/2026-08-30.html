<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"wzPvMxH1+c11V8fFzluU/w==","nonce":"ksIGTz4nm/qbxAT6","ciphertext":"XYDnwMegY0RH7q0ERcuiXYpHgNWkJ57uJOLKnmMmS5pia5r863P+Nr4EMjfYa91Bh/QuTxq+jx+TEc2SHeoGth62dQW862Bfki+Y/H2NE22EASFGROOUFkSeSS6bRgFwRx5zwtGLxEkIFfbs2ZSDGxxIjY+YBEeHKxi4o0xDPQPqRVsB9dZGjx9bsZT2ghfcmV0aT+EyS8lYBfpHdmpCiddaPIJ4tBayzFMp27DAhUGNEOTMqUxugK6GoER/qUB6oo1JtNQPhE8ylk/cby+ecTnWsnlVcMDzAfMK0bxV6fGsakSPsT+Z7Sj2SB7Fj9YfjhwlWlq4CU+aVSOKIANvHgNIPpG4N5p4EgL0xQx7wJKyIhiF+mYgKUwc5qXaF/ZweRsPDsH8WsYQ8XFL+bMBVGtKeReuOeXrrKkIvUKOwdFPVpVKPbanigr7TFfoKXq5/4v1mHdulMcBqgzQRO7LpBvxi7NgmKKEauy9H2f7Ou+jyMKOYOudkkTioNL3VgNMBWXQMSvTVRMQ7nNP68SDL0hTk8er0anAU/oYRHWRqNU2j/jZYKwkS4ECUxc/YW5e/ODSpYLyw2t4xDm/92quoJ+fK5rolkibqtbUYHZiznwKa+LMOIV/nAclRM8BkAD/1I5+uoEB0P9gCQZOxhODTZ5ehyq9Jql4SQOVGGGn0gbCwnPL8InWJGCAMuZhqNUCId6UJ276L1YNMqWgBa9rtPBvGg02I4FWFh3GUwHmO9/RdAqpbCSq2MMJwlpO5oPziU+u7xA6lYltMok266+MmjCmcmZnM27eSJLoO3abbrvSemHs1e46IACo3r2bhsdQ/JY0OEVJIBuMCgJrIHBsPs07WT5AV+bzSK2dK3mZCoZDLZArvBA7JvcD40ZyBdeILoSzjpx6K4kqUOaIAqqQCtFwyFdU/PdRhozlYIZfVj/JSwLEbaIWUyeCEKeNZv1Wr7mpM4KBGGEyfzbVVw0APlNcmX1vJflN899g5bGRD88CxTgYv4xY6VQQtLzAT5xVc7qwY0Wn9TKgD089FCR09y0B2XyBKrzFQCrp6wOMd89G9LCCR1QiVpvDt+QWAFLSYnzqm713W/Bo37dvuVIu4NADb0YJ0sowuNUproL/kSgXUgadWLqNlNkoqVL3F72tNHd1Bro1ObNeSMeqwHY6RMROinS5Tgr6J50jN09sJUSurFzeELA8Gzs/rw6FuCRonAaMxYEzR+ZYn/RlxNOcFu8dUXOIW3xp3YHU++CtLV6zhbLAoFFoZv3HuywQhXP7qvclUhnVlgJ3TfsSIl7hd6edfThKuJV6R3jtOnVBtklhNboqFepl5Fb1FA9WN+LaOjTEAome/UcQESEBHw5vvPnyc5ZqBH7+5VbJ56bCEXHT8BmAaEeukbuar6cJPiUoumryT59Pb+WN9rJkV45ns/j8fJVfi+S6pKmg1Zt1N2cGRhz+VRAYeINdrbYCJHPnFYSPkw5KOM3tOp9G6tUn3EdwFvDBsMF16w90bj4i47emVKSE+jqAhc2i6eWQDlb8bw3+NpOGzW6NJ7kQrz9O3kNeKMBGWHQ6DU+CLi/Plwas"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

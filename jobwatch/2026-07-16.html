<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"3CifhwR5WIYK2jammDtg3A==","nonce":"8/d3Tt5iBfRbW0aO","ciphertext":"CDH0WCFlDLn2RnmpQmiJuI3t6YCqv4Oo1UOE5Kl5gpSENuzsT9r1kW9l/YcduKCefz/vmKH7rKRYwqrusc6hA/N0MGBOR0Gq21pR5ogC6UFwYKPw/1CQYJiqyORYyB/FfhfiukPYWRSk58S6r2M3gAtByFlnyH4CqkLpqEEzf5xNLEa/jbL6CBwwTyuH1ACqfrjo+P4CZTDmaOJFoVSPS42KqEAP/tqrloceU7YzkODgWbzhqs04BhvUFhwfg/n/ZPCz/XLbioHamr+dH4NBb0c8irPxKgmIdVytR53U8bMT/oaxbs3UV4RkDJ3IjeF2BpvjAAeDomsiCrrZaS1/znmr3KLYvvndNnfOSJwsH8HAihqk+pZOUtr7moPGaBgCMr2s7tH06T96xuL0Yg5FeMGyr/z8mqL+Of63ckiTmsEnLX0+MYAdpHI27tZAFxJgDsnxKaP0vGYyHNoyYR1JJxDEqd0PUPIPHndOWBVhPobRR9PruMTmQ8+DKNNjUEqNRpPMmtdEbG8nVd75JNBLBGFc2++1aDJqPS/MBuxCvBYBlunKXkc+BEW6OMgcrvpCFxmImXcZaT6Bai58V4tmMOulOAu/AkjeW470DsEaGREaiV4bIMp9Xu0M03aeC5RAV9l5CUqgL0m+UDvgBra1gE/rYLUo1GkKdnZRxNApf9mGGW2a72GBuD/2uk3QOuUyqbP/dKZS3L4/uLNDN+nnWxpdVCjcYfBtL6hxjjwHTeQgPlsqLPcfRlCDnHfyAEx4ypV7KAiI0Yghjc1/fbzZA1Q60+kuAs06Fmw/sLsAcDdEPsgDeNEmL2dIaeXcVIyNieSnlI68nJ/yPBX0FQVM6kDikSFhR9C6WHiEtHll/RuKGO1QL8petdiHXg2uI6c8CbeYZe37/AL6r6X8EC3QWMZ7Q1J6xkmrQQ9SbeI3PfrpNDxtU1rc6dJPi/kWtrekFcDd15FdSYX74HPM9SxxmtnkzAlXa5pslqVONJSw5GkppJ4A29YchUNGQwVDUTCz1TN/yI8Pki11pVn8nn1m1idc+/+sctEpODXxMwaVysZbE+Gq952U30jj4KUOTTWEQnbIx5GLZim29j138a6c3TNVf6/D7AFyQj7rgeVVdHmVoS9EqnIgJ9S3mMqoSeBAXvrLuPeyDr3fc0Iio3chvvXxom2S1tI7/GV3zz29PmegO38ySFse37wAoQT0W9/+rYj2dWBO9EAmVaHPVi7tUE/fN5DoGLWx4L12IWczO7Ab4A1bTIDFnNDeUuuGonk5GI+i72Wjlx/tHd8yZxBlUSKHoObJZUKexZ0TW9ijGio8nTW/GWlkh53rZCDONaC+yyJ6IN9ClrBolU1R8TV9W5XTuJqBAlvSLulhn76Mp+BJr84xX6JxxW56F526ZQ8e2En0fGCfV+QIF8Kl/0FEUITXVVWUpLPrqOPQKxUGyJewS1VMznkB+OeWrITQ1w2ca/ETX7qha39to0HviFvU7MpgzzL9d0A89X8xlfJNmin/wgVzSBJ3DvfvV6/veXInOchj+fANi26fzv/gmq+LfNVoBWMCqjPWMzrzmq3M4kxa"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"XXVUY1S2YdhdGdmp1iHGKg==","nonce":"jHJiwTuS3qdV5GMx","ciphertext":"D7ezNuV15V3gtmElA0GW1QxxegG4c0kmq2n6aLDDRQBOWm2AGDKeokQs7y43g3h+3gySKoS8d5Gng46f8uGPLizudGEhqLnwRQSLb7P8vARieHEJODGniHVP1lSg/gXQUTNDl9aGzy+aKodlzlmmOQDG+ymw1UvnigvyGYhhwuKRNO3vPdzcuK1qUPGetY8ypAt4qlRbvHUFupfH3pe2tz7VT5avTsfGGlpoqI1d1pq+9X6ZTX0dWeQnpiZ78OcYME78K2ku2Sft1VA+ZwVry2ZhsCqamj2zuBcGY9o4D5JBYyZFewt/6vnXAljItc+rVWcRZFbEkpJfuqiE2q5D8isE0jVe5QLv5C96mQ9HHIt6mmyH8PX5X5oMzFSvR/vX39GKjTT6hQDESBS7UKBEMPHCwAPqqo4LEYeNxJ5zej2vfrDl6EzU1sK52ImiS8AD3fH2W3LvgISWu9dV6YaO/Hlgaq09rDEjv7A2Rqn1wMw44YiIOiixPEK6SY29UWIF4VtD1aFs5iSJc/5BoWBOinw0BQ3QAuOrVZ5TnoxE8RzSwpW+OzfOdBOCKFS+Ac+bPBl9CSKUHmWzx6D39SkoaGWjj4fAfVUcXLMIAfY2Z9Po2TSUs//S57q+Pc5FojhZMi1+ySP4rtDQd2gbJGC9qPauPtnigKehiqxU0f+8Zj7y0vdi/N1YtNoXyfILuA7nc31b3/gfIVdOiZTto3VUUPH1NRcAN2IjAZ3Dyd/NlsEZQuuqHFTfDSXczeyEkjzg7xgAVaxwM6/9Zkdwg3GxJh1LPEk1di/xOhApLhJ5VzZs7/3g3GGZCmxevbhxpgpzenX0BbhI57t8XO2Q40KouOi1mf6rWB+llJMroWjqFdMsO18PSx6o+5XyIMsvaZckYQMpnGjNDAisX1h4urmAUPN4sv598BsqsmbzySvPZczSjdBr8IzW5CAtFLwNqJt8fvJDjkHGv6jUgChLvfmoyriChS5Ja/ZeTyhgLQqXOMFvqI7kHhCEwUsh63N5VlIiFa9fUgns5cqFSNTdM/5/sxcp+62jChg7rkHCkgssXA3KEt7Ql+FJ4gjBdNaeblYqRzY6TX/nSYq/00sXv7uLMc8WMaJ6ocSds+8Micvd++w2vLKUGwsSkr4aon3IriCi9ayFTP6tf+e1L7xVw2PsloIVB4e4Jx15TsolFyiyp5Ck617tk3xaPvxDd3v7kxzyCb1bPo1M++TchMmYmQMwese8ZIzIoWmrRwm1atyXsoq9AoI9hnnbAebXqGNw/qn47qdT4sEeDf55g9fPRBpAy7JXFI48cbPS93ZflqHDvF1rTlkSxeGycv1zrbg2qwzkSQQEvSBFg76V/6IVrzcvuff19WILkz0+3+Ht59OeDktVQnyqfmIRAzvuGGGcBiAkW7aPkDxkJqZfCi0koqKimCE8sGuEAfKyAhQrED6Sfj53QIQ1lSP3M2cm9wsK5669+fxHpWCOM2HmeTAZ31zSLbESxmj6dIUvfKKe/ZTdGSgO8Pa2Fek16yuCejHAUmoTyuCvScpvRu4tULuNSe4xpNjhCuxAIYHazOsP3Kd7FFIP"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

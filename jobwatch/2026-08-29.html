<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"IRkTQKK5vmR7Me+GcGmTVw==","nonce":"JUutKENV+KEDSAQC","ciphertext":"qy3lVfFPsk6SNukTSuD1GKPovILlacinTOpxCjumlyqMiDILjCFZta2uAdR/OG5nVaJDxCnYKwr8Dlcag0wcFOgl9ARwygnJHJx8XO+mT1aoPTHAWhpONUmJgYJ6fo155u5K9dh021slCGJsK9KXScVTa6d2bTAJ2qyosW2KXlLVilKeIYvgpkUqMm1jEWKSCqbMUEg7+CV1AWW1akEja3CknFFaoRU2u8M185edvzA+jKnnmtzVOjS1E1mJwbDQZKZFR6pH+njpqhO/2bnKdLNH5JmO2M+1Qo2ZhMduoORodjrt3wMCHA3/zNfRLtlYbj+W50IA2fslUzHb09sNiLkblv0W0r67WtWzZ7jdajya5hhoqN/llpRjWJVPr2S3QcS03w+p2j0oLO4dZZvIHeIxoovIt2vopIYRbiw7smTL3nUDaRT9SFahRHIiDuVkM3LeVJHg2yuYbDz3sJI0QEQ0qEbe0XmtF8GQtHK11QtOW51o9FKK4el/3OAdNbnvXHJB/sf0Hi3TZhrnj57jLTMMmIXDEDEopqY4WIsWb3uy7d4ISelmggvhFL0+aI2IzfJ6C1dKr5yPkvVjCJe/2ywMB7AoFb58VBEuCCF2vNVuLP3CWhDrnEYbudOwjF4SBzHr7RX3W5FkpaPVQ68dJkeEAdQtjzEuuKybwqE+wcdcw3k6AJSNwd+lMNOKbVevCt2Fbp9m1VWWxZgXcNatdciP8b2x4qLbL5DeD/Va3+FII5n+vfXdd+5qUU2vdS7H6XnK7xcSfyZYD9gz9tGhV8coeCB1YsYy/SClWCdLlfX+l1x/gJinS14rZC5kPgFtAsVpQ24552XXu+x/2J2onHn7LNIcIn6dl/F6fuM1G/j67MGEi5IXt1oE2e5wsAcun4nmOVkPhZpFzNpTb3EW/Q1nzGtnOtrfwqfnpoo4PLGxQI/myp/Pi44BPtV9Kn23SVb2Sx6PRXinFfVc1UyFFZOUjNWRtcREbOfZY/e47Yr0itYfPGGvKTc18XPR1qt0uGdk9Fki6XXqLmbZIW7/Ya/eOVXEqU7c/RKf1B4/YHxrSYdKx2NctyiDvFQt7dAS6Amr3849M9QaEI6mFOQOUZVYZZb5sX60IOVgvuRdMa2t558tICiCwqBlEZrBioK++d4Qm+POASswBWt80BsNQVDotYm31dsLo92IOoHqqx3VbUMAL+MrSv9Ow1yqZ/HKoDgAyjHwly3IfgWZcqNAseDd+sSIcDc7zmWmkFszzGg0bI5uqILhB+OiMjTCbEmhO4j83vj4MVVEF0pJffAGUiOLAg5Uv9bG1tWHjg0OHaGlQJyfGlG0HShnO9OiIwTDClNRmlyPk8AkGoOV7RioLAiK5CPW0+pseZ+XqjTJ51mK7wss+sB01SavYU/2qFR5XPihaVtPElNNBJRcaDSy3Ub1MoVC7YjVFfwYEyJpWsoBiuMJ28C+Sy3X4h9lz3nHw1Tc+TymK1QVbI6ng2xsqRo7VkNNs3Ppgqct9lBUtzKwl82X171azkXCQ8z/u1poYfNsEWZRAiTlLRw6aDCbMIq3Yk5HXR8u+MvFPcsmO2e2"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

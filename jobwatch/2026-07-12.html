<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"EQlHze2n+yWaFsBxi/+btg==","nonce":"qjb5wcm1xm09ujwS","ciphertext":"nlQzPZLBGEohnqo1PhiQK8oeFJSvELxU6Zb9JPldzYbhoR071TjNanymn+/0IPZdsDCU73KVKSqF5rEeM8Bl3GyAP3clfwjRkCuu+RC87Iosm+wgBEFGbfi2FN+E3ZCjqbj3mrFfqYCdmmR7SyCjPItfoEErj6SwKnCrue24hmUA6GuwnFMCF/uYOGk+v9BxJWxHkhX2Tvu4L1Vt2F9P0f11WGDcpWYRAFneoXI3bpOMtrxOJEiCvaNqYWFMl/Ni+mjWwVdZ0yA6A0DJy/JVbomLqVGhrsrbkdkh5+Ef/dIcsm1cpuB+skKHN1032yyDOiQPPZntZeSceLjcc8geYNlcFisEOgB7hxTTs58PjTLfUXE/puef5ijHigWN2DQXy4HOmqPtTsT5U7hN5VgCUZkMUkPehmGesXpv3TJhwgWx1SmEiuXUdblcowvhBnz8I2MoxbgJuC2lMrRHB/xSZXF4wgnYoFc0AyHDDp8njvgscIw1UTDCF8VOdUU6u3qEbRwX3/HSAPqSwtmMiQCHXoPkjSMhh9LPucfFkPe7Lc4ACuYaMwqpPTKt0yH+eTAhaeX5fjziB+6KUm3xQcJaEXAouvgdytCFR9B9238ZKE5YzvkTpX72sHZYETAQ6ikyWu+62m6v0blzShsMvlFRIXE3lcgBSCIK+J5R58G12f6T7+zoe6DPWhHp44Qw3ZHI2nM2Hrdv2Yc0I4bZwgwhjQTp89tjI+98UTM9I/vqLkpCHJP83orU2SaGh8xMVvUo6Lir8+LFMJNd1WlYChSCfq2Lok15msmAl2OZDpTn7Q0sL6fnzQCrMQysqtZIfd8Dls9IsRWk+Up+zjdR0LjkSyuMXLKjPsr7/W4aE8snf6iC5pZF/5EwfcZb6Sb3OVXbmLx7Pgbsj+VikvMNgjlbAARoH/ExtZv/0dMdpHPksJ9Pms7woZsXRADJYOPAbsNDHPHH+mebwr4W97Tp2aunbz+YafDhIRf/mXBh+eLHyzNCVSim8hmdUwd5dtbBeB6jjX+7G/tHysmbfC5jFRn1k6hfYrdNGfEoIWCtK45xYyFCnHUAIu+6/MjHECtjLmnMHQU/s2xhxKTCyFbjANniI0SDAje1fzwYc2TOvr9MqAEijTuwt6qx8gl1p+ZG6Wpr7wH2KyRAjrQRJVR6LJ9uGw8qRd1jPZpD0zOaXVvGMLxfo/fpZt9l0pZhZqhhaKY7t9oQghoGtmv3OCQb68P/QPi24b2ui17yA6RL6OyibvuqqUKo+29oyFt3E0B96tSbZQHzmQlMrV1v27XXCH79U9avQAlfq/6noPd9uoR/qOcqTja/fKtD0ZKt2UN5HNijGinuXJD+yXy2HoXZWDqsrkbUSrFPR4SAO4o1nL3Vl5hMLCFVtDY2B/r3cmxEZMgMvWd0GG/u3dOQFregQcj6D4JfvWVYzFufDNr6fjz4bRj3kyzUB0lSruWP2UVKE1kQPXjnwPGiBAlrpnlCoaYSmsQa9DGzhJy1NDNkQmbW/zR6mH2+H5HDbtGKxf25FcjseeKRmeuEBC2qxzbKPF7H09Map4SeajuqjoCAXUyzvSqw"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

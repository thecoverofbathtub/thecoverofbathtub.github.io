<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"JvlPYM1T8Uk0P/GXW5a46g==","nonce":"X/G4hl1ZJ5wY1e91","ciphertext":"arpDkyLDhKUcVqV8GhaLxg2lZLd7R8KZPkPEJC5nuTqaZ3yb9muK2MKisa8y370OGttz6dr3wiSf3flzqGvevH0rU+K9gGn0jrmJwMJYSig9gd48lMRSHyfrORKXAS+zg+kQ/cRAGDSMldb3IJaYPm7G99qK1xPQ5YqrWY4uz2GsmiaOWNICiNLwostTnLaGFEIlLPyaDHA+Um2nH0HdvQtrghJOtNwDLGHwDAoL9DD4NXjZdJr5aTUHCLlEEnP+lghke20JVEIqQxK2iTb/WPryqodfqncKP16JxLz+rWhgDdujrz4piHiBq3zcqcT7IRfPnLQ1Y1224FltdyGa5QMaDWy1vcMs36G1/5KPtRW7yKxyJnWs+Io9+WiPBdNLihoGGjL2Uhr/xCUe/H8bU50hHqYrnMQe7IceM8VcxLPsydB3Cp+a6KIzRHecn+8FjXA0Apr7wK4wubUBAOZ+ZZ50HhNnJjVxKLsexKrMh6yAnzsviS+Y1ICtfQXgzngJtBgI5zOgANDfG6nN2Abh3VjPDNkauj9Uyg2L+HG7cImWgqR2EjCXBqnYoUzNyL1dVI7BP7WQBTcqz69MHEvkV3l+K84iSUgCYD1LM4hsk0JrPaDJS4jnlMP6aosoCguDH6/e1wMQs7SN9W6wAftoxsLKhyt6El3dsEJoj41FXyHxMc2xR0K7YhG/oKK87ESIl17uKhCkogsSLUlOcmm+yLn5NHMloWl3JXnaUbRCpW3U0NcxkHK7Tr2qK4HJQSyaClMRcBN7az1jB4NihcRT2lNLt2hxVm7TEZGvV70hiUjY8VBnOBHpeKmEksKX3ljQOlZj17bOh9aeZ7YB3TLTgYniBkX8NEbwWgsT5Q0xOifS1nBgcYqxfN4DzHMgGsNDAXh9xZveifL6DoxMciSKjPelfPlDK5XnfRAuvcOywHb/DSpMS/EdpTzPZzxd1D0pAS/UsBEGqVeVdb9GpDhHM3TDgo/W4id1LtMw/ObUpGuE8+fD4t5XyqObyIA3B5vfIeLOxg08Qj+DE447L0NF16c9fCkPwUxSftUBD9PtiivCy542Gho9KedcumTqb53/0VJKFvPdaZiBNRZytDX2K/SMYd11raU0FebvA3VDHFgAsoPRksuKV2B/ni2aA0dzPCUxlBe1sD6RihcyQNLUWieuxFqRkGRBHzU3MJzYHrQNKNSHUpLWlehFgOXIgpgvxLL5/pXrUBC+YzZSM9+9Q6pvWEh8/7g51bKWt2yS4U+Ol/mYpgf9YBQ+nnz/WsqMAJTJ2YWT9LCOUsMmN6OvZT8OX+eqINzsT4qfoOKI9/via0KzGBjKItGcdSMmgfq4gILr9tQAAKinYp0qMMFdqzutIBuzRq7nEp/TKOTi4vULf5O1MUeqU9cqlvgc4/SaqW5Kxx0r+WL/dkN7ANVgy2Ku8nOVW6MIQxqnLNLC2xq8H9auvw9wksgFnZ0TbMAeeIWVMIrdntRxB9owc0i7U72b5R84HK1wHz6zYRyVNjfGKPQt6IhNws56u4OnwoKdkdhweifnkkb5+rb0ifXUMjN82HTAVZLu0trmXJIYC6u8"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

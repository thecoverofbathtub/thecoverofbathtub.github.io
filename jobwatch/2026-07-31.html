<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"2OMkOfVBf+Rfa1D3uBbKmw==","nonce":"LpUF85rwnEtZ4JzT","ciphertext":"FPvuzBGre9LoQupzH+cil4QX6gXEFK/jmXbZPT11AXkAALoLNERmbWAD+WKGe6tX+V+R0Msnpnd4oluSzil8mFOhf+Iw8jlhKWRXiHA76TeVcNjU8SLh+fxIgmv/tAW+najGTggfpG+S9rlMXk4chWjs/iMOjg0wVQlWVoP/Opls5GylbRpLXy8JS3onSZdM3SJBz4xR1LzxPWPYqY9wDKQacBe6n7OTlEOkmP37Id1lBLTnOTgKt1X71GgAhzJVgPIf7cx/XhKzUBmJ7sLmAkTsryn9X0If36+nX3VDgj2R3AiVdPtmZgDHJ15osnO1AmwB0AJ8NVzdvMqyjjOBb+syLme54cp/oUdUMjerf7Y8aQpsdFwob5gfc2qVlS67n9bEaefPzOtxGcSia+PShmAnmw/9q7k18LaglnvVhE/mmD0w/YMGVV8mNl8dWfdmVBLqDQTtMyJ+LSp/fl4e79bz0FHMS9MuW+zK8Vs37dbKIc4zOZnOil9djDi09kESgRi0nKR7jIvWLWZDWzIxzwlVKCWQJ+3tGVn28cgH+jtHFb5eKzocb2qnVqXReLzJHJ/YyiCNqNo5zZoRKs1H10qIQxE88B7pR2Y5B6tk1WhumFw+VDHytbTQIIPsGgRbZVqBI3knqmfUY7+xzJEHBvmHLqBC3aaVACR6d38V/B6/U+wqg5jtSWC/lvmKuHkItU3qIJf0J4/fwtwCBEFQFNgnQBzeFH8CYA5opR3xEwmo/5FbmQ9uKaiSRYrBEWf2ydSY47Te2mJ16CZqhw3ACDnmbH3n+VUVvX2ofTrcu2TeTaEK40kPVBDkVZtFy2XpzfMZ4vRXtLNPGWQEDQsc0VgeEMai9p7tx7jAEV4Hi0ZNdcz8454tfecf+D6xggZGZtKdE2rkYbkPe4ppbeWwIHqBMjGotqb/DfygUdOl4stmY4QqLgHGrfzXFPUuRhlTQFc2+KxQ3/5MQ0LWbCx/mRfvQiWDhp+iKuo+Wz4p4JfwSf3JDZVspUzATyDQIbG2DRoAR7uhuBEA+OANneDr4/UCzBYiRgKkJMr9Z7IeroJtPP2I1/umtKAFuXqZiClU1G50bk6cgQhyOH2tdRQg7eecfTPu1NLHsu3Q9XlBUyems1VEORFCelt3+AufITIy+DCK5utq42f97mbzC7vf76XSp+s3oZrJi8UnnrvgPPL1eg5o18hiX2YvO77sLY3IrzR8Gnmn62/1opBqThkXbpJURk82JM9o27tfMGAs8n1BbfIGAAeoWaR38enNEXeQJW0ytXCOFuwm/HcIji3DbFAD4HHQVGMU6fBRlbz9k5dVNedeg0v69jP/iSSfACW1z3Qq/BX5ncE3zf7MbedWF5AnaujWVtuZewMb6zzSoUaXk5jQAfTqOlvNOZLFIsQS0Ck+dRBqk+MXl0bqSFuHQizif1I9M52dtyaIAxQeYglP6jbUaNPkzp0grbqeSD9SBnDDp/PV7cN6tq3MOqPa9FenlMMk9SNsGSYP4eRomN8WCu3obRseFYt332bf6hRis6HwGPX3NxURbknuLisUFNKUaHCc84QZLGz92C/uZ3vU"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"6Py0tqHpMdXbfXNsHPSGcw==","nonce":"+HsuOvfSdYnVD1gA","ciphertext":"AVC5BW5R3Jv3/+zMYxW1rX1bUm8z4XLibYYcLoLryW5l0W3PPbYYlKiUKFvM3KK43ByWxDPaU8N9ZL5NXU8sBsjOeE8xL4JOBOA1x6JhlEWkZ23pBjhGPF0rYxlvm0BGhsVvCvdMyKqEcgxKPFnjIlLgjXgMysaikP7ylXQhe1GSzMKD/Fs/qHGPFSidlm178fQx2Fk179tkM16DoGA7jdypwqR1x/6b/E6q8OVkCQIWoUWPRV+kE4QMJiOEWGDZuiuKZFBBiz1CAPrTXjlAy74GkFF3GDuz8t1ONQT92JilhnC0Hf2BO2Auc7ryx+NVXDTMMux5nUs0TZuNKX9xIC59FFObRtdXmZbiS3q9dcYcbaQiA4qugyovSVsGianLpmajZfo8zi3I1zJnkuffRRLUWYQBy6ilUhvJBq1POV6R17WF4LqZgB772/+HDJL2GixMFhXdNQ9cWZBMv0KKpss1VA7DW4EwmOwb6AGkXzeRn9M0wtZoqzlYDqQizhZdPPP7UgOHY5b4nRhR8Z1LZ5gYf+W2WaGpbnDwFeM73/jVhnrqWhmDLvtesBam255k2wFDkP2pmehigc0i43PE6jGwLCZWPiGKlNilzn6N6L43AqOT30BEelYLoqKguBxc5Y3sB4r2Om2fQfVQWIdJKtkxp8Pge8PUrJ9yVtj7Kwh+Dk9vjT15gHswDi5OY7irzCzTfBdKPTx5p9ucH9l5Ze1YtJ0dv7Vp3iHMM7GdBTTK+L5ZGGOFWwTD3pEgV62RbgRIW/Z9uTeZsUrCzJPEIVgW6a4f1RRTm2I1l1FGvmoTuV+/jvjJV3Zx8VI21OxUlh+lPBIi0lZUr9o6Kp2jcUn7xkQ1sMT/xU+4zA7b07jq8Q9crpcdkL7BGo3xBqS89CZXi74MXLqhlTvaNjOcxp48sW08Sxih55083SdpMDAmueqTTuxCe8d8MbJH8TUlt5o9SF06zH7hgadTLTOVeSEa27Q87o78pV9X0IRSLdaglrxs/XEn3k/p8bQRaVoL9R97cHAa9bUeUMJ3bTlyuppcI12tRKNENif4zss8/QRjYCoqePcV3dTHr6LlujW9OTdllBdNPHmqbNs+jJQ1NBj5RhISjM+u8bAiBlbmy27bJRNImgJ0oQlD2XNtwef3JEqXXwbai8igZYeT/6B8e3l7gHGfjQrOpEvZ69b3JL9EELW+JpaAGZnz2YuWId64nVeS/TS5ydKJRCDFwD55lWk5hpgKPjiyVXZpLjtwEDMWvTlcZYCVPYRqs03BEMIxdetqg2xEaDXDuCQATK0J6HmwMPnlIFWXi3w2l9+StSLnZCM/WWZ7E+UEc0rqFf/UZcQW9TE/NX4oiHTuoZVvt1L8TGdRtWhlnyO/SAAgmd+tX6vKtKnwfIXnKhTK8KH5b96NUHbtjfeb3IBGUCpG1sGIZyMy5GDDbSwzLSztGuzHvu+cvPuDwRkZpg4iBsp50yWyZFCkbQHlS/93uICDJ2hvomxo0yHFYvgRNDYj7q1TfaLhkgj4UsrMyKR4NuPH7AhNnya9PuvqWlSkJe1WYWiaa4Qd7Q+pgFESgA+3E7lw"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"tQDRLa/vlLmPCebKRcKjlw==","nonce":"V0osqqGT2lt+Ctnf","ciphertext":"vCEnCmSWVtRCf0jJjfO6fbLExyP578HNteL9A5HblFAJFvjbZPNbT1hKzOkStDznxJdLSlK+ggfZj3ss8kwzcrkE1pAcm3ZxLSM2unWqWqIkKVz/QnYnoTsHecsfjhYHr8aA0i3e83BuYiHUxzk6xwFq24fyWSBcER+rgTemGr3vrY+JaLDJwWN9xzGFUvuElfiLiAdAFR/+x+67z2aOSdr2Pyf8cB99B0t7JWfN+9qO6fceMOEggqADoxyRjCcInhmALzkt4fF6FMeLk/+uAudB+KF2TsXbFRH2+tjeosLiBvTZUXbxWfqEdM9WclsPrPDQ0jAvhH/mzK/nl8EU91bpcW2Xa0n3NyCDvRdb9+CLZZRggOH6BrI/OYtxPAu51UXgQ3eGizGZmx1c7WlrQZ5NmELUznAHDOe/uxUlOAqh3CYtkrnwfCN3c/v0LmnBq0UCc6KbtW04dKcUJyG34FHEhRrcs5s2m1Gm2/wzzbmDSrhJxyQ+IjNCMiO6FwkWMwn1c6zR3xuE2YJCQM17iYBOK9w8WZBfqZvofoHGj//6DXwLDZfl/qdeP+OACErdMMiPBhhi13MjY6Khdbwi1Nb0lU51hHkvYc/U8TUQ2N0KNFTlET+Yx2CMxNyFXFYYKdh3WxlItjCt9d7ynzr7j8/XZMrHj3pcgjEGnHyZAp9QcuDQ0JZZcb7gAoXYR0c1zxI0Ku2Eb5r2VAdG6Vp4/eF45UeJZB41MpjLSSkwf8+UkLzy0KhQk2tFuv8In3R0XPzrSDYubsh16udXD0i9upeVf2/yIPtVN7EAjuxPc50QBF3w95j4Ea2BjM9ClcnOR4O9ya6fr5bKBXur3FJDlDMmuW1aus44jVkb/jVnVOEescxw7xF+j+vqOeGaAsVtOMZsXnfNK+yVCxrDOqQ0V3Zzc2mru5QB6JQomJQPCgDTdtnw0kELN2uRK1o3V/gnHBqMzMbMG7nK3ZOWg12J+U8EjAChgj1HgvO3UFECavS3i7wE+8OI5aMUmpZkCzh+uuuDgvOdA57QcbOcC/Z7QoQl48jBaghh/cgHbL+qmVsb1OjsjJgL8tMfEbMQWbvNRV2q4KRQn3w6IrKAfcE3qMMBIpqdI56K8bxXBdp/kIHRbCkpQHfs10WtRLuBFN2GBMYXfuDuVyEgTQjjvrL7zSm+IL5PL7B2pZY0vMRKqmLqZkSM8MdqwkYi56/fC2ku2iKrD7JTjHry5xd9IUtw0dpc4AvzauiIZiN9cXqdnZP7dway4AF+8k87QP1qkwWnqAPTbG/5KkO3v+yhvA43mQu7fPhcpfO6sFVceqHbVrcr4lKwV43ptNl0mflxAx1DH68TxxD/11C1sKhtvgfYsVbIoOquhMSerK/nlYJ1ZnrmM25NS9DwomiC6Ad8i/C0DA9oIyDJhIi3mUTewKjCKEVNghlP29GyAAwhyw44kfE0ySqNXEKwMyaNhFnDj/VEeRxWASevK99X7qC/pAFgXx8p4wfb9kyOFfenlKTfXAjDPSXBf9KYYGdxdA+7hT0Tv1a/bUa9/nhDvM3gS0ptahbPq1Ailr6S7roUFwcMRx5d"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

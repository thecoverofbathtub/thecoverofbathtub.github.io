<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"wNBWtUHHec1KVwvuVJRt4A==","nonce":"4+I3HuKmEGaY/WxX","ciphertext":"cNIm76Z/YcRVA75Sj+Pbw5ey4Q6KcHsKZ6JzF8akHm3kawX8Jc+ghzGK+0PcexJVTiI2sooAkDmtF8M84u+xJovv8VmZgC3hqUQw7RRy8Uhr+Ce5dsaZXTZvAKiIiSX+d4FDKgmirYPzJob5qt4wd1icKLLU1hylE4SJF4f1dYnQrUqrfZs3b3tHZM3FXtiJRWBawHlAIHMbmnrIrR1E+QioOQ7IsZ80AZG4f/2gT9ZmAdlFh+OU8mo101mp2Axbl/2cdcTzAfgHkICx8ly8sqPpWgxjil6CxpbNc3UQMtIFgs9DbgiLrWDNZyqfdsXBDu8DrGMuqAtX3OzE9w1KzO+Un0M5k3sxwlQOw56ejQy8Oo6+weYOxDh3gse1VwvQ3D5/B4dZNH8nDnF1qEyDLFAkWtyWci6z6DPZY+W0HqhE/++mvkEFjjzD6qS3xlZsrMcWiPeCynkIzVYbfrKqOmfrXJLBOP/uUeW6DrocB9TuW5LsPIOyOHaulFkPaa4hzXSWqTXTsb6ZUec7zfLsQtKU8BQD3tk8SF0MwxcXzsBn6PBxl2n5+P3LHyrtI0pfQwujVqmgOTdkG/saPfE2j48ODmRbV8/DHAa6ZQA5luA0maRmZI8xm79eh8KcX1524RFBuC1A1Gh5sjAaBn5Mv16QH1R5cnBcrtzD6DRr7T2tKm/ZlC5gOGbT9/sZDUrjluifIVlE5mVR86NAkPIOY8NDyiPycB51y3I6w7foX5QGyguedNhrrgRF4wTib1WNuAY1Y7uN+JMGZThU04SlWy3HhRl9VQnLLOx+3gdpPUcosK3D0I/a+bprWm0/pa530gseG0H6RCzkg3IXU3YgY9UBxE6FqNQ/vp3qjaXUBpQYDpFYdBDAKBXcZFxpGI/h0WYpKvkh6BuDgyUUdDgG44QFunzZBZcnhNdsuRqIb7q9gNKtoGt8aOChYSul0VctdflzNmnQuioUtiYAh57NOn1PlGKgpNCz1ODWDn/aYHSbNrMvS4MT0PkYGQp8K5W/bE9u1FkJzwy3Sr0/BAozdw0HD93KguAktcd2fgkEeu5reen1ykkXl1UwSYyI0iqKoN5pr9b8bORg/hgyU9ABHo5z8/pUBFNzhaLWE1RLb63FeKw/g9wR+FWNSvnmcTq1JaQz9yHG9kG8KkICm4dP8j6ZjyVMsqcUTEgVPoqSzEXuMDOkEQ/4b1VJ/kR/lvpnrWtzUN7IBGTsTzakDTk6y9W3o9l78ihJSKbtIXlrx/njTiGav7/UqFQB0hzi2jUGHjfU1wfxRk9sfc6an4XJ0vAmkTD27hxDhgqcPUWvVx0GMsv/v2+t9+mgyLX/jyHXumYpqepYYNahT0KvaZmeZ4eiedXHz2b//KTph38hSwS9NgRMFLiVwIBbzaM3BJGC9EZbvTlSbfV8OYo+rKuhAOHzy4cQNR5aOfaZ93LOYiVY/Q36NC0C1r99QnAUIrGszlB1d5NIlQ/s4KZdFmtvBnnqm3m3w9+UNAK7YRfNzNY8uMLi0259LENuT1v+plcN1D3kXOnra5CCD1PpnQwnjbvYVTjy9o3tDQHHY5kn5z3C"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"+6xVyPWvdCJjue41XVpLTQ==","nonce":"8LwFkFMagqdUooiw","ciphertext":"OAnq9pRvhR8dmD7bcs/C3j+Mw3H2uEwh0zkBoKgmfmsK19AQaVirCm2l8/OZRbf0IqrZ3+iQSyhoQ5wHNi3UgI09KnKDd/4uJJMxETnPwvp4IBvcwsJJG7KgQlAWpgRATPEMDJKVak4fwk5wCfHpc1q0QA3+CUqQt6iHfOXXtzCSbWEhnt3o2t1cE+NtQIT6zcGbWIDRVbGY4ZwpPrF1bl9cqacfJETeLAV3yjSLYIB3y6TXURSQhRIfQQsa+5BSF/Epq3vbmN1lIIaRAJRzT176uhL7oM66Jwe5mNHgcXvP3XXv6bJ6zfskgMGYgnkLrqCwzuxjkCI+P2A8IyHwI+WGKL76sv2gx83iXwm7QF3WzGd2xW4wTvjElsDJbqTB0rDCsPL3BDf6Z15z4InAfB7WXXeCfQRqmYx7itJAxOvwwYzQk9IZ/QZKXFBJvVFoBrYlZ1IXxKVK7ksalStKEspX/gtgjX309rQogyX0teL4R2Hx3Um1BW4YSaAsfY03ursrWwED5N7cWJl+Cj6ep1HX0SUMyf6RDMR7R7ePOP3le86YjhFfTKl/zJjLvQB0IvAo7JcyP5ZVl2FJRnqQg50EeOpCN0tsqQTL1YUayVJNEeGBMk+H7XCsSCqdpog1uIpW1GLEOwh/18GjGFBH1M2bbMIpgUXdUf0aFQCxxQIT0OXJDB7k7oLeBnS6+bIE0baeczh84NMqLXn9ph1SYoY7olYClZekml5rmz0JsU5sAM4uu5wDaTvzgFNndn1p9EaZHy20IaVB1OLQAh9mxDI5AtBKHLP5psTf3I8hDDsnmrNSvYi8f/ZfKnAytX6Y34BZ62rmYRahMTQ7EQ99y4+Z5eQnOjjFYiF5Iyyviem/WThjSSQb414jHzbBwj6swqnZYtmtp33NMyEKhN5SU48NCcwsUoTvSB1zvZSOghHvWs1G7pCz0mbVlmvIGV1pgNXi+Mr4LFbQSgDeoF2KPe1s9y/Sq4G3QyVIG6sgYQjmlS/D49AiD2WPwi6V6gy01JoMv6q3UpfSgm4atMMV6397OW9RPzw5Q3PQvESP2ji10Qfd67GB6cgBLNtuRQtggixkZAXvXoGf/wlKIflbgbYsDdKtrKa82kcdLTNx1xVnIY3VoxE++r8gxyQ3pvnHgXGfwKU2epl6gA1/0I2PFP64sBLLIuuv4Lnuh8wE/9TLLxpaiwphK6JD68y1EdKlTvUs+gICKGmCxBvkQFVpio1g7WvzwwdMzSYNa4UDXErNah2k7x+encrg4H+ZkiB+M3JurBY3E6OZxZXezgg916IhIqEAJaJZI1Yba0zEsG92eFB8nZGXArk6PIIGaViKovkTUMQue8iCaHhygV2VWyRa/61bJnbFrAFowG9a48a0BY4FbqEvngBm2h5cmyzrmxYLGoYkYnJENw18B6bYzjjs5kT7ANnwKnMldsu9CZ0cugmzsriVB6WQ/45CCwqJqT/SEzbOOzjtOba/v5UAF+o+xuSeq8NE7WTGNN4TivK8GEzu/TpWLi0cveztQufGPafwmW0ChUzBBViwJ3ww4kUv66xeB7GrWfCERVXXpQl0"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

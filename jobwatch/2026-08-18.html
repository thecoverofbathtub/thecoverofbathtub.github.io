<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"RzHFI/+DD2rYx78Vw2OlYw==","nonce":"aahHmsYFtkGa8L8p","ciphertext":"3nA2qArE0vPJ94H+niuoTn/vtMO0DskxbYsw3qEx9YdHyfcrZvmBzpohw5BJhyrm+6yjTxHerLkg22q/7oayiZB/S2IQVGehFC/5Fv0CELiKiuk2H0+Apg8W0YqFYXTIEsvobnkCuyL3X6SibtKYAhSjMLGxPEbDz7vpUulW2P2gQisZubvT36tb+anU8vLj9xJpVeKr+T2zKYe89Z7qjGlZFbHNEMQ2J77mwtZvgUa1uy1n6y9neOKqMAougWAJcCPruuUfIEjP+whFxoskaFAnGkxAQFzLDK1I/4jb+mb2cJUuvl3QIKei4eYHcI5LPNpqtJnaSFtVpGBfvHqSNHv23nuPbR6KDJtXBoqI3nVrl3Zx4tW/hfuI9/DCqYkAWyBkkQkpZeuhy0se3lYw1hXwTGDKsJd/MgPedymhzVKXoNw5R344FkOqHn6rYJcLGLC4ah4DB9FEgoesz0wLDJpdBl6qWSyNk0Z4gXIqSVxfS1MZnNLLO8N2ZHROKufze7xBmYleLjrlx3lEIvrYoIQdZjM6MeYKhEF1Gy8LPLtWbHNhXGBy1Ct/X8Ji7H+dPECyI9OPFuFPyjiqWVItfVENXEvLJhGSBOU4hrGWQ6eYVMeNh8QjQ1XmYA93zcndozaUCtWlx2pZ7YNe9Bi1w7sX3e7LIKaRYhip+xxMLb3LBvNZNe45aKGkFCwXWAttsWq9RxXjuPpsV54Mur709muB4HlS8fimM82yD3XD0wylTEWn2IhACOzmTU7u3AVYY+F7iGALQLF1TSI99s/mP4Fx4KXVeCACvYEq8gyPzkeyj2ogdjeZEqGQtciG+vcKu1y1+l5Ckow7ZUX5I73Pi9fqDzlKEGbzG41dSLkVHkk5GCStqRxexCtx6xdkjywGGMmvWnwhnu7Ub1ZZQ+5/enGH+mRkRyTveMKuetJTze9T/+deQ5RLaOxyPUEger51wBHZBUzBR34xRE6g0XQsV+gzSCT+45vKWimM9JKUkswOOKmh6pzcYR1+WxRaTVnrlAvZAUodwbg5aKv7Z7eRMWzkGfQ+DBMsULObW8daLQAhtHyGVXipZY2STvI6k8cuu0tyTUT8cfpJQF6WmvVo9ybOypYnRbG+NMA/pF3vwQ002ruFqqOBNbeRae1jITanba6tRriPaqZDRewGdiBgSzQ0VPFoGCkPW/SQ3h7ZIZFVz7b1Fg7xLYVlXOE91isjUDemkCDsu32A88ntrp5smedkQXddFVKwFBPiCRBFgsoZlyRv1ChYn+s2AwrtA69kzBeiOUZKkG/BTEpfh62wCcTSxlYKoRGKBtMtvt/JbJyOrhxaO1w2Vg4LW/dBX7yIP+/EJoL0B15LauibQ+BIeFjFTjHAS03cmkiPId5eGpGTn1OgiY6C/+nwrl2jVxaGb6EEhEB1FMPIhvGxzinF1Sjm8znDqvgFOc1gthjLIHxrVqOH0O7z24yibQN66zRDbw9X0b/c6xMiP+ERyLLzyqHFZhXvqOmuPredTLlao5vCxTQue/S1BASMuPe1ST/5+CbH1/u7BkRW6nZYwGcKTx/TCBwzIO5fKOPtROaVOWxN"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

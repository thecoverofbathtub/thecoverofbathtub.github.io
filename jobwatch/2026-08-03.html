<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"iSOi7AvqW5AsK9zwJi7zAg==","nonce":"pcNy91Mgo1ZZO72I","ciphertext":"RmnGUpE1IWYXqwl9xttL7qOgyWAefzeGcQ6HPba/0kZDpWluYGEsYhUxQ20cfvckXYtc8aRw0XSYT67l0lQsSjoASJtKAIIg11giyHuxWJeNSyYkkOZf5I03ruSbOvOXKR8GRFLw0JBn+ppRQXkP0fq4ycg4+UgKHMqbSklojw4+dJ44O2P/RnfIQacASuFC0TnP5QQUybyVwJpvDj7SlvQDMXWs1gvTi+awHyPMt0fcSyXdqCSAw3tyWyAuR/b9d/1O7XJmnkTX9ZAiNFW+ztZdC+d0RDxaZWe0+O2Am46ZjCSfhVq1Zr+YFQhfXRFQgTvLkONdEXuGCgICAxqeZM8yTjos2EVLgMG3OZnMToBAi/1+6AqrmN/SQh4XtTIWSpzsF/GL1B1qe5iDe9nV26GDRFGYpuJ36zt7ymAYYwlgKYk+RLknlftYSEAyQ01xbxgFIFCmJE00Vin9Y7E47zya4j8vE57x6997asWHkCHNhuvwOi79JtjtaIcm/RnrQGFRbzQsk4of/1yzcTfUsMdJAD/Gq8ww8GqAwOxii4CeYJmJ8ymzEUT0xncG4wY5zA6+JcPj54ZBhw7+jNRyvbCpse8/rWFGWGD9rAL2V9m+ON3anjHXFrBVaIrBOqqf47aCK3wcHjWnhr4xX4yR9ZNCNR9zxIHJfObJirshmgWamL4Rfw00rOuacv1EXUxtXyq0Bk1aVtxjsYoImNdsoQc8+WHs0mbXyFbexxq27lnvGIwkR99ZqdCvSVIbulVwxaSHYpDQk+zkeiWAm3J6uQ+nx59G/oOHO4ts5HuF3E2OoYTtS9dwEwRO4qyum+o9qutUIOUW+jPBnLs/nlI1Zyc4Jt5HU0i2e3++eG60MhrTW2xOceR0TWMlIl7vVKuC2i2tJIpJCV2Upo3c8LBEYzqZYnzCw8QOjU2BdGZaiy5LVDkCLbgeKPPzl7IYw2pZ6Pkfjl+SUiFg374iOZ0yrx0A88+uQ68r4Jat92fCnmBHLX5Zr6rhStTI9R5USzbn7V2OU5cwm3L0pdaVlHhH6z4yGHn1Ef44F8JDHkk0cpa1Qd5X7ca8lHcfUhbRwUFrDAjKLEEGoJb/RWuJBK8crGOba+syJP1Yfl1joRIwqI/nIEzF6YrNsbO6jeQ1Th9jDKVIJpeyFfX/HeUcrnMIcxAju5i0obNkSrj/GbIvf4f1THRamWIu6M58E2tSWS5GBY3X5W0jAc15qTDnnLXAOc/Cqq8dAuik/lXsd5WkoeIw7tIdJ9UCrc870Bxc9y8ub13/yrc0/324RlZX7eqgc6gHlFrrcvejmKaIJtOpoWVzmnWJHUN6shOPTveAaFJo4ZhDruOzBarxWHkHeMggAk5FJEWCLi9AK8s/HNUAq/Q28pmdcHsIG/WMrnHsD8UaZPlFdvLVOplbaXtvf6yMwzu8a9l+xE+FhNlM1ffUelkL1Cu8w1trCeEgxswVg3LSrxOWPEEPqBVa6setKl2wlIHJmNAoxZesM3yOu31afpMOnIChFQx9y0Y5bKePZln6ubC3u+IflXlD1VvANn5Bbdwe6iioJKONsa3KNV7biKyD"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"pQxKbRsurNqtJqvnjq7BqA==","nonce":"bkFU5WiO5v+L8M+c","ciphertext":"JVflMI116AIcnslkPHQipEf2N/inGVvyZS4Y5DLLyxz3V/XZWdfmLweglDGDxE40uJZpWjwkEfaIQJyiw12SGhXfUTMa97ikeT//6ZNDPlksamZ/2JaQzQidP/V4ykLzz9nKLOa0txo+aLiTc2jAUTwKA2n6zDOXpfcn8HTLJe7/3xAHxmamYOdcWLHXqDePj/jC1Uuz7npyXgtd6vBIYzNxlbws1aK10KbrRSgcrd7uh5dB+XAzHoMBpX+d7VA9BoLvx53cRS5ZgGiUonYI2Jk/3oyCDHPUqyAei5YLEyCmhRGlwyUHJUGJfspqBOIgfUFaHp4m2mhkETfTOq41IT35oJ0t5u3TtzAnDoLJ2ZWV63yE3W0vpxVgFvBpnTybmZ77gn7WWXgx7ff79S6N54RU5FvPhEhq/BstkngnFcjCjQ562aulZXTkSdw6I/m5VZ9/+SZxpyjEJbO/jlUMySuyiU1C2ecTs/uNSrSZVani60YHiUXU/LxCr5ikGUcQ94YFp1obMnYSxyfPk3XnO/dHvLh8NnladbamYbp6lRGjOiQaNVgduvl1oPPaUwAfAFh/0nG1ibZMrgRqw3/vR1e4tIsedON57xSDZUXOifzzW0sYs305lKGMHWn3WlxpVqE74+4puqsOkQ99fXZUGKTOepRfUl4d8gt/nOeK6zNjzPGCpPMP18GmQvd90wgLKsiTavYG/PurIwkzch8y7HRGkhpNhyczNfqJU+pq/A1YKeTSWshEFU9OY4QMOwJ8CaSLr1mnAUhqss/jsxZezTcmvUaqJdhK8hOQXb40soHKiGFrtwXgEVamgz1THIXeGD/5Nh7fWN4WoqjEx4ex5Kprvx/kbMIrfnwKT3beZ6b4X+4syOCpjOqpBM8rvXy6WHBAcd/cnVShzXC91v8Edk55EXPffTFbmMyUxsSUhrc6A5fLxm24G11lriVBQoHG7jBsIqkBh7X5VaoRsWpPe4Qt2vBK5ifUm4LN9+gAp7jNLKDHf5KPECUJ4NbRfjPKb4RJ0wfNTSYsInrH9v/YV7OVdQpPTFOqr/kXvY01etgc1GoFPgH0s0HtcjZ18hV6RYW90eSdo0E5gGH6IjNIq2hGYjLfzQTDyl26n/2h7fYXEpMoSh+Cd26mUTDsFjh7N4Ardwvf8/oZnXBOd/y0xoo3BTpDFBT99SC9toOSK46Cz2pISGzT6uIAhhEbp6tjvJlhXR69mWR/zosmJm2scrAMdKYl7RgKFBmnDfTCYG+Owc6IrdwCDWmnTyVdceHo7NUqrlktqShG56cAoaoyfoD9T5+kVUM0yKXyaKWIH4pvrsGJwmGIkkUZZdnbGuPqn76OtkLfiOGsVuXm8luWJHICUDgqFHRCVFw5pdLLdlKIJFt2ENar2KuTV9erPncMVQqw9JHyEbB40LSdvTSSp8JSGHjHc/U+Hl0pR4P5sH6gdaZVZJuNh028hwYMdRfBILLAP28owXQU+S+hjJnCyqkkx8qnYceyiBkbaUqqzPVBzJGGD5lcJorGDDZA86OP8sw32PCTdEvksuh9eQZAtgiU25IZ8QTgDaC+LsaOvrHY"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"mKKgu3E5qx1HBDt0KTdjng==","nonce":"1lHoJjjmoqGQKthg","ciphertext":"wd0u+e4rE7pHYVIMiDJCn+uivHe7jE29Pndd+Y/xMJDtNF0lRGIksx24Dmy7EIgBbKnpC6MDslI5NP/OmYZkXCjAxIvyrqQpiNSvOI+gvG8uEJwzWUdom1+jcZ9y8mOIqqUIYeL/CzLURmW4qQfljIYZO3VE8p2y4Y4wZNxjvPWLETPGZT4+ZEaxVng6WuCV5mqyfAwFbFzZCrSiyoG81b2CVQS9z6A2bZ5klPWWTqafwTblCasVXTmNuKdrpcZgAk8U19ZgEa5LnK6Ig0bCtitLvqMMMKcfrGYi9rNCWIX2S0Q0q8KP0FLGAdeNSwri9NjebBPL4np1UHnmL8dHwowIUv53AI/rMjBsTAlXhUCSyEJvPH7NwAzzKVCQ5nD3PNTyNWPYRfSBYg03wqnx0iHYxM3cfMsea1s/6JoK7g9ZwlauTLIRBrLhmb5JWlEhjyibnV6ZFDNQ31wLzcAElV4GDXl7hr8/eFjuvo9kerM4maHy7usjamesQ06UGbl/Ul3Q/VV92viyUpRKgu5XzUxZRvmYHKE6ty27i+QJ3wYspni6Rqx+6xNz//MUG7Gi99/5lofd8lmpaRe6BB7q++BgGQUj3lrXL3hDg2dLeQ9fOthGolTGdpzEZZxT55AuUP6CciWJQXPBhDZ2HIq/fM+WQU7rD5u5DWhhke7GW2boIxlcJixFI5Kf6I92irTuDpLugHHokOvBtcBZWJa63kP19Y1hIWItu/jIj8PgaS87n7/pE1NbXQPKqTtdlLqhG7q6skg9CCVCBuumpdv7UxDcARVZS2UQKAJGeEKHzfjkxhqwd/nw6HsoNF6P462vKlc5jKK8mfCrjB5vRP75akRYDJHBngRT6mWWbJ8a2/hMEioN6TaQJDM7cO9SFq+hHfETYEtnzFEn2WhOVRwuuWhlnAz1Q+ea+M/L4tp2d6Y7BwLTPU3RmqOCHJRhVQlQ33tv7Nh0fGGYQ2RW7ViYSvoGFrHDsG+VY+qy53l3ntVJIgZk3grVFMGGgAC0saYJCFovP3eps37Uc+XvobXoMNJSZghfeyMJd+pW/sGmC/iB1IWtaoOYHxMG/bbDMQMda3eIP4iB3Hvxututm5wF7fz0teL1EmrWIwlmEnvweQ/rYRwdWxLqiuwmqN0tkTH3bxmE82sq3G5AV5780rP0LHCq4rs2pfR39YefR+2gHTXZMZR/PmFODqdRjzGAzUpUAWfxT1dGpOlxHfo7/cr+PeP5tUi7CxnfWwXzjvqua9owGzXshwwYYaLdldmV5gValN+ir16SlLPuOkgqrn1szcy/dEXQrZAp56GgPMhFiwB+hXc0Ue/kkeQo44//kBgLB5JLEneVwgl3WwJ2UC7HPyLB2fV9/aIUI1pGgOGVi5tj8EpIfs22uKXhzZOGer4pqd8t9p6FCbdvqVXEffD3/z8lRYAP+dvTRY/NWbgYvYaCHQ7kJRXR3RY2pyN2FcnMAMgi+qIOFTLJdJEDugVUdBXbubAhWERr/hc9L+ohxfzXm21a08KLLekDO+o2fjF8VjAmey8jS8/RiWFO5yWEO98CCSEtaLWihfTp1aCcvoir"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"2cxDWbNL8QCRyY9KL+Eb+Q==","nonce":"LK9tKSIrQ0hcwYcB","ciphertext":"Ku5C0WZhljbyDbk91PIvqoOmi6878MtOj4GPKQzmt+I1NNxAvwjDl+PGpQZuBZjBSBiiVs3he9RnZKA2Gsl8IbhuFl+z3VcgXFVlvBUInplH3jIwhoXpxGz5tpSob0zrZ7agSziAWZmsebgINuqKW3ljMUKRdeZGOTE2hjodn3ycJ8jJmhS6LlMO1GTuxeC7OFnvyD8hCWkXsjHWUgNZlkHivLHgclocCDiRSVBEg1qodc+thHBkzi7nh/pN6bNusnuQAn2Nzt+f3iMZ2ocMFOWqUA7dnHDAwdmeoDn9S9DKUeruw2Ug1ZxflWmLYiCvhBUmMoCule71SHmho8CzTzXTOBrM+gP5Cmpee+JBNTpJjE4cVd/S692kkmog0pyaKXxvyF7myjgZ+NO9wQd02eS1pijlyX6wFFLn2ETiuHTAxzcuDW/eDJoktXWv5wUwblbBtpVye0jh7IRQPt2AuXIlBQ6QLFz+Tiidt76P6kU8JBcPfYxwDWZbZiSPr/3V4toFmiqt1qNld93oc7bXbGYPeUXmg92P/q0pHO9DTGcoVsK40mC3dyNtBuBH+qJxmBRRypWGJbFjIHCN4/tqpAZetvLA8EBefnW3qTbbD+ETn0Hp6GahJ4EVHayx7yhNvCqzkHwxwQIGI3dshtmHktl+2tPeFRgRzQ0uiuXgttJNJTYKTr3gRo1/SDTbk48k+fwKzsPzB+//GgxYKvjLDyGWTUNHI+doDpB3OXlL7XGTm3cbBflkKaZ35AJheOxJANeVZUDqZqM5Gze1y4v0wrmz+s+A07siYjw87eFXrnVdt5t5OP56imTKnx5adgsDHa/AGnpcB5vSKtg6Chv6SBTJwmzXkAoKDpFstp8DII2I/YbQdzWF/Y0dFpU/IhaI2z7996qfzd8hT2SEkEvgp4IEgOP1S3RT+coOPUYOrTvdRseLuwIGOJYbhzEJdJ5ZujE/Ni0uvc0YGGpN2l8qipXLYrIufwjrN5VjovvPZTbXKARR9IW/6dt3dDuQ53SWM6/GLK13Fmpl8TFhi2erjfAK+It3gKf90MN/pxdANOng2NuC/9hU4bbUqZiFNwpcFriYBH727hrJDRi0vFEujjVsIUrGE6+i/LmVlgv777T12LO0044UvXU2t7l+KqzIac1CdL3ahO9FPvKLk5AXc4Nftx/7ijL9bYQDhJ5inN+PidPBiCNtJFii7T+JruGFcnKtf211qVrwyLdABRY/EgD3M0eEYyL84fncFJhnY/6S8rMqWBKJ+8+C0XPyuclbaxkwHIB71dHkaa3oPn4nF+sfyyKByPBw2TDlIc+4f+Rd8dxnMxYRsyKErMkxUT11k4+zAA0mzYMnPq0fXHzPPdfOmDrzPd75UVuHlTPsHKRjKU53KfbARwfbRwxkL92yR2HjUO1Q4QzFkhr295YjxbngYMZSL4v+8OL9yUI7x4RZgi04bld57GkfKXRXnqYumkxJQBnbfKWrKqOwmiUsEgnktvs7oo7AqDbbAkAO9aj955e2EwhXxItUE/RoPV45H2B8x/RjD5y/2BPc0TwJBr41k3haiJauZuk5NhGnKiGj"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

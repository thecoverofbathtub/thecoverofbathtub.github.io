<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"AFYQX6//rk0wBwhUVb/Skg==","nonce":"JDOF/Z7dzdFpAg5c","ciphertext":"wmceQANjlMf4BiCkhfN99AmppcmmI4gntu2gnYQ5zmSWW5D5ZEqktihPEm+pIaWxI/lEi0E4w2kU+J1G62HQUzsRZiDhdjrx8CZpMMH1/g0BOzfzwGDjpizU64zmIe251qxrK62aVPbDli3ck3vZaOoQpyP8+5ngaUn8b3iygm6keoF7D+3l2ItMi/oH9Jp2egBAQ4XxpLV4vn6OJcsU3FtQos7CcIhCvVYlWuWyDRQyV7fiMyBSkTIlUuj0A/Wa2CZU7cRudYOpKXVvAcgWHTtQUqOy2rhRu60cS782bsn/aerm/Hi68SQ5xokk6i9rQeLQcX9uVfklyMh0Neit1wx3GwzJe0r1V2aPoTlxyO4WZy1Qg0ZBm06+xrScL18fLiW76sZ6YEBcA3NVetU8mBi+TRB0Zf28bhJMADSBp30O8LY9pXDXiwuB6KDhY7jqhZs46pPUEnG8XSPHAVhvNT3DwlweElrfmqUwUHqoIOee7hVhrsSy4KSBVTuFY22YzTDQ960p3dKpOa7fPQ6YsdTLRjOZGWHXAqpOG5rouTLoiDrSkbhfetfPK1DMn/eYCCRVBAy7GTne+M/oPkcLV+LUlmXm4Ece47QcEbjEwv3ELjdzs3s9ek3AWAPUVvUmgnZnJXSGhPdvt64ddf9IlGJlab+9x+ZaqLfghH3aE4S/0ZP+igz3AfibMHFVpD8cvkByW97KbiFCQkLanPjc5LoGQiUZVKqgd27sdQAbyUG6pw6eoGziN+UZBTBrIAuAqWF3lqfGkm1IONu0vHLaUDz6QJBpT+PkVQUKAfY0ZJNrKMxUWtrCfcLBOZzGLWGyYO1wAo8d4mUVpsb/ILgEUdVb/DXUdaRYN3PQoQqU3YTZeUbuNsb5wOk0CVpRJy9FtkRAh8QVNHQ4ipjsfcGVgJowYiAPzMaLUUuufbNwDPq/3LXl8CDwHptAGH+3unaKTn8yoEjveB20ZbO3MYVWCsRa0Rh5VXBxHK6NkbR8r9JACSloQ9iXMPYjHCWvwm/yQLhAzOwatsF3o5f3GEjbSb3YOPIN53qfSRGvxAglr84WeEQR7tSHLU7EYqCrEok/BD5dj4MHlRaF95Z7nhckZ21MjY6dHG+Rk1CiXNKkuew1p7ldr9dswSRJ+KhZ0FFH282QXFFFrxOGpmO9PqJi7Mj4KJPEARBXMkJ4rnmR9LWVgCmGbXsOQkMOAMFvMVXY7d2toWPvTgvXOXYLEkR2+cykp7/Kn16FVa3cUbyxKu2wprPRAIYxMCLt9Im53uyO3s+FSVs4E1dTg+mHWzOuDThbkfpT02vbuEhzI0PxeRghg+rJb+QZ4F5pp4s7HPnWTjJDbGwg0jRVkCzVGsCuV6kH03bvlzD60L4vwvj8UeEh4shA+jWZQdOVPWSdQ+DpIo6f1JyYcGmBJEYyTGiEIFFO03APhRT1y1Bpw/+bww49hekQawh2ajQQgh/6lnZ+JsOzxdu0e7Vft98GggUkyGoRZ2nq9oC4qsrDn2Lal27CVVcTzL4FDZZNT4JwFqYxHTvZ6RnbLiBL15fxIpWzO3WrlxHdaqM44uHUKLSlFz+U"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

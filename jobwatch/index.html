<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"ruCjYKHAT3pv7Zm7JwbcAg==","nonce":"5xti3aJKzDlgKe/4","ciphertext":"jQtxXXQqDdtBTUfkKklyTSEkthOLgB42Lyev8Kz8ZljKfIKrDLzA9s9h0kH5Vmd2UyiE+qfMScZehPhZsy429SspoD5Ipdg7EwUWAmMjLocrMoZg5+4ijngN/OB12bZZYUks/o1oqW/nqLQL1K0N3Qkwr61Uln9JeNG3VcxHGcLhKQsqcuHoS5dwcTf/0UHUFJ9Gnf7pycd+9kwlhmZckWRDqYLMzxPB46jqUQ2Iv8bF4+Yz9J4mJsQCEbSLjkvI8ANcNnGvez6VlDQ6aXf41WBQ/9QBb1XzVIIMcvIjWfD4oUeM798I2ORuIyq5NGPs93aVemugPmzY4/JConhhtPQ/P2QYwJKDRyPMS7B4FPGLlkJNEt8ish21J35YDk+FsZR/blFwmh/qs5/Hzpw2DbiEG1fKpEhGPTwXDHLVXMEJSyi6u/lG5kTiwJ3eiDtHPN29p8Yi2QKWYrmjaRYUvHbVqm91O+WTUIZxk8Io3OJau1slO8seISJ0RO9RuFM+k651wDk+mvK7xvMpwrb6HYFepQQG15gikCoUI88/+UF/0AmBl9W2zCPKyRWVic0xL024gbuHo4AkrXuun5x1+Sb5Bf+REZLLdhq6FjHY+MLcRP3Z2Z0DIbHCzhoUmUQhgWn5mjK1vPju0hxvT3yZPg18Mg7j5gKD2ogIsH7eYeJQ5/x9cZgodXBnfTwFA83VstiFnVXVcEPEqjW1Mdtc4T0REjShO6VMHigGdY4JIsLoK6uuaZVJ2M304ZK6oXB/nKDRdYroIsqCkiVTiZl9r38vI6BHz9aRyELomC9X51JZhaLn0ngdjvKQaVwkmBrXK8FpN5mt/DV0nLTus+yQuki1vUXTJ3oOJ6RlZ2EHzGcI127rHoJURvkubPH//xs/c73XHLWeTKy/krlOB+QvmPuf8CTtN0U3lYfO8kini412kiUKcKXkbunkOFLG97qE9NyY5WBpW7nTVnClaM78yvFAO2E5soU1fE9JHgDJWC37zg6EMwMt0qSOcKKjTTx9V10anXbjxlO/xOxzXCZrVUP/YXNqenSXvL3upyksNsZL+4B42HNqjnJl5/1cc8svRcaqnZTCgnCkzlno09fMG9BKyHMiYBsIvPtNOdb930JL/nqMrl9EJJWLpJNZArB8rDnJSOwleQd/8isxZYqdvSJQlxSYPAUg0iAOERDpjC/BCL03jOv71resL9nSlmETzgouqtZucibCFHYNefrjWekArA2/xjB3cJORplNDLsVitlNoM4rzcbOUtoP8q9MP4PPVglj48Gi0QDExDtaMcPXSC9YJapuXvf8NWjvc/OBVAAs8DBnndn0cdn5gUtPLjmnN8MS4K/Rk0boMCd6bovhYhNxTuxYV8tHqxwqXetcvQOEftookN4cZyswbreqzvPp5Fq7w7eF2TjQPeAiSQIpKqU6HTIQCslMk2W4k1A9sPKtg0Fs19I2YyLVV+6vDyWoX4kPFhgdvQ5x/uUJRdYdhx0v0LUrHSGBnqAGXXXNengc0Jl5//qEWAvL7v0lEnQ3+yK+f9MKkjEMSnjpMH68h9bNlbQ6Ld7v/axBPQaM6"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

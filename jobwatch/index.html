<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"BSAch0mczqEJDU1//Vh4ww==","nonce":"wF9t5I4/p7NmVLhM","ciphertext":"s900YLXonqYmGpIg+JJ3/qz3UiNWsocEztwjSFUnDK+FphAAsj7dLBJTJbl2pEpacWH7cxhuO2hOEIB4jRsyd6RKJ4CRS+ZtQpCaHEBaq667O2cvCzLEVixFWfQQZPwUbk/h6XDThM3WEvFe9m6clQ+kXYsJjxAOvqbfWv6NVFtmJKzs3hfaD9wWBskwfkTwImBj83x4YJeZnqdWtS1O4lj1yXXHmN3F4N9Xfj5w1Vy1eTljo3WhzxKu+CQ8HREMmXRAvQ2K7nZgsrmOrrNZN0jsguYdDh7zPaMH1V4Ts3rBKus7hYMPhyMqTgk0Lm7+ZNodONQ6a/yzbVBOuAXTo+4vkBN0Y1TIHqc8TiyxDVkdMdBKFmKLQ5WsIVtUmfPhoEzUkQ8dnZKMd0eSHoHf8xu+NhaEcQM+WQmlXqYRQUrFmmgk0zlZ2GA7cRXNfJ2tQssmaxXe6+75Xx9gZFtOiTtQ7NPuLYNqmKPadyUMGq64xpskgGLfoK3UHggEw0st2vLwvGEf+sD4IzRuHG+qpXDxPFQxqlRJILVynCZtdpTLBIWMht7rHDUPQBPJ6CX+lwe1cnAoOZW+5Srj3fwHQfnAwUUg1yRjSwjXdAtCbAUuJFhq2O6fmYyMIGr+cWksEAXUUzU0rg2/LiIQ9hZfxAgkuhx3wPmp/HrHaeChgCyCnD+gbxsDJpJ5m4LXhS0FcaW4cQtSU2p6B8+xQImcIuNC2yp7UCTjHIqirwElgRy/ULbFO2C7SVtI21KcqCu6giZquonekjRObef4t2UTWTmBV2rYUHxvUxD+IvcIe+OuzbUAFp4yQEeksi/XM1f0jl6gGuf9nFOx2SS0OaQZwoH27h4zHef3AT9EfsTL7EFOceo70D9I6ufDqmNm9YG4ga0sQ/L8milK+L5u3+PUpEtWwm3k+qqvW4s4CQOpAsMlBvNGJY4ocjwO7bLbscNG8L+YL7lfmAzpWzTBZi2r/3LI74uqKlz75b0sJMkm7K9TnazUDgmGDTck0LRre3kyFCm8qbajHKoDqCfnD1nuomiX9LJa8ZPZvmGRCo5RT5RPbsIzxwlx43DDM2y5IBaOabEGXopnSqijBUjgJFDyhcQnuq9RpXqBOJ2oPL1nUqh4KLM+2qnEpGHrR68dzSuw1BHl7ZeZF3l7zBrszJJQ9IebOXFlD5Da89CDzOoKBRoCjB6UlH9T2zAddfhkI8QXHAlRsWSOvP4soFi4mYHqlGhkCMjUXzGmzXKbx+ZmLnF34rI6IY+W1vbBdALII8+MCzqtSNaDWTtSiNuR9yUWGDBZLPh+oUc8bpRKvUlN17OaQmAp5SW+lf2GAzRW/j0vyZcYzoCxYwBi1/knwpIL1zCxYxrWrSqiXiaam7zWAi1rSy8Op0dz5n9oa9WpxKOwkLSvV8nz8FyLKQqshQRDh39j0SCIH9dTyFE8ADgOTTD/DEo0B+/Qj3RNoffzDDGEPYP6/krh/23x7RF/zq67w75FcjHbGyfrM21HfmCfvpH4GZoAoSLN9rWdEYv69ILeBZGZx2y5Vvoq8V1N7racqfF3M16opnhEEYDAjyt7Tvtz"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"oXcbqbyN/jVrLWjTtMHfEQ==","nonce":"iMYgMa0cbAVcEeTN","ciphertext":"DzArrUmBrG9uJRX6yY3aH7BSLr6gwVR59n2vvEiliQFx++skc+tE0vxMpEJ13Q9Ft+EXrIEqDgaLK+Kq7DH3kbkvKvySxCxE940D9WeDV1Y9srje/K81UUFYO3p51CmB3pVNSvEB2OhclJrPxo4yeCjPyU6j7QSAg38ZkBoeCjcRcLpUAMMfRe6wKUFWeQJYvT+iNj6/Nf2GWxV7pSEoMhJJ5ihBBpSFZ6s9dDvhQa7cFERwFR9JCXsB/oHWFeGk5cG2ITt0errKPBlI2dukzsddjfUqezsBgFyEnSV0QOL5icvULP3amIYRQmw1nDwm+14HOfKikAbR0Pd8kiLcJ7DZD2qpFvjqd1BTK84vJDrwCsrN3np/fNS5yG/16A+i4RMVRqtDJ7IMsjtkle9wxLb5FDHOke4hItGHbAVKleGJfxc2vqyj/albgcZBvaeOVKxSAkElF6Dy3O/gTZZYWR5E8heVwRFqHijLqC/rm91txJ8+Op6nhJF0ntMGKerddYMGoMhStwRHSD1nrgrb+9Ke483pKG30SqVYkQ8yKohUKTB3RKqyyeWBmZZ79sgdY24AL57eRP8PogIhV2QKl6CkeEUzK+ADZnsIwEETmFd6uI2q84+EnCCBVHgxAx35/d7QIeSIySUK9h6HVGOgcKYEYn1dtHc75PuhXuPcs0Zi/lNHQSvKWDwmN2eIFN6GGG+WWGuK11pGDQ4GrQaG6NiB20a63dSuR5PgL56l+Cm4WsZmjn2oZcZCwOsSsCS2jdcEfX4jIWxTz4q4ZlEXQSz8l8+m01rnv8gFBjfV0J61u3XzLD9G2kkeJGkC8NT8CPw66NZ3jIlIym3ktUklpehSmPw7Q7UWh1gb921nVfoHnhCfzAuY7EHGu2/aX28qYkJlP9gEjWyec96RN7bSnSIatPgw3DZQMxunfaEMMRNd05Uopr1GZxq2e4veNfkPS+LKywBKx8f07Cc20BHHOCEQFWZ5gn6tksBCkiCaLJ9BQOtQASytH5GRhG0K/DlI6NhJY7JtE9rJqKHod29bsiBl+tzDazswKS6nndGisz9CrEMbZdgEGsKops+hnndVfZ5V6rEjBSfC5Xm7AquPvABDx2uVwIp84NU69EDYbutWIxa3BR7Q8TFVJtehrJ5Bq7vaC0HAuxLvQTeQ9Rcgx/jD5I/7F1Mf60kSNsZHU8YJtGnFj9rmI+hU7QuclwSiF/YxfYNdWnON4w/PDJvSPQRjc9P1vvnZyXme3ri4yeXvy/OKYmkXuOs482KTK5suXOdqgUFvX/lFJh+HS0EyjGnPz+Ee60AbSYi1MGMmilvEztRgkYzdnZXaBhHSCTSqL9PxxpZMgxYdlXNIzz9yX+7tivum8uI1wdZWg7kfjJjXr+O+jWeJb601o8jWrApBqcwGZeKyDBxYaEOnsdVS/0iLTOgX4y5eew5mG6IJ456vriCCM/ZRCq+21fWOYsTD6m1tm/vtXYd5kXIC6jJrg2AcvLHPFI9PVm5gq7Nto7Ih9EtzZfAoixoc0BOAGEkHm6lci2bT0NzeIXtQI3Pp/pSbG65+ATG2TBZODXlHi4Hx"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

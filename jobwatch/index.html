<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    body {
      align-items: center;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }
    main {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      max-width: 360px;
      padding: 24px;
      width: 100%;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 0;
      line-height: 1.2;
      margin: 0 0 18px;
    }
    input {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      color: #0f172a;
      font-size: 16px;
      margin-bottom: 12px;
      padding: 10px 12px;
      width: 100%;
    }
    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
      outline: 0;
    }
    input[data-error="true"] {
      border-color: #dc2626;
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }
    button {
      background: #0f766e;
      border: 0;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 750;
      padding: 10px 12px;
      width: 100%;
    }
    button:disabled {
      background: #94a3b8;
      cursor: default;
    }
  </style>
</head>
<body>
  <main>
    <h1>Passphrase</h1>
    <form id="decryptForm">
      <input id="passphrase" name="passphrase" type="password" autocomplete="off" aria-label="Passphrase" autofocus required>
      <button id="decryptButton" type="submit">Open</button>
    </form>
  </main>
  <script>
    const payload = {"version":1,"algorithm":"AES-GCM","kdf":"PBKDF2-SHA256","iterations":310000,"salt":"EhMjPnL8MKco0hMHxxecvQ==","nonce":"aSWZEKw0BtwqfRHG","ciphertext":"JFayMko33jNGK2zli64a75BApMZ0vzC5KUBsNKcIDtHWhcmeeGepSaCnHtXcImFQYKtMYT0QKozYY01jGo8pLYZtOZWYr5t6tGEhQChUIRfVQffydy41u9SdRH2Ew6Mwn0l2UeVoBoLa0BXzCbXOzf4Twn6QBnGs02Mr+BZmiSFYA73i4PRkTNd+6DCq6pVfrZ42vAbN5JjnR9TVz3a3T013fq0dtWCthV2CT4+KjsoAprZNXC63E4GErI0wcBfa3C32O2rXuCkJd2phq3ckCZ+NlrqzBJoXtM3hOR2epPpAhrrcn2vpWmH3H43cWI1o82UvrodtEukGIvqXw2GP2kzpRmB419eCy14NTl18Z/SFZjhYP2rHs7V2SsVJnWeqyJqGuNor6kMTlY3uumi5VuSmsY7dnK5aKnKYWDizjyqX7Epbbw3VRnYqERuUZMD7P2NkuOqtxTz8pIVVSZofQMXYmF1uYOjeOh01mj9gDSnS0p0CPqxB7yp+4OWAaK+aixWx0UHFDhhwWbuNwJZFLIe4lfqlA5QgNHsE00wGMwUH2mQ46pk6hpfZs+ukCmdA4cDME71FEC35LdTNgu/HCYbfMcgskNFdVSnnG+PF4ZvXkAv9K72be1UtKiFiY3KVPWkJDGhVpSrMXsEjQvPXTyzBmUxcxWPj5lBAefQv8YDO1JQpu+AlgrQo96KJn+/LIpyZcQGEGGlKJEYtQk1P4+/QMmpxEnwssj5YVaSAJusagugJvJFPQgkED4C8TL3qSshbV8t7W0opmRJpmK+uLFie6CBXAKYCRbfZZIgWXoM8gruE58dFDQgnN8u1CI4IroQb5WEDpFImxrscyIUAsWP6Pz7rTBVCilH2vrkUj6kruKtoBxNp9TKqFiquYYPJQINz0MMG6AWUqCppusVhffZb2mJ4XAwgOS8NSlb6alDrGDwh3mlDQCTtj2y1bPoHAN/Fu65j9JqoZpImoER9bGmFNSN2HAU6d5m+hwUgeURXn35VNKNE5a3zK0f38RZgRO/U93X+7PvVU6jiNf25jc/POsoxCbnh7SRo40QVi7PWE8Lm9BTWnpF/1YBVPs16sRhc614AsCNYWjF8CdEFp7hhu8U7kivEh4gVYxabnGFULLGkiFA+iESSTBN6xMnUpOfnw5sPhEOu5HGnCZeW9pyjYwra+ybW0h+LVgbfubZGi6UY7jDK4zvOYnlxlyUG0mdcAETVliTusux1/iQ7Hp8JcuwHSbRO3btFXF/D6ha18wMCrZc/v8iR1I4Z1BU4aymnhlalQo8o3qelvgDW4p66xV3i/D++6dsGKvb1dk2LPyxfDay64mIE4qUCdqMwFgMfeXQfA3OLhrMQ/h+wosjgxbsddmsOIzdl/UKXOxh4KyWTxgu2tD8pa5zjVupd7g2vQjF6+reJBQ7S/xO02RNtkPChErHLlurbDmIar0v08CiYemQ7jh1LTFZ4Nk3y8QKB8E4uJ/hgKkvenGkkVTBpD4d7wPeKF1oPXI08FM7F46r4dLWbGjmDnrcRSzUbG4Fy8d2TSgq71BnZ/Tv7k6GW8SjDa/yN4XC++SiC3z0H"};
    const form = document.getElementById("decryptForm");
    const input = document.getElementById("passphrase");
    const button = document.getElementById("decryptButton");
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    function base64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let index = 0; index < binary.length; index += 1) {
        bytes[index] = binary.charCodeAt(index);
      }
      return bytes;
    }

    async function deriveKey(passphrase) {
      const material = await crypto.subtle.importKey(
        "raw",
        encoder.encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: base64ToBytes(payload.salt),
          iterations: payload.iterations,
          hash: "SHA-256"
        },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
    }

    async function decrypt(passphrase) {
      const key = await deriveKey(passphrase);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: base64ToBytes(payload.nonce) },
        key,
        base64ToBytes(payload.ciphertext)
      );
      return decoder.decode(plaintext);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      input.disabled = true;
      button.disabled = true;
      input.dataset.error = "false";
      try {
        const html = await decrypt(input.value);
        input.value = "";
        const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
        window.location.replace(url);
      } catch {
        input.disabled = false;
        button.disabled = false;
        input.dataset.error = "true";
        input.select();
      }
    });
  </script>
</body>
</html>

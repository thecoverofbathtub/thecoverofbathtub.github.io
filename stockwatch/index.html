Day 19 of the Iran war delivered the most significant escalation yet: strikes moved from military targets to critical energy infrastructure. Iran attacked Qatar&#x27;s Ras Laffan complex — the world&#x27;s largest LNG facility — causing confirmed &quot;extensive damage&quot; that takes ~17% of Qatar&#x27;s LNG exports (~12.8 MTPA) offline for an estimated 3-5 years of repairs. Brent briefly hit $119, European gas surged 35%. Trump explicitly threatened to &quot;blow up&quot; Iran&#x27;s South Pars gas field if Iran targets Qatar again, while Iran&#x27;s Supreme Leader vowed &quot;blood debts will be settled soon.&quot;

4. **AI/Memory Super-Cycle vs. Capex Anxiety**: Micron beat confirms demand but market wants returns, not just spending. Samsung $73B record capex. Helium supply risk from Qatar.
5. **Defense Spending Surge**: $200B war spending request. LMT, RTX, NOC, GD as direct beneficiaries.

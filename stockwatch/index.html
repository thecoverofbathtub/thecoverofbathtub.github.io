## Market Overview

The Iran war&#x27;s 20th day brought a structural shift in global energy markets. Iran&#x27;s missile strikes damaged ~17% of Qatar&#x27;s LNG export capacity with a 3-5 year repair timeline — the single most consequential development. Israel pledged to stop targeting energy infrastructure after a Trump rebuke, offering the first credible de-escalation signal. Oil retreated from near-4-year highs (WTI ~$93.50) as the US weighed releasing sanctioned Iranian crude.

Central banks globally pivoted hawkish: Fed held with inflation warnings, ECB floated rate hikes as early as April, BoE unanimous hold with hawkish messaging. Market pricing: no rate cuts before 2027. Gold had its worst week in six years — counter-intuitively, energy is the war hedge, not gold. Goldman warns correction risks rising and bonds won&#x27;t help. BofA says Hormuz must reopen in days to avoid global recession.

**Intelligence themes:**
1. Energy supply chain restructuring (Qatar LNG, Hormuz closure, Asia redirecting to US oil)
2. Global hawkish pivot / stagflation regime (no cuts until 2027)
